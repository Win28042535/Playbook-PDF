.side-dl p{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--ink);line-height:1.5;margin-bottom:var(--sp-inline);}
.side-dl b{font-weight:var(--w-body);} /* per direction: no 700 bold mixed into the "6 ด้าน" body copy, every word stays 500 */
/* ══ SPLASH / ATTRACT ══ two-tone headline · drifting brand assets · card carousel */
/* overflow-x only (never -y): the CTA must NEVER be unreachable. overflow:hidden on both axes
   used to CLIP (not scroll-hide) anything past the fold whenever content ran taller than the
   viewport — on short/awkward viewports that silently ate the caption and, worse, could eat the
   CTA itself. -x keeps the corner-bleed asset scatter from causing a horizontal scrollbar; -y left
   open means if content is ever taller than the screen the page just scrolls, never traps content. */
/* overflow-x:hidden -> clip (2026-08-15, real bug found while fixing .sp-cta's mobile sticky rule)
   — per spec, setting only ONE axis to 'hidden' silently promotes the OTHER axis from 'visible' to
   'auto' (both become scroll containers), which was interfering with .sp-cta's align-self:stretch
   + negative-margin bleed calculation and clipping it ~15px short of full width. 'clip' doesn't
   carry that same-axis promotion rule, so it contains the fan-card carousel / scatter assets the
   same way without the side effect. Confirmed via direct measurement: .sp-cta went from 413px to
   the correct 428px width with this one change, no other visual difference. */
.splash{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;padding:24px var(--sp-edge) var(--sp-card-pad-sm);overflow-x:clip;min-height:100vh;min-height:100dvh;}
/* Each asset's --w is a fixed px size tuned for a wide canvas — on a narrow phone width the exact
   same px size eats a much bigger share of the screen, so the corners read as crowded instead of
   ambient. Scale every plane down together on narrow viewports; percentage top/left/right/bottom
   positions already scale with the container, only the fixed --w px size needed a mobile rule. */
/* First pass (0.62/0.85) still read as crowded — the FAR plane (gold/heart) adds the least
   (already the smallest/blurriest/faintest of the 3 depth planes) while sitting close enough to
   the headline to still register as clutter, so it's dropped entirely on mobile instead of just
   shrunk; MID/NEAR shrink further too. */
/* Second pass: shrinking alone still wasn't enough — measured the actual rendered boxes at 375px
   and two of the four remaining assets genuinely OVERLAP real content, not just each other:
   "card" sits 32px into the CTA button's own footprint (the CTA is nearly full-width on mobile,
   so almost no side margin exists at that height for anything to float beside it), and "bitcoin"
   nearly touches the NWNP hero logo (which is also close to full-width). Percentage positions
   tuned against a wide desktop canvas just don't leave the same margins once the layout narrows —
   no amount of shrinking fixes a position that's already inside the content's own box. Dropping
   "efin"/"card" on mobile (same precedent as the far plane above) and re-anchoring "candle" +
   "bitcoin" to the ONE band that actually has wide, genuine side margins on a narrow phone: level
   with .sp-sub, which measures ~73px of clear space on each side (vs. single-digit margins
   everywhere else content stacks near-full-width). */
#cta-slot{min-height:56px;}

/* ══ COLLECTIBLE PERSONA CARD ══ full-bleed dark art · overlays · flip back
   Ink-on-card scale (2026-08-12) — deliberately literal, not CSS vars: this is the card's own
   illustrated palette (same exception as its font sizes above), tuned per-role rather than reused
   across the app. Kept here as one documented list instead of scattered bare rgba() so it reads as
   an intentional 14-value scale, not drift: 0.05 dot-texture · 0.09/0.15 face shadow · 0.12 stat
   track fill · 0.13 inner frame hairline · 0.2 divider-chip border · 0.22 divider line / back frame ·
   0.28 rank-badge shadow · 0.30 glyph drop-shadow · 0.34 outer frame border · 0.40 secondary ink
   (spark icon, tag separator) · 0.5 borders/dividers (corner tick, medal spark, divider-chip text,
   bullet glyph) · 0.6 body ink (divider-chip label, back eyebrow/title/stat-label/legend) · 0.72
   back bullet-list body text. */
.pc3d{perspective:900px;width:100%;}
.pc-tilt{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;}
.pc-flip{position:absolute;inset:0;transform-style:preserve-3d;}
.pc3d.flipped .pc-flip{transform:rotateY(180deg);}
/* border-radius promoted 14px->var(--r2) (2026-08-31, per corner-radius audit) — see .cr2's comment;
   same repeated "media frame" magic number, folded onto the same token. */
/* translateZ(0) (2026-09-04, same fix bug as .pc-flip's own comment above) — each FACE gets its own
   GPU layer too, so the overflow:hidden + border-radius clip that keeps art inside the rounded frame
   is enforced on an already-composited layer instead of being recomputed jointly with the ancestor's
   live transform every frame. `.pc-face.back` folds its own rotateY(180deg) into the same
   `transform` declaration since a layer-promotion hint can't be layered on via a second property. */
.pc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow-card);transform:translateZ(0);}
.pc-face.back{transform:rotateY(180deg) translateZ(0);}
/* ══ EDITORIAL CARD (front) ══ cream paper · ornate frame · roman numeral · iridescent hero · blue wedge. Always light (it's art — does not theme-switch). */
/* Editorial CSS poster (the 9 personas without approved final art) — restyled to match the
   approved real-card format now in use for Diamond Hand/Wave Rider (plain paper, no ornate
   frame/corner-brackets/roman-numeral badge/blue wedge): serif title top-center, art in the
   middle, Thai name+description bottom-left, asset tags as a bottom-right 2×2 grid, small
   edition-style numbering bottom-left. No real illustration exists for these 9 yet, so the
   middle art keeps the halo+glyph placeholder — everything AROUND it now matches the real cards. */
/* Rebuilt from absolute-positioned regions (name pinned top, art pinned by top%/height%, bottom
   info pinned by bottom px) to a real flex column, per direction ("cleaner, text shouldn't
   overlap the icon — currently cramped/tight"). The absolute version anchored the bottom-info
   block from the BOTTOM with no height limit, so a longer persona description grew UPWARD and
   could eat into the fixed 26%–72% art band above it — a real overlap risk that got worse the
   longer h.sig was. Flex column removes the possibility structurally: name/bottom-info each take
   exactly the height their own content needs (flex:0 0 auto), and the art region (flex:1 1 auto,
   min-height:0) simply absorbs whatever space is left — it shrinks instead of getting overlapped. */
.pcE{position:absolute;inset:0;background:#f4f1e9;color:#15171d;overflow:hidden;container-type:inline-size;display:flex;flex-direction:column;padding:20px var(--sp-stack) var(--sp-stack);}
.pcE-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#f4f1e9;}
.pcE::before{content:"";position:absolute;inset:0;opacity:.55;background-image:radial-gradient(rgba(17,19,24,0.05) 0.5px,transparent 0.6px);background-size:3px 3px;pointer-events:none;}
.pcE-name{flex:0 0 auto;text-align:center;position:relative;z-index:3;margin-bottom:var(--sp-glue);}
.pcE-en{font-family:var(--serif);font-weight:var(--w-label);font-size:var(--pc-fs-1);line-height:1.05;color:#15171d;letter-spacing:0;}
@supports(width:1cqw){.pcE-en{font-size:clamp(20px,10cqw,30px);}}
.pcE-art{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;z-index:1;}
/* Halo (a big conic-gradient CIRCLE FILL behind the icon) removed, and the glyph's solid-black
   color dropped to a quiet ink-tint stroke — per direction, this was the spectrum gradient being
   used as a background FILL, exactly what the DNA's own accent rule warns against ("spectrum
   reserved for rare accent moments, never a fill") and it was visually louder than the icon it
   sat behind. The spectrum now lives ONLY on the divider + sparkles below — a genuinely small
   accent instead of a big colorful block competing with the character glyph. Icon is now a plain
   quiet monochrome line drawing (the DNA's own "mid layer"), matching the app's default "light
   weight" body logic instead of standing out as a bold black shape. */
.pcE-glyph{position:relative;z-index:2;transition:transform .3s var(--ease);}
.pcE-glyph svg{width:64px;height:64px;color:rgba(17,19,24,0.45);stroke-width:1.2;}
/* ✦ sparkles carry the spectrum accent via the same background-clip:text technique used for
   .spec-label elsewhere in the file, instead of a flat muted color. */
.pcE-spk{position:absolute;z-index:2;font-size:var(--pc-fs-3);background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;}
/* Bottom info rebuilt as ONE centered column (name → description → asset tags → edition #) —
   was a left/right split (text vs. a 2×2 tag grid) per direction "ให้กลุ่ม text ทั้งหมด align
   กลาง". The hairline divider is now a short spectrum-gradient bar instead of a flat rgba line —
   the card's one deliberate accent moment, echoing the sparkles above it. */
.pcE-bot{flex:0 0 auto;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp-glue);padding-top:var(--sp-inline);}
/* border-radius bumped 2px->4px (2026-08-31, per corner-radius audit) — see .alloc-dot's comment;
   no visual change (a 2px-tall bar renders as a full pill at either radius), just consistency. */
.pcE-divider{width:52px;height:2px;border-radius:4px;background:var(--spectrum);}
.pcE-th2{font-family:var(--font);font-weight:var(--w-label);font-size:var(--pc-fs-2);color:#15171d;}

<!-- Liquid Metal CTA (ported from the BetterTrade 2026 kit — see js/liquid-metal-cta.js) — module
     scripts always execute after the document finishes parsing, i.e. AFTER the classic <script>
     below has already run its first synchronous render(). So this can't just self-mount on load
     like the kit's original standalone version did; instead it exposes mountLiquidMetalCta (the
     splash hero button) and mountLiquidMetalButtonInto (every other Liquid Metal button — header
     QR pill, in-content secondary CTAs; takes an explicit slot selector + 'hero'|'compact' preset)
     on window, and the app calls whichever one applies from inside each screen's render function,
     every time that screen puts a fresh slot on screen. The second inline module is the bridge —
     it's what makes those exports reachable from the classic (non-module) script below, since
     module scope and classic-script scope don't share globals. -->
<script type="module" src="js/liquid-metal-cta.js"></script>
<script type="module">
  import { mountLiquidMetalCta, mountLiquidMetalButtonInto } from './js/liquid-metal-cta.js';
  window.mountLiquidMetalCta = mountLiquidMetalCta;
  window.mountLiquidMetalButtonInto = mountLiquidMetalButtonInto;
  window.dispatchEvent(new Event('lmb:ready'));
</script>

/* Icon asset audit (2026-09-11, per direction "ไอคอน spectrum ทั้งหมดในระบบ audit เรื่อง size, item
   type"): ~60 spectrum-style PNGs referenced across the app total ~2MB — reasonable, all correctly
   PNG (not JPEG, needed for alpha transparency). The one real finding: 14 of these predated the
   160x160/trim-to-content-bbox/~82%-fill convention every other icon in the file follows and were
   still sitting at a legacy 96x96 canvas with the glyph filling ~94-96% of it — same root cause as
   the ICON_COMPASS_PNG/ICON_GOLD_PNG mismatch fixed earlier this session (see SIDES' own comment),
   just not yet caught for the rest of this older batch. At the shared 24px display size (.gr-ic/
   .ns-ic/.pass-ey-ic/.bc-asset-ic all use object-fit:contain within a fixed box), a 96x96-canvas/96%-
   fill glyph renders visibly LARGER than a 160x160/82%-fill one, even though both are "one icon in
   one same-size slot" — the mismatch is in the source canvas, not the CSS. Re-cropped 11 of the 14
   from their original ~1920px source art in Icon/ (ICON_BOND/COLLECTIBLE/CROWN/CRYPTO/DIAMOND/GIFT/
   INSURANCE/JOYSTICK/REALESTATE/STOCK_INTL/STOCK_TH_PNG) to the same 160x160/~82%-fill recipe.
   ICON_CARD_PNG/ICON_FUND_PNG/ICON_HEALTH_PNG have no matching high-res source found in Icon/ (a
   plain-card search only turned up an unrelated trading-card mockup) — left at their existing 96px
   art rather than guess at a replacement; flagged here for whenever real source art turns up.
   Follow-up same day ("ไอคอนที่เพิ่งแก้...ยังทับกันอยู่" / bond icon spotted with a ₿ on it): the
   re-crop made ICON_BOND_PNG's own source problem impossible to miss — Icon/ตราสารหนี้.png draws a
   bank building with a currency note (stamped with a bitcoin glyph, of all things) overlapping its

   Briefly re-cropped to just the bank pediment (roof + columns only, dropping the note+₿ entirely —
   the note visually overlaps the building's own right column in the source art, confirmed by
   sampling its alpha channel, so there was no rectangle that kept "building + note minus just the

function radarSVG(vals,hue){
  var R=90,cx=170,cy=122,pts=[];
  for(var k=0;k<6;k++){var a=(-90+60*k)*Math.PI/180;var r=R*vals[k]/100;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}
  function ring(s){var o='';for(var k=0;k<6;k++){var a=(-90+60*k)*Math.PI/180;o+=(k?' ':'')+(Math.cos(a)*R*s).toFixed(1)+','+(Math.sin(a)*R*s).toFixed(1);}return o;}
  function axis(k){var a=(-90+60*k)*Math.PI/180;return '<line class="rk-axis" pathLength="1" x1="0" y1="0" x2="'+(Math.cos(a)*R).toFixed(1)+'" y2="'+(Math.sin(a)*R).toFixed(1)+'"/>';}
  var poly=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');
  /* data-i (2026-08-29, per direction "ให้มี Interaction") — lets bindRadarTap() (near
     bindAllocHover()) pair each dot with its matching label by index, same convention
     alloc-bar/alloc-row already use for their own hover pairing. */
  var dots='';pts.forEach(function(p,k){dots+='<circle class="rk-dot" data-i="'+k+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"><title>'+RADAR_AXES[k]+' '+vals[k]+'</title></circle>';});
  var lab=[[0,-104,'middle'],[104,-52,'start'],[104,60,'start'],[0,116,'middle'],[-104,60,'end'],[-104,-52,'end']];
  /* font-size bumped 10.5->14 (2026-08-29, per direction "text size เท่ากับ" .int-bar-note's own
     --fs-eyebrow/14px) — was noticeably smaller than every other piece of copy on the page. */
  var labels='';for(var k=0;k<6;k++){labels+='<text class="rk-lab" data-i="'+k+'" x="'+lab[k][0]+'" y="'+lab[k][1]+'" text-anchor="'+lab[k][2]+'" font-family="'+SVGFONT+'" font-size="14" font-weight="500">'+RADAR_AXES[k]+' '+vals[k]+'</text>';}
  return '<svg width="340" height="244" viewBox="0 0 340 244" style="max-width:100%" role="img" aria-label="พอร์ตลงทุน '+RESULT.hero.th+'"><title>พอร์ตลงทุน '+RESULT.hero.th+'</title><g transform="translate('+cx+','+cy+')">'+
    '<polygon class="rk-grid" points="'+ring(1)+'"/><polygon class="rk-grid" points="'+ring(.75)+'"/><polygon class="rk-grid" points="'+ring(.5)+'"/><polygon class="rk-grid" points="'+ring(.25)+'"/>'+
    axis(0)+axis(1)+axis(2)+axis(3)+axis(4)+axis(5)+
    '<polygon class="rk-poly" points="'+poly+'" fill="rgba('+hue+',0.14)" stroke-linejoin="round"/>'+dots+labels+'</g></svg>';
}

/* Largest-remainder rounding — turns an array of float shares (summing to ~100) into integer %
   that still sum to EXACTLY 100, so "รวมทุกแท่ง = 100%" in the caption below is always literally true. */
function roundPct(arr){
  var floors=arr.map(Math.floor);
  var total=floors.reduce(function(a,b){return a+b;},0);
  var left=100-total;
  var order=arr.map(function(v,i){return i;}).sort(function(a,b){return (arr[b]-floors[b])-(arr[a]-floors[a]);});
  for(var k=0;k<left;k++)floors[order[k]]++;
  return floors;
}

var GAME_PLAYED={0:true,1:true},GAME_OPEN=null;
var GAME_ANSWERS={};
function gamesPlayedCount(){return SIDES.reduce(function(n,_,i){return n+(GAME_PLAYED[i]?1:0);},0);}
function playSet(kind,idx){return kind==='game'?MINIGAME_Q[idx]:BOOTH_Q[idx];}
function playLabel(kind,idx){return kind==='game'?SIDES[idx].title:BOOTHS[idx].game;}
/* learnedInsights — every distinct question insight the player has picked up so far this session,
   derived from GAME_PLAYED/BOOTH_ACT (the real committed-completion flags) rather than a separate
   mutable log, same "derive from real state" convention sideResult()/boothPointsTotal() already use.
   `inProgress` ({kind,idx}) lets a game/booth still on its OWN result screen count immediately —
   completePlay() (which flips GAME_PLAYED/BOOTH_ACT true) only runs once the player taps the CTA to
   leave that screen, but the running total should already reflect what they just saw, not lag one
   screen behind. Text-deduped (a repeated insight across games only counts once), matching how the
   knowledge ledger below also only lists each concept the first time it's learned. */
function learnedInsights(inProgress){
  var seen={},out=[];
  function add(kind,idx){
    playSet(kind,idx).questions.forEach(function(q){
      if(q.insight&&!seen[q.insight]){seen[q.insight]=true;out.push({text:q.insight,kind:kind,idx:idx});}
    });
  }
  for(var gi=0;gi<MINIGAME_Q.length;gi++)if(GAME_PLAYED[gi])add('game',gi);
  for(var bi=0;bi<BOOTH_Q.length;bi++)if(BOOTH_ACT[bi])add('booth',bi);
  if(inProgress&&!(inProgress.kind==='game'?GAME_PLAYED[inProgress.idx]:BOOTH_ACT[inProgress.idx]))add(inProgress.kind,inProgress.idx);
  return out;
}
/* learnedLedgerHTML — "เรื่องที่คุณเข้าใจแล้ว" card for the Playbook's เส้นทาง (journey) tab: a
   personal, dynamic recap of every distinct insight learnedInsights() has captured from mini-games
   actually played, tagged by source game — NOT the same thing as คลังความรู้ (renderLibrary), which
   is a static 41-article/8-category reference shelf (this card sits directly above that shelf in
   renderBook, specific-before-general). Reuses ticketHistoryHTML's exact .card/.sides-hd/.s-ey/.s-h/
   .s-sub header + .side-item/.list-row.side-row/.side-num/.side-cx/.side-t/.side-s row shape (2026-09-10)
   rather than inventing a new list recipe — .side-num carries the source game/booth's own icon (done-
   filled, same "this is settled" language .side-num.done already means everywhere else) instead of a
   step number, .side-t is the insight text itself, .side-s names which game it came from. Empty state
   (nothing played yet) mirrors ticketHistoryHTML's own row-less-section absence — this whole card is
   simply omitted by its one call site (renderBook's journey panel) rather than rendering a hollow
   card, so a visitor who hasn't reached the games yet sees no half-empty ledger. */
function learnedLedgerHTML(){
  var items=learnedInsights();
  if(!items.length)return '';
  var rows=items.map(function(l,i){
    var icon=l.kind==='game'?ic(SIDES[l.idx].icon):ic(BOOTHS[l.idx].icon);
    return '<article class="side-item"'+(i===items.length-1?' style="border-bottom:none"':'')+'>'+
      '<div class="list-row side-row" style="cursor:default"><div class="side-num done">'+icon+'</div>'+
      '<div class="side-cx"><div class="side-t">'+l.text+'</div><div class="side-s">จากเกม '+playLabel(l.kind,l.idx)+'</div></div></div></article>';
  }).join('');
  return '<section class="card scroll-reveal ledger-card"><div class="sides-hd"><div class="s-ey">สะสมจากการเล่นเกมวันนี้</div><h2 class="s-h">เรื่องที่คุณเข้าใจแล้ว</h2>'+
    '<p class="s-sub" style="margin-bottom:2px">'+items.length+' เรื่อง · อัปเดตอัตโนมัติทุกครั้งที่เล่นเกมจบ</p></div>'+rows+'</section>';
}

/* eventPhase (2026-08-28, per direction "แยกเป็น ช่วง Pre-Event, ช่วง On-Event") — 'pre': the QR-scan

   sections that are supposed to start locked at On-Event (home counters/next-step, booth zone
   activities, game "ด้านอื่นในคู่มือ") actually render locked instead of this demo's old pre-seeded
   "already done" mock defaults. Switching to 'pre' does NOT touch RESULT/quizDone — a pre-event
   visitor may already have taken the quiz online, so identity content stays independently gated on
   RESULT alone (see renderBook's empty state, buildRoute's personalized flag). */
/* Defaults flipped 2026-09-10, per direction — On-Event is now the default preview (eventPhase),
   with an identity already on file (quizDone, seeded at bootstrap via seedPersonaResult — see the
   bottom of this file), the Booth Journey v2 map (boothVer), and the draw-status card genuinely
   computed from that seeded state's real chk/act counts (which start below CHECKIN_NEED/
   ACTIVITY_NEED, so it reads "ยังขาด" out of the box — see the 'auto' branch in renderBooth this
   direction restored). Switching the ช่วงงาน segment to Pre-Event is the one way back to the
   splash/quiz flow (RESULT/quizDone/boothVer aren't touched by that switch, same as before). */
var DEMO={quizDone:true,draw:'auto',eventPhase:'on',multiTicket:false,boothVer:'v2',registered:true}; // draw: 'auto' (default, real boothCheckinCount()/boothActivityCount() math) | 'ok' (force eligible) | 'need' (force not-eligible) — see renderBooth. registered (2026-09-04, per direction "จำลองเคส...ลูกค้าที่เข้ามาเล่น quiz dna โดยที่ยังไม่ได้ลงทะเบียน"): true (default, the real/active state) = the normal full Book; false previews a quiz-taker who never went through the registration site — renderBook locks to just the ตัวตน tab, truncates it at จุดแข็ง/จุดที่ต้องระวัง, and drops the bottom app-tabbar (see renderBook's `unreg` branches + book2Tabs()). boothVer (2026-09-03, per direction "อยากเพิ่ม หน้าเดินบูธ อีกเวอร์ชัน แยก preview ในเดโม"): 'v1' = the shipped booth page (static map image + separate route list, unchanged); 'v2' = a UX-enhancement preview per the Booth Journey spec — the SAME sections/layout/content, but the map gets numbered semantic markers synced 1:1 with the route steps, plus two-way Step↔Map focus. Everything v2 adds is gated on this flag so v1 stays byte-identical. (splashVer removed 2026-09-18, per direction "preview card เอา v1 ออก" — the splash fan carousel's "การ์ดมีชีวิต" build (added 2026-09-09, promoted to shipped default 2026-09-11) is now the only splash preview; v1 the plain static carousel, v3/v5 the "3D Character Card Flow" field and its living-card variant, were all removed the same day/session — see renderSplash's own comment for that full history.) eventPhase default flipped 'on'->'pre' (2026-08-28, per follow-up direction "จำลองเคส...อยากให้ preview default ที่ Pre-Event ก่อน") — see the comment above. multiTicket: false by default (2026-09-02) — the single-ticket case stays the active/real state; see MULTI_TICKET_DEMO. (sumTitleVer — a brief demo-panel toggle comparing 2 title treatments for renderPlaySummary's game-name — removed 2026-09-11, per direction "เลือกแบบ v2 และเอาแบบ v1 ออกได้เลย": v2, the DNA quiz's .q-icon-bare + .q-title header, is now just how renderPlaySummary always renders — see its own comment there.)

/* synthesize a plausible RESULT for a forced persona and jump to the Book (demo shortcut).
   gap:0 here used to mean the demo persona picker could NEVER show a real post-event difference —
   evoCompute() only shifts family when |gap|>=2, so an always-aligned demo always rendered
   'confirmed'/'gathering' (same card both tabs), which read as "the preview doesn't actually
   change between before/after." Now simulates a real divergence (±4) in whichever direction moves
   AWAY from the picked persona's own family, plus enough activity for evoCompute's evidence gate
   (sig>=3) — so picking ANY of the 12 demo personas reliably lands on a genuine 'evolved' state,
   and thanks to EVO_REP above, the post-event card is always real photographed art (diamondhand/
   waverider), never the CSS mockup, on that side. */
/* Build a plausible RESULT (+ demo activity) for a forced persona WITHOUT navigating — shared by the
   demo persona picker (which then jumps to Book) and the demo Character-Animation Play button (which
   jumps to the cardreveal instead). Splitting the seed from the navigation lets both entry points
   reuse the exact same synthesized result. */
function seedPersonaResult(key){
  var h=HEROES[key];
  var simGap=h.fam==='V'?-4:4;
  RESULT={hero:h,heroKey:key,declared:h.riskLevel,revealed:Math.max(1,Math.min(10,h.riskLevel+simGap)),gap:simGap,
    conf:74,confLevel:'สูง - สอดคล้องดี',
    subs:{identity:16,behavior:16,riskAlign:18,discipline:15},knowledge:'intermediate',horizon:'mid',votes:{},interests:[0,2,4]};
  GAME_PLAYED={0:true,1:true,2:true,3:true};GAME_ANSWERS={};BOOTH_CHK={0:new Set([0])};BOOTH_ACT={0:true};BOOTH_ANSWERS={};EFIN_CHECKED_IN=true;
}

/* Default demo state (2026-09-10, per direction): "ทำแบบทดสอบตัวตนแล้ว" out of the box — seed a
   RESULT before the very first render/buildDemo so DEMO.eventPhase:'on''s render() gate (which
   redirects splash/quiz/etc. to 'book' once RESULT exists, else 'home') lands on the Book page
   immediately instead of the empty "no identity yet" state. Booth check-in/activity start at
   seedPersonaResult's own baseline (booth 0 only) — below CHECKIN_NEED/ACTIVITY_NEED — so the
   Booth tab's draw-status card genuinely (not forced) reads "ยังขาด" by default too. */
seedPersonaResult('sage');
RESULT.revealed=RESULT.declared;RESULT.gap=0; // the PDF sample reads "สอดคล้อง (Aligned)": what they said = what they did
/* Lay the sheets out only AFTER the webfonts are in (2026-09-21 bug fix): pbBuild() paginates by measuring text height, and with the
   fallback font showing (font-display:swap) every measurement was wrong - the book came out as 43 loosely-packed sheets instead of the
   ~36 the real font produces. document.fonts.load() forces the three faces to download even though nothing has used them yet; a 2.5s
   timeout keeps the page from ever hanging on a blocked font. */
(function(){
  var done=false;function go(){if(done)return;done=true;render();}
  setTimeout(go,2500);
  if(!document.fonts||!document.fonts.load){go();return;}
  Promise.all([document.fonts.load('500 16px "FC Minimal"'),document.fonts.load('700 16px "FC Minimal"'),document.fonts.load('500 16px "Baskervville"'),document.fonts.load('700 16px "Baskervville"')]).then(function(){return document.fonts.ready;}).then(go,go);
})();
</script>
