<!-- charset MUST be the very first thing in the file (WHATWG pre-scan reads it from the raw bytes
     before any parsing) — this file has no <!DOCTYPE>/<html>/<head> wrapper (the HTML5 parser
     auto-supplies them), so nothing else was declaring an encoding. Without it, correct rendering
     of every Thai string here depended entirely on the HTTP server sending a charset in its
     Content-Type header; any host/local server/tool that doesn't (many static preview servers
     don't) falls back to a legacy 8-bit encoding and every non-ASCII character — all the Thai
     copy, "→", "×", "✦" — renders as mojibake. -->

/* ── BetterTrade 2026 · Design DNA v2.0 (editorial) ─────────── */
:root{
  --ink:#111318; --muted:#687078;
  --paper:#f7f8f7; --cloud:#eef1f6; --white:#ffffff;
  --accent:rgba(17,19,24,0.06);
  /* System border intensity halved (2026-08-11, per direction "สีอ่อน 50%") — every card/chip/input/
     divider border in the app inherits from these 4 tokens, so lightening them here softens boundary
     lines app-wide in one place rather than per-component. */
  --line:rgba(17,19,24,0.09); --line-soft:rgba(17,19,24,0.08); --line-strong:rgba(17,19,24,0.17); --line-header:rgba(17,19,24,0.06);
  /* 2026-08-15, per Color DNA review — --shadow-cta-ink (previously here) had zero consumers
     anywhere in the file despite its own comment claiming one use-site; deleted rather than kept
     around unread. --ring-idle retired the same way once .spec-bd (its only consumer) was deleted
     entirely (see Design DNA review "✦1 ทางเลือก A"). */
  --focus:#2b6cff; --popover:rgba(255,255,255,0.96);
  --cyan:#61e8ed; --violet:#9c91ff; --pink:#f178d8; --yellow:#f2ea83;
  --spectrum:linear-gradient(90deg,#61e8ed,#9c91ff,#f178d8,#f2ea83,#61e8ed);
  --spectrum-v:linear-gradient(180deg,#61e8ed,#9c91ff,#f178d8,#f2ea83,#61e8ed); /* --spectrum's own stops, rotated for vertical rules */
  /* "Gold/amber" status color (2026-08-14) — was the exact same 3-hex combo hand-copied into 5
     separate rules (str-box.wn, redeem-card.on, pass-ic.gold, rt-badge.feat, prof-tier) plus a 6th
     near-miss variant that wasn't even color-identical (booth check-in legend swatch) — named here
     once so "the one gold across the app" (already the stated intent in 3 of those rules' own
     comments) is actually one definition, not five+ copies that can drift apart independently. */
  --amber-bg:#fef4e2; --amber-border:#f3daa0; --amber-text:#8a5a00;
  /* "Gray" callout tone (2026-09-22, per direction — .pb-note-pit switched off amber) — same 3-token
     bg/border/text shape as amber, just neutral instead of warm. */
  --gray-bg:#f3f4f6; --gray-border:#d1d5db; --gray-text:#4b5563;
  /* --green-text is the one surviving piece of the "good/green" status color named 2026-08-15 —
     --green-bg/--green-border (the wash/border pair) were retired again the same day once .str-box
     went neutral (see .str-box, "3 card นี้ยังดูแข่งๆ กัน"); --green-text still colors .str-hd's
     heading/icon, the one signal now carrying this card's identity. */
  --green-text:#15803d;
  /* semantic tones for callout strips: green = neutral-to-positive (an example, a good sign), amber = caution / watch-out.
     green gets its own wash/border pair to mirror --amber-bg/-border (promoted from the hand-mixed color-mix() used inline). */
  --green-bg:color-mix(in srgb,var(--green-text) 7%,var(--white));
  --green-border:color-mix(in srgb,var(--green-text) 32%,transparent);
  /* "Done" (cyan) / "active" (violet) status ladders (2026-08-15, per Color DNA review "06") — cyan
     alone was independently re-tinted at 5/10/12/14/15/16/20% fill + 30/35/40% border across 12
     selectors for one semantic ("this is done/unlocked"); violet had the same shape at 7/8/12/14/
     15/20% fill + 22/26% border for "in progress/active". Collapsed to 3 rungs each — wash (a
     background tint), fill (a chip that must read as its own object), border (a visible outline) —
     and every consumer below now points at one of these six instead of picking its own percentage. */
  --done-wash:color-mix(in srgb,var(--cyan) 10%,transparent);
  --done-fill:color-mix(in srgb,var(--cyan) 15%,transparent);
  --done-border:color-mix(in srgb,var(--cyan) 35%,transparent);
  --active-wash:color-mix(in srgb,var(--violet) 10%,transparent);
  --active-fill:color-mix(in srgb,var(--violet) 15%,transparent);
  --active-border:color-mix(in srgb,var(--violet) 35%,transparent);
  --ease:cubic-bezier(0.22,1,0.36,1);
  /* Radius scale (2026-08-12) — 8/12/16/24 is the full ladder; the system only ever
     names the two rungs actually in use. 12 and 24 stay reserved for future needs.
     --r0 added (2026-08-14): 6px was hand-copied identically into 4 small-chrome rules
     (tooltip, focus ring, map caption, route badge) — named rather than left as 4 independent
     "6px" literals that could drift apart. Below the 8/16/48 ladder on purpose (micro-chrome
     tier, not a new rung in the main ladder). */
  --r0:6px; --r1:8px; --r2:16px; --rpill:48px;
  --shadow-action:0 1px 4px rgba(17,19,24,0.10);
  --shadow-primary:0 1px 4px rgba(17,19,24,0.24);
  --shadow-md:0 6px 18px rgba(17,19,24,0.14);
  /* Aligned to the value already hand-duplicated across 4 overlay cards (map lightbox, scan/share/
     howto sheets) instead of the old 24px/64px/.26 the token itself defined but no consumer used at
     (border & spacing audit, 2026-08-31) — .demo-panel is --shadow-lg's only OTHER consumer and gets
     marginally stronger as a side effect (dev-only tool, not user-facing). */
  /* --shadow-lg (0 30px 70px .35) removed 2026-09-21: its only consumer was the dev demo panel, deleted with the other screens. */
  --shadow-card:0 10px 30px rgba(17,19,24,0.15),0 2px 6px rgba(17,19,24,0.09); /* the persona card (.pc-face, .cr2) */
  --shadow-page:0 6px 24px rgba(17,19,24,0.08);  /* an A4 sheet resting on the screen */
  --shadow-frame:0 30px 70px rgba(17,19,24,0.18); /* the desktop phone-frame preview (.shell) */
  /* ── A4 ebook / PDF sheets (2026-09-21) — one place for every number the sheet layout depends on ── */
  --rule-w:1px;           /* thickness of every divider rule (horizontal + vertical) */
  --bar-h:4px;            /* thickness of the thin data bars: Confidence Score, risk "บอก" vs "จริง", SKILL ประจำการ์ด, คะแนนพฤติกรรม */
  --bar-h-lg:8px;         /* เรดาร์ความสนใจ, เวลาตัดสินใจคุณดูอะไรก่อน (stacked allocation bar) */
  --pb-frame-inset:30px;  /* page edge -> the frame ornament's line */
  --pb-frame-gap:32px;    /* frame line -> content */
  --pb-pad-x:calc(var(--pb-frame-inset) + var(--pb-frame-gap));
  --pb-pad-top:68px; --pb-pad-bottom:64px;
  --pb-gap:20px;          /* gap between blocks on a sheet — its own value, NOT --sp-section (which grows on tablet/pc; a sheet must lay out identically everywhere) */
  --pb-folio-inset:18px;  /* extra inset of the header/footer text so it clears the frame's rounded corners */
  --fs-folio:12px;        /* header / footer text on a sheet */
  /* ── rules & ornaments (read off the reference art) ── */
  --rule:#c4c5c7;         /* 2px section divider */
  --rule-fade:#d4d3d7; --rule-deep:#55535c; /* the vertical divider's gradient (light at the ends, deep next to the star) */
  --frame-line:#6d7178;   /* the page frame's hairline */
  --ornament:#1f273a;     /* the divider's 4-point star */
  --frame-star:#2d3036;   /* the frame's 4-point stars (top / bottom centre) */
  --cover-paper:#e9e3da;  /* fallback tint behind the cover art */
  /* ============================================================================
     SPACING SYSTEM (2026-08-11) — a defined scale + a named rule per USE-CASE, so
     "how much space here" is a lookup, not an eyeballed number. Everything below
     is one of these 10 values; when a new spot needs space, pick the CASE it
     matches (not a raw px), so the app stays on one rhythm as it grows.
     Base scale: 2 · 4 · 6 · 8 · 12 · 16 · 20 · 22 · 24 · 44
     Re-tuned 2026-08-26 per direct spec (--sp-list 9→8, --sp-inline 10→12, --sp-stack/
     --sp-card-pad-sm 14→16, --sp-card-pad 20→22) — same USE-CASE roles, new rung values.
     ============================================================================ */
  --sp-hairline:2px;    /* optical nudge only (e.g. an icon's baseline offset) — never a "real" gap between two things */
  --sp-stack-tight:4px; /* a title/value → the ONE caption line directly under it (same idea, smaller type: q-title→q-sub, s-h→s-sub's lead-in) */
  --sp-glue:6px;        /* an icon ↔ its own label/kicker sitting right next to it — tight enough to read as ONE glued unit, not two items */
  --sp-list:8px;        /* gap between repeated rows in ONE list/stack (quiz options, risk/confidence bars, allocation legend, strength chips) */
  --sp-inline:12px;       /* two distinct-but-related items sharing a row (row icon + its text, avatar + label, a stat's icon + value) */
  --sp-stack:16px;      /* a section's own eyebrow/heading → the body content that follows it (inside one card) */
  --sp-card-pad:22px;   /* a card's own inner edge padding — the gutter between a card's border and its content */
  /* 2026-08-15, per Card & Section review "11" — small (--r1) cards had no padding rung of their
     own, so 7 different literal values (10/12/13/14/15/16px) floated independently across them.
     One value now, applied on all 4 sides (was previously asymmetric per selector). */
  --sp-card-pad-sm:16px;
  --sp-edge:20px;       /* the SCREEN's own outer gutter before any card starts — unified across quiz/book/splash/consent (was 14–24px ad hoc per screen) */
  --sp-block:22px;      /* one labeled sub-section to the next INSIDE the same card (identity → radar → interests → traits → allocation) */
  --sp-section:20px;    /* THE gap between any two top-level sections/cards on a long scroll (Book).
                           One value for every section boundary — driven from .scroll's flex `gap`, not
                           per-card margins — so the whole page shares one rhythm (was an ad-hoc mix of
                           18/28/44/0 that made "where does one section end" read inconsistently).
                           Was 28 — brought down per direction ("still feels too far apart"); still reads
                           as its own boundary since most cards' own internal padding (--sp-card-pad) sits
                           on both sides of it. Reserved for section-to-section only; intra-card spacing
                           uses --sp-block and smaller. Mobile keeps this 20px value; tablet/pc override
                           to 24px below — a wider canvas can afford (and reads better with) slightly more
                           breathing room than the narrow phone frame. */
  --font:'FC Minimal','Noto Sans Thai','Thonburi','DB Helvethaica X',system-ui,-apple-system,'Segoe UI',sans-serif;
  --serif:'Baskervville','Bodoni MT','Didot',Georgia,'Times New Roman',serif; /* Editorial display serif — matches the printed character-card art. English display + numerals ONLY; Thai stays on --font (FC Minimal). Baskervville embedded (OFL, variable font — one @font-face covers weight 400–700); Bodoni MT = local-first fallback */
  /* --font-read (2026-09-22, per direction): a looped Thai text face ("font มีหัว") for the document's
     heaviest reading — library articles, glossary definitions, the AI Insight paragraphs — swapped in
     ONLY there, not on title/subtitle/caption, since --font's own Thai glyphs already come from an
     un-embedded system fallback (FC Minimal itself is Latin-only) and this is the one place long
     unbroken Thai prose actually needs the readability. Sarabun embedded at 400/500/700 (OFL, static
     per-weight files — see the 3 @font-face rules above), same Thai/system fallback chain as --font. */
  --font-read:'Sarabun','Noto Sans Thai','Thonburi','DB Helvethaica X',system-ui,-apple-system,'Segoe UI',sans-serif;
  /* --mono retired (2026-08-12, per direction) — every former mono site (topbar count, opt-key,
     eyebrow labels, side/route numerals, card-back stat rows) now sets font-family:var(--font)
     directly; there is no longer a second UI typeface in this app, only --font (UI) + --serif
     (display, English/numerals only). Numeric alignment where it mattered is kept via
     font-variant-numeric:tabular-nums on the specific rule, not by switching family. */
  /* Type scale v3 (2026-08-19, per direction) — every rung stepped up again: title 32→36,
     heading 24→28, h2 22→24, sub/body 18→20, bodysm 16→18, label 14→16, eyebrow/meta 12→14.
     Ratios between adjacent rungs preserved from v2, so relative hierarchy reads the same as
     before — this is a uniform scale-up, not a re-balance. eyebrow/meta still share one value
     (now 14) and label still sits apart from them (now 16) per the v2 audit's "three tokens,
     one size" fix; bodysm (18) now sits between label (16) and sub/body (20) rather than
     landing on label's old value, keeping all 8 rungs distinct except the deliberate
     eyebrow=meta pair.
     v2 (2026-08-15, per review of the Type System audit) — h2/sub/body/bodysm/label each
     stepped up one rung (title/heading/eyebrow/meta held, since the audit didn't flag them).
     --fs-label deliberately moved AWAY from --fs-eyebrow/--fs-meta here (14 vs 12) — the audit's
     "three tokens, one size" ambiguity is now only a two-way overlap (eyebrow+meta), not three.
     v4 (2026-08-26, per direct spec): --fs-sub/--fs-body 20→22 — the one rung moved this round,
     everything else held. This narrows the h2(24)↔sub/body(22) gap to 2px and widens sub/body(22)↔
     bodysm(18) to 4px, breaking the "ratios preserved" pattern the v2/v3 passes kept — a deliberate,
     isolated bump per this direction, not a full re-scale. */
  --fs-title:36px; --fs-heading:28px; --fs-h2:24px; --fs-sub:22px; --fs-sig:20px; --fs-subtitle:16px;
  --fs-body:22px; --fs-bodysm:18px; --fs-label:16px; --fs-eyebrow:14px; --fs-meta:14px;
  /* Icon scale v2 (2026-08-15, per Icon System audit review) — sm/md stepped up a rung (12→16,
     16→20), lg held at 24. Hero-tier icons (the single dominant icon on a screen) still stay
     sized per-context within roughly 32-44px rather than one fixed token — a reveal splash icon
     and a card-art glyph are different enough compositions that forcing one number would hurt one
     of them. The persona card's glyph (64px) is a deliberate exception outside this range — it's
     the collectible card's own signature art, not a UI icon. */
  --ic-sm:16px; --ic-md:20px; --ic-lg:24px;
  /* Card-art type scale (2026-08-15, per Type System audit §06) — the persona card front (.pcE-*)
     and back/dossier (.pcb-*) had 12 independent raw px sizes between them, front and back not
     even agreeing with each other on shared roles (e.g. the Thai name was 13px on the front,
     12.5px on the back). Consolidated to 5 named rungs, one per FUNCTION rather than per side, so
     front/back now share a token wherever they show the same kind of content. Deliberately its own
     scale, not folded into --fs-*: this is the card's own signature art, not app UI chrome. */
  --pc-fs-1:24px;  /* display name (EN) — pcE-en, pcb-en */
  --pc-fs-2:13px;  /* secondary name (TH) — pcE-th2, pcb-th */
  --pc-fs-3:11px;  /* reading copy — pcE-def, pcb-li, pcb-leg — plus the decorative sparkle pcE-spk */
  --pc-fs-4:10px;  /* eyebrow / section head / stat row — pcb-ey, pcb-hd, pcb-stl, pcb-stv */
  --pc-fs-5:8.5px; /* smallest — edition number, tag label, list/tag bullets */
  /* Weight scale v2 (2026-08-15) — --w-body merged into --w-head's value (500) per direction
     ("ให้ในระบบเหลือใช้แค่ 500, 700") — the system now genuinely has 2 rendered weights, not 3.
     Both tokens are kept (rather than deleting --w-body) since ~30 selectors still reference it
     by name for its semantic role ("this is baseline body copy," not "this is emphasized") —
     collapsing the VALUE removes the visual drift; collapsing the NAME too would just be a
     larger, riskier find-replace for zero further benefit. */
  --w-body:500; --w-head:500; --w-label:700;
}
/* Light theme only — dark mode intentionally removed (per direction: keep the original editorial theme). */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
/* --focus is the app's one semantic keyboard-a11y color — separate job from "selected" (which stays
   ink/spectrum everywhere else). :focus-visible only shows for keyboard/switch nav, so touch/mouse
   users on the kiosk never see it — this doesn't compete with the touch-first visual language. */
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;}
/* Liquid Metal Button's own <button> sets outline:none inline (unconditionally, as part of its base
   cssText) — an inline style always beats an external rule's specificity regardless of pseudo-class,
   so the global :focus-visible rule above can't reach it without !important. Same --focus color/
   token as everywhere else in the app (it happens to equal the kit's own README-specified #2b6cff). */
.lmb button:focus-visible{outline:2px solid var(--focus) !important;outline-offset:3px !important;}
/* min-height declared twice on purpose: 100vh first (universal fallback), 100dvh second (real mobile
   browsers report 100vh as the LARGEST possible viewport — address bar collapsed — so a page sized to
   100vh is actually TALLER than what's visible whenever the address bar is showing, pushing the CTA/
   bottom controls below the fold; 100dvh tracks the true visible height and updates as the bar shows/
   hides). Browsers that don't know dvh simply ignore that one declaration and keep the vh value. */
/* line-height:1.5 (2026-09-21, per direction "line-height 150%", typography audit F4) — body had no base
   line-height, so 64% of rendered text fell back to `normal`, and FC Minimal's `normal` is ~1.0 (a 28px
   heading measured 27.5px tall) — much tighter than the 1.4-1.65 every hand-set paragraph rule uses.
   Every selector that already sets its own line-height (display 0.96-1.2, body 1.3-1.65) is unaffected. */
/* 2026-09-21 line-height exceptions to body 1.5 (user-approved): headings 1.2, chips/pills/badges/tags 1.1,
   buttons inherit (UA resets them to normal). :where() = 0 specificity, so any rule that sets its own line-height still wins. */
:where(.tb-title,.prog-val,.s-h,.quote-h,.pe-vlbl,.pe-track-lbl,.stub-t,.prof-name,.conf-sc,.consent-h,.ev-empty-t){line-height:1.2;}
:where([class*="-pill"],[class*="-chip"],[class*="-badge"],[class*="-tag"]){line-height:1.1;}
:where(button){line-height:inherit;}
body{font-family:var(--font);background:var(--paper);color:var(--ink);font-weight:var(--w-body);line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;display:flex;justify-content:flex-start;}
.shell{width:794px;max-width:none;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);position:relative;display:flex;flex-direction:column;}

/* The .spec-bd spectrum-comet accent system (CSS + --ring-idle token + ensureCometSVG/setSpecPath/
   layoutSpecComets in JS) was deleted entirely 2026-08-15, per Design DNA review "✦1 ทางเลือก A" —
   it had zero live consumers anywhere in the file (verified against markup and both liquid-metal-*.js
   files); the Liquid Metal button now owns every "CTA that shouts" moment this used to cover, and
   layoutSpecComets() was still being called on every navigation (5 call sites) to iterate an
   always-empty NodeList. */

/* Lucide icons — stroke-only per Design DNA §07; fill/stroke inherit to all children */
.lucide{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;display:block;}
/* Bug fix (2026-09-02, responsive audit — found via a scripted scrollWidth/clientWidth sweep across
   every screen × data-view × real width, not just visual spot-checks) — on-event, .topbar holds 3
   items at once (.tb-logo + .reg-cta "ลงทะเบียน" [flex-shrink:0, never compresses] + #qr-cta-slot's
   mounted "สแกน QR" button), and at a genuine 320px viewport (checked 320-375px; only 320-329px
   actually fails) they don't quite fit even after the logo shrinks as far as it can — a real,
   precisely reproducible 6px horizontal overflow, on every screen that shows this header combo
   (Home/Games/Booth via appHeader(), Book via its own pre-appHeader() duplicate header). Tightening
   just the gap between the 3 items (12px->6px) closes the 6px shortfall with margin to spare —
   confirmed via the same script before committing to this fix, not just visually. Scoped narrow
   (≤340px, a few px of headroom above the exact 330px cutoff measured) so the roomier gap everywhere
   else is untouched. */
/* Header's registration CTA (2026-08-19) — same .btn.btn-primary as renderConsent's #startBtn
   ("style เดียวกับปุ่ม เริ่มทำแบบทดสอบ"), same fill/color/weight/pill-shape, just resized down from
   that button's full 48px-tall/24px-padding dimensions (same technique as .q-nav's own .btn-primary
   override just below) so it fits this 54px header next to the QR pill instead of overflowing it. */
.reg-cta,.reg-cta:link,.reg-cta:visited,.reg-cta:hover,.reg-cta:active{flex:0 0 auto;min-height:38px;padding:0 var(--sp-stack);gap:var(--sp-glue);font-size:var(--fs-label);text-decoration:none;color:var(--cloud);}
/* ============================================================================
   BUTTON SYSTEM (2026-08-11) — 3 tiers by fill weight, each usable with or
   without an icon (an icon is just optional inline content — no separate CSS
   case for that). ALL THREE share the exact same motion (see the hover block
   below) so hierarchy comes from COLOR/WEIGHT alone, never from how it moves.
     Primary   — solid dark fill, no border   → the ONE main action on a screen
     Secondary — solid white fill, plain border → a supporting/alternate action
     Tertiary  — no fill, no border → the least-emphasized action (e.g. ย้อนกลับ)
   .btn-outline and .btn-plain are RETIRED — folded into .btn-secondary and
   .btn-tertiary respectively, so there's exactly one class per tier, not two
   overlapping ones. The old spectrum-animated-border accent (.spec-bd) that
   used to stack on top of any tier for a shouting CTA was deleted entirely
   2026-08-15 (Design DNA review "✦1") — the Liquid Metal button owns that
   job now.
   ============================================================================ */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-list);min-height:48px;padding:0 24px;border-radius:var(--rpill);font-family:var(--font);font-weight:var(--w-head);font-size:var(--fs-sub);cursor:pointer;white-space:nowrap;border:1.5px solid transparent;line-height:1;}
.btn svg{width:var(--ic-md);height:var(--ic-md);}
.btn:disabled{opacity:.38;cursor:not-allowed;box-shadow:none;filter:none;}
.btn-primary{flex:1;background:var(--ink);color:var(--cloud);border-color:var(--ink);box-shadow:var(--shadow-primary);}
/* .shimmer-violet (2026-09-22, motion removed per direction) — flat violet text, no sweep. */
.ev-empty-t.shimmer-violet{color:var(--violet);}
/* Shimmer removed from the consent screen's own "รู้จัก ตัวคุณ?" headline (2026-08-20, per direction
   "คำว่า รู้จัก ตัวคุณ? เอา shimmer ออก") — scoped to :not(.reveal-h) so the reveal screen's
   .consent-h.reveal-h ("ตัวตนนักลงทุนของคุณ / กำลังจะปรากฏ...") keeps its shimmer untouched; only
   this screen's plain heading reverts to flat, static color (falls back to the .ch-1/.ch-2 `color`
   declared above, same as before the shimmer treatment existed). */
.consent-h:not(.reveal-h) .ch-1,.consent-h:not(.reveal-h) .ch-2{animation:none;background-image:none;-webkit-background-clip:initial;background-clip:initial;-webkit-text-fill-color:initial;}

/* ── BOOK — scene-based: hairlines, not shadows ── */
/* Book section rhythm: ONE uniform gap between every top-level block via flex `gap`, instead of each
   card carrying its own margin-bottom (which had drifted to a mix of 18/28/44/0). Every direct child
   of .scroll — prog card, hero, efin banner, pdf bar, every data card, quote, route, library — is now
   separated by exactly --sp-section, so section boundaries read consistently down the whole scroll. */
.scroll{flex:1;padding:var(--sp-inline) 0 var(--sp-stack);display:flex;flex-direction:column;gap:var(--sp-section);}
/* Bug fix (2026-09-03, responsive audit — real 320px phone) — .tab-item has no explicit flex-basis,
   so its default flex-shrink:1 let the 5 items compress once their combined content (icon-or-label
   width + var(--sp-inline)=12px padding each side) overflowed the row: at 320px the 5 items' natural
   widths summed to ~327px against ~312px of usable row width (320 - the bar's own 4px+4px padding),
   forcing 4 of the 5 labels ("หน้าหลัก"/"คู่มือของคุณ"/"เดินบูธ"/"เกมหลัก") to wrap to 2 lines while
   "โปรไฟล์" (shortest) happened to stay single-line — an uneven, unfinished-looking bar, confirmed via
   getBoundingClientRect (labels wrapping to height 32px vs the one unwrapped label's 16px).
   var(--sp-inline) (12px/side) is this app's "two distinct-but-related items in a row" spacing, sized
   for things like an avatar+label — too generous for a 5-way icon+caption column this narrow. Halving
   just THIS padding at the same ≤420px floor the rest of the file uses for real-narrow-phone fixes
   frees 8px per item (40px across all 5) — comfortably more than the ~15px shortfall — so every label
   renders single-line, confirmed live down to 320px. Icon size/gap untouched; still a real regression
   risk if a longer future label is added, but today's 5 labels have real margin, not a knife-edge fit. */
/* ══ คู่มือ 2 (Book v2) ══ compare-reveal slider · top content-nav (reuses .toc) — version switch
   moved OFF this in-page pill entirely (2026-08-19, per direction "เอา tab ดูตัวเลือกแบบ...ออก เพื่อ
   จะให้เลือกดูตัวเลือกผ่าน panel แทน") and into the demo panel's own "เวอร์ชันคู่มือ" control (see
   buildDemo) — a real end-user was never meant to see 2 competing Book layouts side by side; this
   was always a demo/review convenience, so it now lives with the panel's other demo-only switches. */
/* compare-reveal (persona การ์ด ก่อน↔หลังงาน) — adapted from compare-reveal.html, DNA-skinned */
/* border-radius promoted 14px->var(--r2) (2026-08-31, per corner-radius audit) — .cr2/.pc-face/
   .scan-cam-frame all hand-typed the same 14px "media frame" magic number independently; the audit
   found --r2 (16px) is close enough to fold them onto the real token instead of leaving a 4th
   unbacked radius value in the file. */
.cr2{position:relative;width:100%;max-width:300px;margin:6px auto 0;aspect-ratio:5/7;border-radius:var(--r2);overflow:hidden;background:var(--cloud);cursor:ew-resize;touch-action:pan-y;user-select:none;isolation:isolate;box-shadow:var(--shadow-card);}
.cr2-side{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
.cr2-side .pc3d,.cr2-side .pc-tilt{width:100%;height:100%;aspect-ratio:auto;}
.cr2-side .pc-face{box-shadow:none;border-radius:0;}
.cr2-cap{text-align:center;font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;margin:var(--sp-list) auto 0;max-width:280px;}
.cr2-cap b{color:var(--ink);font-weight:var(--w-label);}
/* Single long page (2026-09-21, per direction "เรียงเป็นหน้ายาวหน้าเดียว") — every panel is always
   displayed and stacks in main.scroll (which already gaps sections); the old .show toggle is gone and
   the .toc pills are now jump-links (bindBook2Nav) that scroll to their panel. */
.b2-panel{display:flex;flex-direction:column;gap:var(--sp-section)}

/* HERO CARD frame (2026-09-22: the glow-ring light-texture layer removed — it only ever painted on
   .hero-gw.pb-framed context, which is display:none there, see pbFrame rules; the wrapper below
   keeps the real 3px ring gap + border-radius the persona card sits inside). */
.hero-gw{position:relative;padding:3px;border-radius:calc(var(--r2) + 3px);}
.hero-in{position:relative;z-index:1;background:var(--white);border-radius:var(--r2);padding:var(--sp-block) var(--sp-card-pad);}
/* Centered + a real pill chip instead of quiet uppercase eyebrow text — this is the card's own
   identity line ("Visionary ✦ ผู้มองการณ์ไกล"), so it should read as a badge, not a caption. No
   leading dot (removed per direction — the ✦ inside famTh already marks it, a second dot in front
   was redundant clutter). */
/* Flat neutral-gray pill read as plain/uninteresting per direction ("เด่น หรือน่าสนใจขึ้น") —
   same size and shape, but now tinted+colored with the ACTIVE family's own accent (cyan/violet/
   pink) instead of a generic gray, matching the family-color language already used everywhere
   else on this card (icons, chip fills, str-box borders). bg/color are set inline per-render (and
   updated live on tab switch, see renderBook/heroPanelBody call sites) since they depend on
   whichever persona is currently showing, not a fixed value. */
.fam-badge{display:flex;width:fit-content;align-items:center;gap:var(--sp-glue);font-family:var(--font);font-size:var(--fs-h2);font-weight:var(--w-label);letter-spacing:0;margin:0 auto var(--sp-inline);padding:var(--sp-list) var(--sp-block);border-radius:var(--rpill);} /* 1st in the reading order: the persona's name pill, the largest text of the trio */
/* h.famIcon (2026-08-15, per Icon System audit review "ปรับให้เข้ากับ token ที่มี") — every persona
   already carries this (copied from FAM[fam].icon: lc-shield/lc-compass/lc-sparkles) but nothing
   rendered it, so the badge showed text only. Now shown at --ic-sm, tinted via currentColor so it
   automatically matches whatever accent famBadgeStyle() sets on the badge. */
.fam-badge svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
/* ความแข็งแกร่ง = green (a clear "this is good" signal — distinct from any persona accent color,
   so it reads the same for every persona); สิ่งที่ต้องระวัง = the same amber the sponsor chip/gold
   badges use (reads as "pay attention", not a scary red). Side-by-side on tablet/pc — was a fixed
   column on every viewport, so a wide screen wasted its own width instead of using it to show both
   at once. */
/* gap bumped sp-list(8px)->sp-stack(16px) (2026-08-31, per direction "padding ระหว่าง section...
   ตอนนี้เบียดๆ") — sp-list is this file's "repeated rows in one list" token (quiz options, bar
   rows), not the "one card section to the next" one; using it here made these 2 full bordered
   cards (ความแข็งแกร่ง/สิ่งที่ต้องระวัง) read as cramped list rows instead of the 2 distinct
   sections they are, unlike the sp-stack gap every OTHER card-to-card boundary on this tab uses
   (.ast-block/.str-grid/.risk-box's own margin-bottom, all sp-stack). */
.str-grid{display:flex;flex-direction:column;gap:var(--sp-stack);margin-bottom:var(--sp-stack);}
.str-grid .str-box{flex:1;}
.str-box{border-radius:var(--r1);padding:var(--sp-card-pad-sm);background:var(--paper);border:1px solid var(--line-soft);}
.str-box.wn{background:var(--paper);border-color:var(--line-soft);}
/* font-size bumped fs-eyebrow->fs-bodysm (2026-08-28, per direction "text title size เท่ากับ
   แลกรับการ์ดตัวจริง") — was 14px (an eyebrow-label size), now matches .redeem-t's 18px title size.
   letter-spacing:0 was left in place at the time (an eyebrow-style treatment, kept since only
   size was asked for) — but at 18px instead of the old 14px, that same em-relative tracking reads
   as visibly loose/spaced-out letterforms instead of a subtle label treatment (2026-08-28 follow-up,
   per direction "text spacing ดูห่างๆ ต้องการให้เท่าคำอื่นๆ ปกติ"), so it's dropped to normal here —
   .redeem-t itself (the size this now matches) never had letter-spacing either. */
/* gap bumped sp-glue(6px)->sp-inline(12px) alongside the icon bump below (2026-08-28, per direction
   "alignment ของ text title ตรงกับ บัตร Explorer...") — .str-box and .redeem-note share the same
   16px container padding already, so padding(16) + icon + gap landing on the same 36px total as
   .redeem-note's icon(24)+gap(12) makes both titles' text start flush at the same x position. */
.str-hd{display:flex;align-items:center;gap:var(--sp-inline);font-family:var(--font);font-size:var(--fs-bodysm);font-weight:var(--w-label);margin-bottom:var(--sp-list);color:var(--green-text);}
.str-box.wn .str-hd{color:var(--amber-text);}
/* size bumped ic-sm(16px)->ic-lg(24px) to match .redeem-note's own icon size (2026-08-28, per
   direction "icon size scale เท่ากับของ section บัตร Explorer และ Master Class..."). */
.str-hd svg{width:var(--ic-lg);height:var(--ic-lg);}
/* height:auto (not a forced square var(--ic-lg)) — matches .pass-ey-ic's own icon-DNA exactly
   (2026-09-16, per direction "ไอคอน size เท่ากับของ section ความคืบหน้าของ Playbook"); renders
   identically to the old forced-square rule for this square 160x160 source PNG, just literally the
   same recipe as that section's icon instead of a same-result-different-rule coincidence. */
.str-hd img{width:var(--ic-lg);height:auto;flex:0 0 auto;}
/* margin-left added (2026-09-02, per direction — "ข้อความสีดำ...alignment left กับ text title [not]
   กับไอคอน") — .str-hd's title text starts at icon-width + gap (--ic-lg 24px + --sp-inline 12px) from
   the box's own padding edge, but these list rows sit flush at that padding edge instead, one full
   icon-width to the left of where the title reads. Indents them to line up under the title's own
   text start, at every breakpoint (not just mobile) since the ask covers pc/tablet/mobile alike. */
.str-li{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--ink);line-height:1.5;margin-bottom:var(--sp-stack-tight);margin-left:calc(var(--ic-lg) + var(--sp-inline));}
/* สินทรัพย์ที่ถนัด — the one thing this whole card exists to tell the customer ("what you're
   suited for"), so the whole block is its own tinted panel (background+border in the persona's
   accent color, applied inline via h.accent) instead of just sitting bare on the card surface —
   this is the highlight the customer should see they're "คู่ควรกับ", not a footnote. */
.ast-block{border-radius:var(--r1);padding:var(--sp-card-pad-sm);margin-bottom:var(--sp-stack);}
/* .ev-empty-s.ast-block — the highlighted closing callout in the 3 empty-state cards (Book coming-soon,
   เกมหลัก pre-event, เกมหลัก ยังไม่ปลดล็อก). 2026-09-21, per direction (typography audit F5): the size/weight/
   width used to be inlined per call site — 16px / 20px / 20px, hand-typed weight 700 — so the same component
   rendered at two sizes across three pages, and the 20px was --fs-sub's pre-v4 value never followed up. One
   rule now: --fs-sub / --w-label. Only the per-instance tint (color/background/border) stays inline. */
.ev-empty-s.ast-block{max-width:44ch;display:inline-block;font-size:var(--fs-sub);font-weight:var(--w-label);}
.ast-lbl{display:flex;align-items:center;gap:var(--sp-inline);font-family:var(--font);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);margin-bottom:var(--sp-inline);}
/* svg sizing (2026-09-10) — .ast-lbl's only call site used to be a plain text label
   ("สินทรัพย์ที่ถนัด", no icon); renderPlaySummary's result card is the first to put an icon in
   front of it, same icon-header idiom as .str-hd svg (--ic-lg/24px) right above. */
.ast-lbl svg{width:var(--ic-lg);height:var(--ic-lg);flex:0 0 auto;}
.ast-chips{display:flex;flex-wrap:wrap;gap:var(--sp-list);}
/* Solid accent fill (prior pass) read as TOO loud — competing with the character card above it
   for attention. Back to a tint fill, but a stronger one than .ast-block's own 12% wrapper tint
   (26%) so the chip still visibly "pops" off that background instead of blending into it; icon +
   label are solid accent color (not ink) so the chip still reads as clearly on-theme. */
.chip{display:inline-flex;align-items:center;gap:var(--sp-glue);padding:var(--sp-list) var(--sp-stack);border-radius:var(--rpill);border:none;font-size:var(--fs-bodysm);font-weight:var(--w-label);}
.chip svg{width:var(--ic-sm);height:var(--ic-sm);}
/* SKILL ประจำการ์ด (2026-08-31, sits right after .str-grid in heroDetailBody) reuses .conf-box/
   .conf-glow/.conf-row/.conf-tr/.conf-fi/.conf-vl wholesale (see skillCardHTML's own comment). All
   the .skc-* modifiers below use COMPOUND selectors (.conf-x.skc-x, not .skc-x alone) — .conf-rl/
   .conf-tr/.conf-fi/.conf-vl are defined further down this sheet, so a same-specificity .skc-x alone
   loses that cascade to them (confirmed live via getComputedStyle the first time this was tried). */
.skc-t{font-family:var(--font);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);margin-bottom:var(--sp-inline);}
/* label: w-body(500) per direction (2026-08-31 3rd round — supersedes the w-label(700) the round
   before this gave it). Width still overridden auto+nowrap — .conf-rl's own fixed 86px was sized for
   confRow's short labels (ตัวตน/พฤติกรรม/วินัย) and wrapped these longer ones to 2 lines. */
.conf-rl.skc-rl{width:6em;flex:0 0 6em;white-space:nowrap;font-weight:var(--w-body);color:var(--ink);}
/* bar chart thickness matched to .risk-tr/.risk-fi's own 3px + rounded caps (2026-08-31, per
   direction "chart ความหนาของ bar เท่ากับ bar ของ ความเสี่ยงจริง") — .conf-tr/.conf-fi are a
   1px hairline by default; rpill radius comes along with the thickness bump since a bare 3px
   rectangle (no rounded ends) doesn't read as the same "bar" .risk-fi's own 3px pill does. */
.conf-tr.skc-tr{height:calc(var(--bar-h)/var(--pbz,1));border-radius:var(--rpill);}
.conf-fi.skc-fi{height:calc(var(--bar-h)/var(--pbz,1));border-radius:var(--rpill);}
/* value text size matched to .risk-vl's own fs-sub (2026-08-31, per direction "1/10...text size
   เท่ากับ 1 (section ความเสี่ยง 'บอก' vs 'จริง')") — .conf-vl's own fs-meta(14px) read small next
   to that section's own value numbers. Font-weight bug fix (2026-08-31, found while investigating
   "fix bug") — this comment originally claimed "weight/color/font-family (serif) already matched,
   so only size needed overriding", but that was wrong: .conf-vl's base weight is --w-head(500)
   while .risk-vl's is --w-label(700) — they never matched, so the "1/10" values kept rendering
   visibly lighter than the risk section's own numbers this rule was written to match. Weight added
   below to actually deliver what the comment always claimed was already true. */
.conf-vl.skc-vl{font-size:var(--fs-sub);font-weight:var(--w-label);}
.skc-chiprow{margin-bottom:var(--sp-inline);}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
/* Right-aligned+secondary (prior pass) → full-width+primary per direction: this is the ONE action
   on the identity card worth an ink-filled CTA, so it should read with the same weight as any
   other primary button in the app, not a quiet outlined pill off to one side. */
.hero-acts{display:flex;margin-top:var(--sp-stack);}
.hero-note{margin-top:var(--sp-inline);display:flex;align-items:flex-start;gap:var(--sp-inline);padding:var(--sp-list) var(--sp-inline);border-radius:var(--r1);background:var(--accent);font-size:var(--fs-eyebrow);font-weight:var(--w-body);color:var(--muted);line-height:1.5;}
.hero-note svg{width:var(--ic-sm);height:var(--ic-sm);flex-shrink:0;margin-top:1px;}
/* .skill-note modifier (2026-08-28, per direction) — scopes the SKILL-disclaimer .hero-note (in
   redeemCardHTML) to redeem-note's own padding/icon size so its icon+text starts flush with
   redeem-note's "บัตร Explorer..." line right above it, WITHOUT touching the plain .hero-note used
   elsewhere (e.g. the hero-sec's own "ตัวตนนี้สรุปจากคำตอบ..." note) — was --sp-inline (12px)/--ic-sm
   (16px), now matches --sp-card-pad-sm (16px)/--ic-lg (24px) exactly like .redeem-note. */
.hero-note.skill-note{padding:var(--sp-inline);background:none;justify-content:center;text-align:center;font-size:var(--fs-label);} /* 3rd: the quietest block; no fill, no icon, centered per direction; +2px over the base --fs-eyebrow */
.hero-note.skill-note b{font-size:var(--fs-bodysm);} /* "ค่า SKILL บนการ์ด" title reads a step up (18px) from its own description line (16px) */
/* .hero-ev-tabs (the pre/post-event in-card picker inside Book v1's hero card) removed 2026-08-30
   along with คู่มือ 1 itself — see the removal note near BOOK2_TAB. */
.ev-empty{text-align:center;padding:24px var(--sp-inline);border:1px dashed var(--line-strong);border-radius:var(--r1);}
.ev-empty-ic{width:44px;height:44px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-inline);}
.ev-empty-ic svg{width:var(--ic-md);height:var(--ic-md);color:var(--muted);}
/* Games/Booth's "coming soon" states use a full-color illustrated PNG (นาฬิกาทราย.png) instead of
   the lucide lc-hourglass glyph — same icon-set convention as ICON_JOYSTICK_PNG etc. elsewhere in
   the app, which never sit on a tinted circle either (2026-08-28, per direction "ไม่ต้องมี background
   color ด้านหลัง"). Those two call sites zero out .ev-empty-ic's own background inline; this sizes
   the <img> itself — bumped to 48px (2026-08-28, per direction "icon size 48px", was --ic-md/20px)
   — while those same call sites also grow the 44px .ev-empty-ic wrapper to match via inline style,
   so the bigger icon isn't cropped/squeezed into a circle sized for the old 20px lucide glyph. */
.ev-empty-ic img{width:48px;height:48px;object-fit:contain;}
.ev-empty-t{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);margin-bottom:var(--sp-glue);}
/* text-wrap:balance added (2026-09-02, per direction — Games' "Coming soon" copy read as "pushed
   down, disorganized" on a narrow real phone like iPhone X) — measured the actual box model first:
   margins/line-height were already uniform (6px between the two headings, 16px between paragraphs,
   27.9px line-height throughout), so this was never a spacing bug. The real cause is ragged natural
   wrapping: at 375px, "หนึ่งในส่วนสำคัญของ PLAYBOOK ในแบบของคุณ" (and each <br>-separated sentence in
   the longer paragraph below it) breaks with a single orphan word stranded alone on its own line
   ("คุณ", "ทันที") — technically correct wrapping, but it reads as messy/uneven rather than deliberate.
   balance redistributes each wrapped segment's line lengths evenly instead of greedily filling every
   line before wrapping, so short trailing orphans disappear without touching any margin/line-height —
   only where lines break, not the rhythm between them. Falls back to normal wrapping silently on any
   engine that doesn't support it yet (progressive enhancement, not a hard dependency). */
.ev-empty-s{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.5;max-width:34ch;margin:0 auto var(--sp-stack);text-wrap:balance;}
/* Every .ev-empty-s (and, with the Games/Booth "coming soon" states, now sometimes 2+ of them
   stacked) carries its own trailing margin-bottom for the gap ABOVE whatever follows it (another
   paragraph, or a CTA button) — but when there's nothing after the last one, that same margin just
   stacks on top of .ev-empty's own bottom padding, making the bottom gap read far heavier than the
   top (2026-08-28, per a screenshot showing exactly this on Games' new no-button empty state). Zero
   it on whichever child ends up last so the box's own padding is the only bottom space either way —
   a no-op for the existing CTA-button empty states (buttons carry no trailing margin already). */
.ev-empty>:last-child{margin-bottom:0;}

.card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);overflow:hidden;position:relative;}
/* the corner-bracket frame ornament (a ::after with 8 tiny corner ticks) was removed per direction —
   every .card now reads as a plain flat surface: border + radius only, no extra frame layer. */
/* .mb / .mb-lg are retained as harmless HTML hooks but no longer carry spacing — every section gap
   now comes from .scroll's flex `gap` (--sp-section), so section rhythm lives in exactly one place. */
.s-pad{padding:var(--sp-block) var(--sp-card-pad);}
/* letter-spacing dropped (2026-08-29, per direction "spacing ตัวอักษร ให้เป็นค่าปกติ") — 0.1em is a
   Latin-eyebrow-label tracking value; nearly every .s-ey instance in this file is Thai (ข้อมูลจาก
   กิจกรรมบูธจริง/เฉพาะสำหรับ.../ทำอะไรต่อดี/etc.), where it just read as unusually gappy, not a
   deliberate label treatment. One Latin instance ("AI Insight") loses its tracked-caps look too —
   accepted for one shared class over a one-off exception, matching the "ทั้งหมดในระบบ" (everywhere
   in the system) scope of the direction. Same fix already applied to .sp-kick (2026-08-28) and now
   to .pass-ey/.ns-ey below. */
.s-ey{font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-head);text-transform:uppercase;color:var(--muted);margin-bottom:var(--sp-glue);display:flex;align-items:center;gap:var(--sp-glue);}
.s-ey svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--ink);}
.s-h{font-size:var(--fs-heading);font-weight:var(--w-label);letter-spacing:0;color:var(--ink);margin-bottom:4px;}
.s-sub{font-size:var(--fs-subtitle);font-weight:var(--w-body);color:var(--muted);line-height:1.5;margin-bottom:var(--sp-card-pad-sm);}
/* Stepped down from --r2 to --r1 (2026-08-15, per Card & Section review "09") — this panel sits
   nested inside a --r2 .card, so it was matching its own parent's radius instead of reading as a
   smaller nested surface; .next-card (same nesting depth, same card) was already --r1. */
.risk-box{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r1);padding:var(--sp-stack) var(--sp-stack);margin-bottom:var(--sp-stack);}
.risk-hd{display:flex;align-items:center;gap:var(--sp-inline);margin-bottom:var(--sp-list);}
/* Hierarchy pass (2026-08-15, "ตอนนี้ดูเท่าๆ กันไปหมด") — .risk-tag/.risk-match/.risk-desc were all
   --fs-bodysm (16px), so the box's one real headline (the "ตรงกัน"/"ต่างกัน N" finding) never stood
   out from its own label or the explanatory paragraph under it. .risk-tag demoted to a small label,
   .risk-match promoted to the actual headline, .risk-desc receded to muted supporting copy. */
/* weight/color bumped w-body/muted -> w-label/ink (2026-08-28, per direction "ความเสี่ยง 'บอก' vs
   'จริง' text weight 700 และสีเดียวกับ สูง - สอดคล้องดี") — reverses the small-label demotion this
   rule got in the 2026-08-15 hierarchy pass above; .risk-match right next to it keeps its own
   already-matching w-label/ink styling, so the two now read at the same weight. */
.risk-tag{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);flex:1;}
.risk-match{display:inline-flex;align-items:center;gap:var(--sp-glue);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);padding:var(--sp-stack-tight) 0;}
.risk-desc{font-size:var(--fs-subtitle);font-weight:var(--w-body);color:var(--muted);line-height:1.5;margin-bottom:var(--sp-stack);}
.risk-slbl{font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);letter-spacing:0;margin-bottom:var(--sp-list);text-transform:uppercase;}
.risk-bars{display:flex;flex-direction:column;gap:var(--sp-list);}
.risk-row{display:flex;align-items:center;gap:var(--sp-inline);}
.risk-rl{width:86px;flex-shrink:0;font-size:var(--fs-label);font-weight:var(--w-body);color:var(--ink);}
/* Bumped 1px→3px to match .prog-track/.prog-fill (2026-08-15, per Component System review) — the
   two other single-fill bars in the app (.conf-tr/.conf-fi included) read as noticeably thinner
   than the Book page's own top progress bar despite the same "one bar, one fill" idea. */
.risk-tr{flex:1;height:calc(var(--bar-h)/var(--pbz,1));background:var(--line-soft);overflow:visible;position:relative;border-radius:var(--rpill);}
.risk-fi{height:calc(var(--bar-h)/var(--pbz,1));background:var(--ink);position:absolute;left:0;top:0;border-radius:var(--rpill);}
/* The actual risk numbers (8, 6.3) were the smallest text in the whole box (--fs-meta, 12px) despite
   being the data point this section exists to show — bumped to a real stat-number size/weight, same
   serif-numeral language as .conf-sc just below it in the same card. */
.risk-vl{width:50px;text-align:right;font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);font-family:var(--serif);}
/* confidence highlight — the soft blue wash moved here from the identity card (it read poorly overlapping the card art); a quiet radial glow behind the score corner only */
.conf-box{background:var(--paper);border:1px solid var(--line-soft);border-radius:var(--r1);padding:var(--sp-stack) var(--sp-stack);position:relative;overflow:hidden;}
.conf-glow{position:absolute;top:-45%;right:-15%;width:60%;height:150%;background:radial-gradient(closest-side,rgba(101,152,255,0.18),rgba(101,152,255,0) 70%);pointer-events:none;z-index:0;}
.conf-box>*:not(.conf-glow){position:relative;z-index:1;}
.conf-hd{display:flex;align-items:center;gap:var(--sp-inline);margin-bottom:var(--sp-stack);}
/* letter-spacing dropped 0.08em->normal (2026-08-31, per direction "spacing ของตัวอักษร ดูห่างๆ
   แก้ไขให้ระยะปกติ") — was the standard eyebrow-label tracking, but at this size/weight on an
   all-caps "CONFIDENCE SCORE" it read as too loose; same fix pattern as .str-hd's own tracking
   removal (2026-08-28), just for this label instead. */
.conf-ml{font-family:var(--font);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);margin-bottom:2px;text-transform:uppercase;}
.conf-mv{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);}
/* Was a bare nested span with a 32px/12px size jump and zero gap — read as two colliding numbers
   stuck together rather than one score. inline-flex + baseline align + a small gap fixes the
   collision; narrowing the size ratio (12px→16px) keeps "/100" legible as part of the same figure
   instead of an afterthought. */
.conf-sc{margin-left:auto;text-align:right;font-family:var(--serif);font-size:var(--fs-title);font-weight:var(--w-label);color:var(--ink);line-height:1;letter-spacing:0;display:inline-flex;align-items:baseline;gap:3px;}
.conf-su{font-size:var(--fs-sub);font-weight:var(--w-head);color:var(--muted);font-family:var(--font);}
.conf-bars{display:flex;flex-direction:column;gap:var(--sp-list);}
.conf-row{display:flex;align-items:center;gap:var(--sp-inline);}
.conf-rl{width:86px;flex-shrink:0;font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--ink);}
.conf-tr{flex:1;height:calc(var(--bar-h)/var(--pbz,1));background:var(--line-soft);position:relative;border-radius:var(--rpill);} /* 3px + rounded, same as .risk-tr and the SKILL bars */
.conf-fi{height:calc(var(--bar-h)/var(--pbz,1));background:var(--ink);position:absolute;left:0;top:0;border-radius:var(--rpill);}
.conf-vl{width:50px;text-align:right;font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);font-family:var(--serif);}
.conf-note{font-size:var(--fs-subtitle);font-weight:var(--w-body);color:var(--muted);line-height:1.5;margin-top:0;margin-bottom:var(--sp-stack);} /* sits right after conf-hd, before conf-bars — same slot risk-desc holds in .risk-box */
.radar-sec{padding:var(--sp-block) var(--sp-card-pad);}
.radar-ww{display:flex;justify-content:center;margin-top:var(--sp-stack);}
/* radar's own closing "Insight" line (Radar Chart DNA §2 Visual Structure) — fades in AFTER the
   chart's own reveal sequence finishes (transition-delay 1s, past the last data-point's ~.92s pop),
   so it reads as the chart's payoff rather than competing with it for attention. */
/* align-items:flex-start, not center (2026-08-24, per direction "ไอคอนให้ alignment แนวนอนกลางกับ
   หัวข้อ") — this callout's sentence wraps to 2 lines on the app's mobile-scaled type, so centering
   the icon against the WHOLE wrapped block (old behavior) drifted it below where the sentence
   actually starts; top-aligning keeps it level with that first line regardless of wrap length. */
.radar-insight{display:flex;align-items:flex-start;gap:var(--sp-inline);margin-top:var(--sp-stack);padding:var(--sp-stack-tight) var(--sp-stack);border-radius:var(--r1);border:1px solid var(--line-soft);font-size:var(--fs-bodysm);color:var(--ink);line-height:1.5;}
/* margin-top nudge (2026-08-29, per direction "ให้ไอคอน alignment top กับ text") — align-items:
   flex-start above already box-top-aligns the icon with the text span, but at font-size:18px/
   line-height:1.5 the first line's actual glyph-top sits ~4px below its own line-box top (leading
   split above/below the glyph), so the 16px icon — anchored to the line-box top, not the glyph —
   read as sitting too high relative to the visible characters. This nudges it down to match. */
.radar-insight-ic{display:flex;flex:0 0 auto;margin-top:4px;}
.radar-insight svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
.radar-insight b{font-weight:var(--w-label);}
.int-bar-list{display:flex;flex-direction:column;gap:var(--sp-stack);margin-top:var(--sp-stack);}
.int-bar-row{display:grid;grid-template-columns:1fr auto;gap:var(--sp-glue) 10px;align-items:center;}
.int-bar-l{font-size:var(--fs-bodysm);color:var(--ink);font-weight:var(--w-body);}
.int-bar-v{font-family:var(--serif);font-size:var(--fs-bodysm);color:var(--ink);font-weight:var(--w-label);}
/* muted-row text color dropped (2026-09-22, per direction "ตัวเลข % ทั้งหมด text สีดำ" / labels all
   black too) — every row's label + value now stays --ink regardless of touched state; only the bar
   fill itself (below) still fades for an untouched zone. */
.int-bar-tr{grid-column:1/-1;height:calc(var(--bar-h-lg)/var(--pbz,1));border-radius:var(--rpill);background:var(--accent);overflow:hidden;}
.int-bar-fi{height:100%;border-radius:var(--rpill);background:var(--violet);}
.int-bar-row.muted .int-bar-fi{background:color-mix(in srgb,var(--violet) 32%,var(--white));}
.int-bar-note{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;margin-top:var(--sp-list);}
/* "เปิดหน้า efin AI" icon (2026-08-20) — ported directly from the actual efinAI Orb reference build
   (efin AI Sourcecode/efinAI-orb/index.html: .orb/.orb::before + @property --angle), not a
   from-scratch approximation — first pass (a hand-rolled single conic-gradient in the app's generic
   --cyan/--violet/--pink/--yellow tokens) didn't match the real thing, per direction "ยังไม่เหมือน
   ภาพจริง". Kept the reference's actual recipe and literal brand colors (#0D539B blue / #20e71a
   green — efinAI's own palette, not this app's spectrum tokens) so it's visually the same orb:
   soft-edged circular mask (radial-gradient mask, not a hard border-radius clip), 6 stacked
   conic-gradients each rotating a shared --efin-orb-angle custom property at a different
   multiplier/direction (2×/-3×/2×/1×/-2×, matching the source exactly) for the organic swirl,
   blur+contrast filter, inset white glow to feather the edge into the button's own white
   background (same technique the reference uses against its white page background).
   Scaled from the reference's 120px hero size down for a button-inline icon — first --ic-md/20px
   (too big, a solid filled blob reads heavier than a same-size thin-stroke lucide icon), then
   --ic-sm/16px, now --ic-lg/24px (2026-08-20, per direction "efinAI Orb size 24px"). blur/inset
   scaled up proportionally with it — kept well under the reference's own 4px/18px (still tuned
   for a small icon, not the 120px hero) but a touch stronger than the 16px pass so the texture
   doesn't get lost at the larger size. */
@property --efin-orb-angle{syntax:'<angle>';initial-value:0deg;inherits:false;}
.rk-grid{stroke:var(--line-soft);fill:none;stroke-width:1;}
.rk-axis{stroke:var(--line-soft);stroke-width:1;}
.rk-poly{stroke:var(--ink);stroke-width:1.5;}
.rk-dot{fill:var(--ink);}

/* ── example-data marker — every section below is populated with illustrative demo values
   (booth games / analysis engine don't exist yet); this tag keeps that honest at a glance ── */
/* Padding unified to 4px 11px (2026-08-15, per Component System review "ให้เป็นแพทเทิร์นเดียวกัน")
   across every small status badge — this one plus .ds-chip/.route-badge/.rt-badge/.bc-zchip/
   .gr-played/.prof-vf/.prof-tier — 8 rules that were each independently at their own padding
   before. .chip stays its own larger established size (icon+text asset tag, a different scale of
   component, not part of this "small badge" family). radius also moved off its own 20px literal
   onto --rpill — renders identically at this size (48>=height/2 either way) but stops it being
   the one pill in the file with a magic-number radius. */

/* trait score bars — thicker filled bars (distinct from the hairline risk/confidence bars) */
.trait-sec,.alloc-sec{padding:var(--sp-block) var(--sp-card-pad);border-top:1px solid var(--line-soft);}
.trait-hd{display:flex;align-items:center;gap:var(--sp-inline);margin-bottom:2px;}
.trait-list{display:flex;flex-direction:column;gap:var(--sp-stack);margin-top:var(--sp-stack);}
.trait-row{display:grid;grid-template-columns:1fr auto;gap:var(--sp-glue) 10px;align-items:center;}
/* font-weight 700 (2026-08-29, per direction) — matches .alloc-l/.dd-li's own bump. */
.trait-l{font-size:var(--fs-bodysm);color:var(--ink);font-weight:var(--w-body);}
.trait-v{font-family:var(--serif);font-size:var(--fs-bodysm);color:var(--muted);}
.trait-v b{color:var(--ink);}
.trait-tr{grid-column:1/-1;height:calc(var(--bar-h)/var(--pbz,1));border-radius:var(--rpill);background:var(--accent);overflow:hidden;}
.trait-fi{height:100%;border-radius:var(--rpill);background:linear-gradient(90deg,var(--violet),var(--cyan));}
/* Data-provenance chips (2026-08-26, per direction — the "how we know this" part was missing under
   the 4 bars above). Green = that data source is already collected; a future not-yet-done source
   would render without .done (quiet grey), matching the reference's "แตะชิปสีเทาเพื่อไปเก็บต่อ" idiom. */
.trait-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:var(--sp-stack);}
.trait-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:var(--rpill);font-size:var(--fs-eyebrow);font-weight:var(--w-label);background:var(--accent);color:var(--muted);}
.trait-chip svg{width:var(--ic-xs,14px);height:var(--ic-xs,14px);flex:0 0 auto;}
.trait-chip.done{background:color-mix(in srgb,var(--green-text) 12%,var(--white));color:var(--green-text);}
.trait-note{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;margin-top:var(--sp-list);}

/* recommended allocation — 4 buckets summing to 100%, a stacked bar + legend */
.alloc-bar{display:flex;height:calc(var(--bar-h-lg)/var(--pbz,1));border-radius:var(--r1);overflow:hidden;margin:var(--sp-stack) 0 var(--sp-inline);}
.alloc-seg{height:100%;}
.alloc-legend{display:flex;flex-direction:column;gap:var(--sp-list);}
.alloc-row{display:flex;align-items:center;gap:var(--sp-inline);font-size:var(--fs-bodysm);}
/* border-radius bumped 3px->4px (2026-08-31, per corner-radius audit) — unified this file's
   "rounded-square dot/bar" idiom (.lg-sw, .pcb-sttrack/.pcb-stfill, .pcE-divider all shared this
   same 3px) onto one consistent value. */
.alloc-dot{width:9px;height:9px;border-radius:4px;flex-shrink:0;}
/* font-weight 700 (2026-08-29, per direction) — matches .trait-l/.dd-li's own bump just below. */
.alloc-l{flex:1;color:var(--ink);font-weight:var(--w-body);}
.alloc-p{font-family:var(--serif);color:var(--ink);font-weight:var(--w-label);}

/* ══ CHART RENDERING (static) ══ every chart on the page (confidence/risk/trait/allocation bars,
   radar) draws straight at its real final value — a printed document has no scroll-into-view or
   hover moment, so there's no reveal or highlight state to animate (2026-09-22, per direction —
   motion/interaction removed). `.viz-bar` is the shared "bar at its real value" width primitive. */
.viz-bar{width:var(--tw,0);}

/* radar — static, print-like: every chart renders straight at its final state (no reveal animation,
   no tap-to-select), same "a document has no scroll-into-view moment" reasoning pbBuild() already
   applies to every other chart on the page (2026-09-22, per direction — motion/interaction removed). */
.rk-poly{transform-box:view-box;transform-origin:0 0;}
/* font-weight reverted 700->500 (2026-08-29, per follow-up direction "text weight 500") — the
   earlier 700 bump (same session) read too heavy for this longer-running body copy; --w-body is
   this file's normal paragraph weight everywhere else. */
.dd-li{display:flex;align-items:flex-start;gap:var(--sp-inline);font-size:var(--fs-bodysm);color:var(--ink);line-height:1.5;margin-bottom:var(--sp-inline);font-weight:var(--w-body);}
.dd-li svg{width:var(--ic-sm);height:var(--ic-sm);flex-shrink:0;margin-top:2px;color:var(--violet);}

/* shared list-row base — one clickable row: leading marker → text block → optional trailing bit. klib-row/side-row/rs each add only what makes them different (column count, padding, divider). */
.list-row{display:grid;align-items:center;gap:var(--sp-inline);cursor:pointer;}
/* ══ LIBRARY (คลังความรู้ sub-screen) ══ real category names/counts, accordion-per-category */
.lib-num{font-family:var(--serif);}
/* ══ A4 EBOOK PAGES (2026-09-21, per direction "อ้างอิงตามสัดส่วน 2480*3508 ... ebook หรือ pdf file") ══
   The Playbook (ผลลัพธ์ + คลังความรู้ + ศัพท์) is laid out as fixed A4 sheets, ratio 2480:3508 (= A4 @300dpi).
   Each sheet is authored at 794 x 1123.1 CSS px (A4 @96dpi — same ratio) and uniformly scaled with --pbs
   to fit the reading column (phone = small, desktop ~0.95), so the composition is identical at every
   width. pbBuild() (JS) packs the section blocks onto sheets; @media print renders the same sheets 1:1
   on @page A4 so print / "Save as PDF" matches the screen page-for-page. */
.pb-doc{display:flex;flex-direction:column;align-items:center;gap:var(--sp-inline);}
.pb-fit{width:794px;height:calc(794px*3508/2480);flex:0 0 auto;position:relative}
.pb-page{position:absolute;left:0;top:0;width:794px;height:calc(794px*3508/2480);box-sizing:border-box;background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow-page);display:flex;flex-direction:column;padding:var(--pb-pad-top) var(--pb-pad-x) var(--pb-pad-bottom);overflow:hidden;}
.pb-cover{padding:0;border:0;background-color:var(--cover-paper);background-size:100% 100%;background-repeat:no-repeat;}
.pb-frame{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
.pb-intro .s-h{margin-bottom:0;}
.pb-intro .s-sub{margin:var(--sp-stack-tight) 0 0;}
.pb-body>.pb-intro{margin-bottom:calc(var(--sp-stack) - var(--pb-gap));}
/* no rule between a section's heading and its first row */
.pb-page.pb-unframed .s-h+.dd-asset,.pb-page.pb-unframed .sides-hd+.side-item{border-top:none;padding-top:0;}
.pb-frame-line{fill:none;stroke:var(--frame-line);stroke-width:1.1;}
.pb-frame-star{fill:var(--frame-star);}
.pb-frame-halo{fill:var(--paper);} /* punches the gap in the line behind each star */
.pb-page.pb-framed{background:var(--paper);} /* frame line is 30px in, so 62 = 32px between the frame and the content */
/* body content runs edge to edge inside the frame; only the header / footer text is inset, to stay clear of the rounded corners */
.pb-page.pb-framed .pb-hd,.pb-page.pb-framed .pb-ft{padding-left:var(--pb-folio-inset);padding-right:var(--pb-folio-inset);} /* #F7F8F7 = --paper, per the supplied swatch */
/* framed sheet: the ornament is the container, so the persona card sits straight on the page — no glow frame / card box of its own — and is shown larger */
.pb-page.pb-framed .hero-gw{padding:0;}
.pb-page.pb-framed .hero-in{background:transparent;padding:0;border-radius:0;}
#b2ident-head:empty{display:none;}
/* the card's stage: the card centred, brand assets scattered in the gutters/corners around it */
.pb-stage{position:relative;display:flex;justify-content:center;padding:var(--sp-block) 0;}
.pb-stage .cr2{position:relative;z-index:2;flex:0 0 auto;}
.pb-el{position:absolute;width:var(--w);opacity:var(--op);z-index:var(--z);transform:rotate(var(--r));filter:drop-shadow(0 var(--sh) var(--shb) rgba(17,19,24,var(--sha))) blur(var(--bl));pointer-events:none;}
.pb-page #b2ident-head{margin-top:var(--sp-stack);} /* breathing room under the single card (its caption is gone) */
/* the card JPGs carry their own rounded corner (~5% of the width, black outside it): clip the frame to that same
   curve (a touch larger) so the black corner pixels never show */
.pb-page .cr2{border-radius:5.8% / 4.15%;}
.pb-page.pb-framed .hero-in .cr2{max-width:400px;margin-top:var(--sp-list);}
.pb-page.pb-framed .hero-in .cr2-cap{max-width:420px;margin-top:var(--sp-stack);}
.pb-hd{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-stack);padding-bottom:var(--sp-inline);border-bottom:1px solid var(--line-soft);font-size:var(--fs-folio);color:var(--muted);}
.pb-hd b{font-weight:var(--w-label);color:var(--ink);}
.pb-pn-n{font-weight:var(--w-label);color:var(--ink);}
.pb-body{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:var(--pb-gap);padding-top:var(--pb-gap);}
.pb-body>*{flex:0 0 auto;margin:0;}
.pb-ft{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-stack);padding-top:var(--sp-inline);border-top:1px solid var(--line-soft);font-size:var(--fs-folio);color:var(--muted);}
/* "กลับไปสารบัญ" — bottom-right of every sheet, in the slot the folio used to hold. Violet pill (icon +
   text both violet) so it reads as a real button, not another line of footer caption text. */
.pb-toc-back{display:inline-flex;align-items:center;gap:var(--sp-glue);text-decoration:none;color:var(--violet);font-weight:var(--w-label);background:color-mix(in srgb,var(--violet) 12%,var(--white));border-radius:var(--rpill);padding:var(--sp-glue) var(--sp-list);pointer-events:auto;}
/* .pb-page[data-sect="journey"] blanket-disables pointer-events + forces cursor:default!important on
   its own print-like content below (see that rule) — this is a real link, not print filler, so it
   opts back in on both counts (needs !important to beat that rule's own !important). */
.pb-page[data-sect="journey"] .pb-toc-back{cursor:pointer!important;}
.pb-toc-back svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;color:var(--violet);}
/* ── สารบัญ: the consent screen's backdrop DNA (room1.jpg under a flat white wash), not paper + frame ── */
/* background lifted from better-trade-2026.vercel.app's own .cta__panel (2026-09-22, per direction):
   a flat #f5f5f5 base + two radial glows — pale blue top-left, the app's own violet bottom-right. */
.pb-toc{padding:0;border:0;position:relative;overflow:clip;isolation:isolate;}
.pb-page.pb-toc{background-color:#f5f5f5;background-image:radial-gradient(circle at 18% 0%,rgba(234,242,255,.72) 0%,rgba(0,0,0,0) 34%),radial-gradient(circle at 92% 100%,rgba(114,45,244,.12) 0%,rgba(0,0,0,0) 34%);} /* .pb-page.pb-framed{background:var(--paper)} (2 classes) would otherwise outrank a bare .pb-toc (1 class) */
.toc-in{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;padding:var(--pb-pad-top) var(--pb-pad-x) var(--pb-pad-bottom);}
.toc-h{font-size:var(--fs-title);font-weight:var(--w-label);color:var(--ink);line-height:1.1;margin:var(--sp-block) 0 var(--sp-block);}
.toc-list{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
/* divider lives on the category label, not between individual rows — one rule per chapter, not per item */
.toc-ch{font-size:var(--fs-eyebrow);font-weight:var(--w-head);text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:var(--sp-inline) 0 var(--sp-hairline);padding-top:var(--sp-inline);border-top:var(--rule-w) solid var(--rule);}
.toc-ch:first-child{margin-top:0;padding-top:0;border-top:none;}
.toc-row{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-list);padding:var(--sp-glue) 0;text-decoration:none;color:var(--ink);}
.toc-t{font-size:var(--fs-bodysm);font-weight:var(--w-body);}
.toc-n{font-family:var(--serif);font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);flex:0 0 auto;}
/* accordions are always expanded on a page (a fixed sheet can't grow when a row opens; print needs it all) */
.pb-page .side-body{max-height:none;overflow:visible;}
.pb-page .side-row{cursor:default;}
.pb-page .side-row .s-cv{display:none;}
/* sheet 1: the SKILL note hugs its text instead of filling the width */
.pb-page .hero-note.skill-note{width:100%;max-width:400px;margin-left:auto;margin-right:auto;} /* same width as the character card above it (.cr2 max-width 400) */
/* sheet 2: strengths / watch-outs side by side (the pc layout) at any viewport width */
:root .pb-page .str-grid{flex-direction:row!important;}
/* every card on a sheet uses the strengths-box surface (#F7F8F7 + hairline) instead of white */
.pb-page .card{background:var(--paper);border:1px solid var(--line-soft);}
/* หน้า "เส้นทาง" (journey) is print-like: nothing on it reacts to hover / tap */
.pb-page[data-sect="journey"]{pointer-events:none;}
.pb-page[data-sect="journey"] *{cursor:default!important;}
/* เจาะรายสินทรัพย์: all four assets laid out one after another (no tabs) */
.dd-asset{padding:var(--sp-inline) 0;border-top:1px solid var(--line-soft);}
.dd-asset:first-child{border-top:none;padding-top:0;}
.dd-asset-hd{display:flex;align-items:center;gap:var(--sp-list);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);margin-bottom:var(--sp-inline);}
.dd-asset-hd svg{width:var(--ic-lg);height:var(--ic-lg);color:var(--violet);flex:0 0 auto;}
.dd-asset-hd img{width:var(--ic-lg);height:var(--ic-lg);object-fit:contain;flex:0 0 auto;}
/* sheet 2: sections are set apart by ornaments, not frames */
#b2ident-detail .ast-block,#b2ident-detail .str-box,#b2ident-detail .str-box.wn,#b2ident-detail .conf-box{background:none!important;border:none!important;border-radius:0;box-shadow:none;}
#b2ident-detail .conf-glow{display:none;}
#b2ident-detail .ast-block,#b2ident-detail .str-box,#b2ident-detail .conf-box{padding-left:0;padding-right:0;} /* unframed: text lines up with the ends of the dividers */
#b2ident-detail>*{margin-top:0!important;margin-bottom:0!important;}
#b2ident-detail .str-grid{gap:var(--sp-stack);margin:0;align-items:stretch;}
.orn-h{height:var(--rule-w);background:var(--rule);margin:var(--sp-stack) 0;}
.orn-v{display:flex;flex-direction:column;align-items:center;gap:var(--sp-inline);flex:0 0 auto;align-self:stretch;margin:var(--sp-stack) 0;} /* margin pulls the line in from the section rules above/below */
.orn-v i{flex:1;width:var(--rule-w);min-height:var(--ic-lg);}
.orn-v i:first-child{background:linear-gradient(to bottom,var(--rule-fade),var(--rule-deep));}
.orn-v i:last-child{background:linear-gradient(to bottom,var(--rule-deep),var(--rule-fade));}
.orn-star{width:16px;height:16px;flex:0 0 auto;fill:var(--ornament);}
.orn-hs{display:flex;align-items:center;gap:var(--sp-inline);width:100%;max-width:400px;margin:var(--sp-stack) auto;} /* ORN_V rotated 90deg: same glyph, used as a block divider so it shares .skill-note's own 400px width */
.orn-hs i{flex:1;height:var(--rule-w);}
.orn-hs i:first-child{background:linear-gradient(to right,var(--rule-fade),var(--rule-deep));}
.orn-hs i:last-child{background:linear-gradient(to right,var(--rule-deep),var(--rule-fade));}
/* ── chapters วิเคราะห์ / พอร์ต / เส้นทาง: unframed ── */
.pb-page.pb-unframed :is(.card,.risk-box,.conf-box,.ast-block,.radar-insight){background:none!important;border:none;border-radius:0;box-shadow:none;}
.pb-page.pb-unframed .conf-glow{display:none;}
.pb-page.pb-unframed :is(.s-pad,.sides-hd,.radar-sec,.trait-sec,.alloc-sec,.risk-box,.conf-box,.route-steps,.radar-insight){padding-left:0;padding-right:0;}
.pb-page.pb-unframed .list-row.side-row{padding-left:0;padding-right:0;}
/* section dividers: the same 2px #c4c5c7 hairline as sheet 2 */
.pb-page.pb-unframed :is(.trait-sec,.alloc-sec,.dd-asset,.side-item){border-top:var(--rule-w) solid var(--rule);}
.pb-page.pb-unframed .risk-box+.conf-box{border-top:var(--rule-w) solid var(--rule);padding-top:var(--sp-stack);margin-top:var(--sp-stack);}
.pb-page.pb-unframed .pb-body>.card~.card{border-top:var(--rule-w) solid var(--rule);padding-top:var(--sp-stack);}
.pb-page.pb-unframed .dd-asset:first-child,.pb-page.pb-unframed .card>.side-item:first-child,.pb-page.pb-unframed .card>:is(.trait-sec,.alloc-sec):first-child{border-top:none;}
/* library / glossary blocks (static + fully expanded — a page has no accordions) */
.pb-plain{padding:0;}
.pb-cat-hd{display:flex;align-items:center;gap:var(--sp-inline);padding:var(--sp-list) 0;border-bottom:var(--rule-w) solid var(--rule);}
.pb-cat-hd svg{width:var(--ic-lg);height:var(--ic-lg);color:var(--violet);flex:0 0 auto;}
.pb-cat-hd img{width:var(--ic-lg);height:var(--ic-lg);object-fit:contain;flex:0 0 auto;}
.pb-cat-t{flex:1;font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);}
.pb-art{padding:0 0 calc(var(--sp-stack) + 4px);} /* a touch more room since the divider between articles is gone */
.pb-art-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);}
.pb-art-s{font-family:var(--font-read);font-size:var(--fs-eyebrow);font-weight:400;color:var(--muted);line-height:1.5;margin-top:var(--sp-hairline);}
.pb-art-p{font-family:var(--font-read);font-size:var(--fs-eyebrow);font-weight:400;color:var(--ink);line-height:1.5;margin:var(--sp-inline) 0 0;}
.pb-note{font-family:var(--font-read);margin-top:var(--sp-inline);display:flex;align-items:flex-start;gap:var(--sp-list);padding:var(--sp-list) var(--sp-inline);border-radius:var(--r1);font-size:var(--fs-eyebrow);font-weight:400;line-height:1.5;}
.pb-note svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;margin-top:2px;}
.pb-note-ex{background:var(--green-bg);border:1px solid var(--green-border);color:var(--green-text);}
.pb-note-pit{background:var(--gray-bg);border:1px solid var(--gray-border);color:var(--gray-text);}
.pb-note-pit b{color:var(--gray-text);font-weight:var(--w-body);}
/* Glossary (ศัพท์ในเล่มนี้) — term/definition rows grouped by kind */
.gl-grp{margin-top:var(--sp-stack);}
.gl-gt{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);padding-bottom:var(--sp-list);}
.gl-row{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:var(--sp-inline);padding:var(--sp-list) 0;align-items:baseline;}
.gl-term{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);}
.gl-def{font-family:var(--font);font-size:var(--fs-bodysm);font-weight:var(--w-body);color:var(--muted);line-height:1.5;}
@page{size:A4;margin:0;}
@media print{
  html,body{background:#fff!important;display:block!important;min-height:0!important;height:auto!important;}
  .shell,#root{display:block!important;max-width:none!important;width:auto!important;height:auto!important;min-height:0!important;overflow:visible!important;background:#fff!important;}
  .reg-cta{display:none!important;}
  main.scroll{display:block!important;padding:0!important;max-width:none!important;width:auto!important;}
  .pb-doc{display:block!important;}
  .pb-fit{width:210mm!important;height:297mm!important;break-after:page;page-break-after:always;overflow:hidden;margin:0!important;}
  .pb-page{width:100%!important;height:100%!important;border:0!important;box-shadow:none!important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
.rk-lab{fill:var(--muted);}
.sides-hd{padding:var(--sp-block) var(--sp-card-pad) var(--sp-stack-tight);}
.side-item{border-top:1px solid var(--line-soft);}
/* align-items:flex-start (2026-08-29, per direction "status...และไอคอน ลูกศรขึ้น-ลง ให้ alignment
   top กับ text title") — same "row wraps to 2 lines, so .list-row's shared align-items:center was
   centering the trailing status chip/chevron against the WHOLE .side-cx block instead of just
   .side-t's own line" fix as .klib-row got in 2026-08-15; also top-aligns .side-num (the leading
   number/check circle) as a side effect, same as that klib-row precedent did for its own leading
   icon. */
.side-row{grid-template-columns:24px 1fr auto;padding:var(--sp-stack) 20px;user-select:none;align-items:flex-start;}
.side-num{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-meta);font-weight:var(--w-head);flex-shrink:0;font-family:var(--font);}
.side-num.done{background:var(--ink);color:var(--cloud);}
.side-num.act{border:2px solid transparent;background:linear-gradient(var(--white),var(--white)) padding-box,var(--spectrum) border-box;color:var(--ink);}
.side-num svg{width:var(--ic-sm);height:var(--ic-sm);}
/* เรื่องที่คุณเข้าใจแล้ว (learnedLedgerHTML): bare icon, no circle fill — matches เจาะรายสินทรัพย์'s own .dd-asset-hd icon language (per direction). */
.ledger-card .side-num.done{background:none;border-radius:0;}
.ledger-card .side-num.done svg{width:var(--ic-lg);height:var(--ic-lg);color:var(--violet);}
.side-cx{min-width:0;}
/* size/weight matched to .int-bar-l ("หุ้นไทย" etc., เรดาร์ความสนใจ section) — fs-sub/22px+w-head
   (500) -> fs-bodysm/18px+w-label (700) (2026-08-29, per direction). */
.side-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.5;}
.side-s{font-size:var(--fs-eyebrow);font-weight:var(--w-body);color:var(--muted);margin-top:2px;}
.side-r{display:flex;align-items:center;gap:var(--sp-inline);flex-shrink:0;}
/* Restyled into a colored pill badge (2026-08-29, per direction "status ให้เป็น badge dna
   ลักษณะเหมือนของหน้า เกมส์หลัก / status ต่างกัน สีต่างกัน") — same inline-flex+padding+rpill shape
   as Games' own .gr-played badge, one tint per state reusing tokens already established elsewhere
   in this file rather than inventing new colors: done=green (same recipe as .trait-chip.done — the
   "สีเขียว = เก็บแล้ว" convention the trait-note copy already teaches), act=amber
   (--amber-bg/border/text, same trio .str-box.wn uses for its own "attention" state), lck=the same
   muted/--accent gray .side-num.lck's own circle already uses. */
.sc{display:inline-flex;align-items:center;gap:4px;font-family:var(--font);font-size:var(--fs-label);font-weight:var(--w-head);white-space:nowrap;padding:4px var(--sp-inline);border-radius:var(--rpill);background:var(--accent);color:var(--muted);}
.sc.done{background:color-mix(in srgb,var(--green-text) 12%,var(--white));color:var(--green-text);}
.sc.act{background:var(--amber-bg);color:var(--amber-text);}
.s-cv{width:15px;height:15px;color:var(--muted);flex-shrink:0;}
.s-cv.open{transform:rotate(180deg);}
.side-body{max-height:0;overflow:hidden;}
.side-body.show{max-height:400px;}
.side-bi{padding:0 20px var(--sp-card-pad-sm) 56px;}
.side-dl{background:var(--spectrum-v) left/2px 100% no-repeat;padding-left:var(--sp-inline);}
