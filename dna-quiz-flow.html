/* ══ BOOTH / PASSPORT TAB ══ structure ported from Playbook Final's Passport screen (progress →
   grand-prize status → personalized hero route → per-zone booth check-in), re-skinned to our DNA. */
/* the decorative ✦ inside a bold heading (plain text, not an icon) was inheriting the heading's
   own 24px/700 — reading as its own oversized glyph instead of a quiet separator. .hd-star scales
   it down relative to whatever heading it sits in (em, not a fixed px) and mutes the color. */
.hd-star{font-size:0.6em;color:var(--muted);}
.booth-hd .booth-s{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.45;margin-top:var(--sp-stack-tight);}
/* margin-bottom added (2026-08-15, per direction "ตอนนี้ติดกันอยู่ ให้แยก spacing ตาม system dna") —
   this row and the draw-status callout right after it had no gap between them at all. --sp-list is
   the token for "next row in the same stack", the same relationship these two blocks have. */
.booth-prog{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-inline);margin-bottom:var(--sp-list);}
/* display:flex/column + .bp-bar's margin-top:auto (2026-08-19, per direction "อยากให้ตำแหน่งของ bar
   อยู่ใน alignment ที่เท่ากัน") — .bp-lbl can wrap to 2 lines ("กิจกรรมประจำบูธ" vs the shorter
   "เช็คอินบูธ"), which used to leave the bar sitting at a different height in each card even though
   the grid (`.booth-prog`) already stretches both cards to the same total height. Pinning the bar to
   the card's own bottom edge means it always lands on the same plane across both cards regardless of
   how many lines the label above it wraps to. */
.bp-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-card-pad-sm);display:flex;flex-direction:column;}
/* align-items:flex-start (2026-08-15, per direction "ตอนนี้ดู align กลาง card เป็นหลัก ต้อง align
   top") — .bp-lbl can wrap to 2 lines ("กิจกรรมประจำบูธ" at narrow widths), which was centering the
   icon and .bp-frac number against the full wrapped height instead of the label's first line. */
.bp-hd{display:flex;align-items:flex-start;gap:var(--sp-glue);margin-bottom:var(--sp-list);}
.bp-hd svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
.bp-lbl{flex:1;font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);}
.bp-frac{font-size:var(--fs-bodysm);font-weight:var(--w-label);white-space:nowrap;}
.bp-bar{margin-top:auto;height:6px;border-radius:var(--rpill);background:var(--accent);overflow:hidden;}
.bp-fill{height:100%;border-radius:var(--rpill);transition:width .25s var(--ease);}
/* .bp-hd wraps on mobile (2026-09-10, per direction "responsive audit") — .bp-frac's own "ครบแล้ว N
   บูธ" completed-state text (added after the wrap-tolerance comments above were written, back when
   this was a short "3/5" fraction) is long enough at real mobile width to squeeze .bp-lbl down past
   its own wrappable minimum, breaking "เช็คอินบูธ" mid-syllable across 3 lines instead of the clean
   2-line wrap those comments describe. Dropping .bp-frac onto its own line under the label sidesteps
   the squeeze entirely; tablet/pc keep the original single-line side-by-side layout (plenty of width
   there — this never actually breaks past mobile). */
:root[data-view="mobile"] .bp-hd{flex-wrap:wrap;}
:root[data-view="mobile"] .bp-frac{flex:1 0 100%;margin-top:2px;}
/* .bp-lbl reserves 2 lines' height on mobile (2026-09-10, bug fix — reported via screenshot: the two
   .bp-frac status lines landed at different heights across the pair, "เช็คอินบูธ" 's one-line label
   sitting shorter than "กิจกรรมประจำบูธ" 's wrapped two lines, so the cyan text below each started at
   different Y positions instead of lining up). Since .bp-frac now always follows directly after
   .bp-lbl in the wrapped flex flow (see the wrap rule above), the fix is reserving the SAME label
   height regardless of whether that card's own label happens to wrap to 1 or 2 lines — explicit
   line-height + min-height for exactly 2 lines of it, so .bp-frac always starts on the same line
   across both cards in the .booth-prog pair. */
:root[data-view="mobile"] .bp-lbl{line-height:1.3;min-height:calc(1.3em * 2);}
/* points total (Phase 4, 2026-09-09) — display-only stat, see boothPointsTotal()'s own comment.
   Reskinned onto .pe-report's own DNA (2026-09-10, per direction "section นี้ต้องการให้ใช้ dna เดียวกับ
   รายงานพัฒนาการหลังงาน (หน้าหลัก)") — was a one-off amber-bordered pill (bold inline number, its own
   color pair); markup now emits the shared .pe-report/.pe-report-t/.pe-report-s classes plus the "on"
   modifier (this row only ever renders once pts>0, i.e. always the "achieved" state), so it reads as
   the same icon+title/subtitle row on var(--done-wash) as the post-event report card. .bp-pts only
   owns the trailing margin the standalone .pe-report doesn't need here. */
.bp-pts{margin-bottom:var(--sp-stack);}
/* .bp-pts's point count was sized up off the shared .pe-report-t/.pe-report svg base then bumped
   again (2026-09-11, two direction rounds — the low-vision-accessibility pass, then exact target
   sizes for all 4 "+N แต้ม" spots), then dialed back down to 18px the same day (a follow-up
   direction) — that's exactly .pe-report-t's own default fs-bodysm/18px + w-label weight, so the
   size override is gone; only the icon (lc-sparkles->lc-gift, see this row's own markup) is still a
   deliberate change from where this row started. */
/* draw-status (เดินบูธ ✦ ลุ้นรางวัล's "ยังขาด"/"ครบเงื่อนไขแล้ว" card) reskinned onto the shared
   .next-step DNA (2026-08-26, per direction "อยากให้ทั้ง 2 กรณี ใช้ design dna เดียวกับ [เล่นเกมนี้
   ต่อ]...แต่ยังคงการใช้สีทั้ง 2 กรณีเหมือนเดิม") — same icon-badge + eyebrow/title/body + cta-slot
   layout, alignment, and icon/button position as Home's/Games' next-step cards (see .next-step/
   .ns-* below), just recolored per-state instead of .next-step's ink: green wash for .ds-ok (kept
   from the earlier "โทนเขียว" direction), amber wash for .ds-need (kept from the still-earlier
   "โทนเหลืองส้มๆ" direction). Superseded the old .draw-status/.ds-h/.ds-s-with-manual-indent
   layout, which put the icon inline with the title instead of as its own badge. */
.next-step.ds-ok,.next-step.ds-need{color:var(--ink);}
.next-step.ds-ok::after,.next-step.ds-need::after{background:none;}
.next-step.ds-ok{background:color-mix(in srgb,var(--green-text) 7%,var(--white));border:1px solid color-mix(in srgb,var(--green-text) 32%,transparent);}
.next-step.ds-need{background:var(--amber-bg);border:1px solid var(--amber-border);}
.next-step.ds-ok .ns-ic{background:color-mix(in srgb,var(--green-text) 14%,var(--white));border-color:color-mix(in srgb,var(--green-text) 32%,transparent);color:var(--green-text);}
.next-step.ds-need .ns-ic{background:var(--amber-bg);border-color:var(--amber-border);color:var(--amber-text);}
.next-step.ds-ok .ns-ey,.next-step.ds-need .ns-ey{color:var(--muted);}
.next-step.ds-ok .ns-t,.next-step.ds-need .ns-t{color:var(--ink);}
.next-step.ds-ok .ns-b,.next-step.ds-need .ns-b{color:var(--muted);}
/* .ds-dl/.ds-chips live inside .ns-body alongside .ns-b, all sharing that one grid cell (see
   .next-step's grid-template-areas above) — no manual indent needed, .ns-body is already
   positioned to align under the title, not the icon. */
.ns-body .ds-dl{font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--ink);margin-top:var(--sp-glue);}
.ns-body .ds-chips{display:flex;flex-wrap:wrap;gap:var(--sp-glue);margin-top:var(--sp-glue);}
.ds-chip{display:inline-block;background:var(--active-fill);color:var(--violet);font-weight:var(--w-head);font-size:var(--fs-eyebrow);padding:4px var(--sp-inline);border-radius:var(--rpill);white-space:nowrap;}
.next-step.ds-need .ds-chip{background:var(--white);color:var(--amber-text);border:1px solid var(--amber-border);}
.ds-joined{grid-area:cta;justify-self:end;display:flex;align-items:center;gap:var(--sp-glue);position:relative;z-index:1;color:var(--green-text);font-weight:var(--w-label);font-size:var(--fs-bodysm);}
.ds-joined svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
.ds-chip{display:inline-block;background:var(--active-fill);color:var(--violet);font-weight:var(--w-head);font-size:var(--fs-eyebrow);padding:4px var(--sp-inline);border-radius:var(--rpill);white-space:nowrap;}
.draw-status.need .ds-chip{background:var(--amber-bg);color:var(--amber-text);border:1px solid var(--amber-border);}
/* hero route */
.route-badge{font-size:var(--fs-label);font-weight:var(--w-head);color:var(--ink);background:var(--accent);padding:4px var(--sp-inline);border-radius:var(--rpill);white-space:nowrap;}
/* aspect-ratio matches Floorplan BTT (1).png's real 3657×2772 (2026-08-26, per direction — swapped
   in for the old square Map.png mockup) — was 1/1, which forced object-fit:cover to crop the sides
   off this wider top-down floor plan. */
.map-ph{position:relative;border:1px solid var(--line-soft);border-radius:var(--r1);overflow:hidden;background:linear-gradient(135deg,var(--paper),var(--cloud));aspect-ratio:3657/2772;display:flex;align-items:center;justify-content:center;margin-bottom:var(--sp-stack);}
.map-ph .mp-in{display:flex;flex-direction:column;align-items:center;gap:var(--sp-glue);color:var(--muted);}
.map-ph .mp-in svg{width:var(--ic-lg);height:var(--ic-lg);}
.map-ph .mp-img{width:100%;height:100%;object-fit:cover;display:block;}
.map-ph .mp-cap{position:absolute;left:10px;bottom:9px;font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--cloud);background:var(--ink);padding:var(--sp-stack-tight) var(--sp-list);border-radius:var(--r0);}
/* min-height:44px added (2026-09-17, responsive audit — touch target below the 44x44 minimum). */
.map-ph .mp-zoom{position:absolute;right:10px;top:9px;display:flex;align-items:center;gap:var(--sp-stack-tight);background:var(--white);color:var(--ink);border:1px solid var(--line-soft);padding:6px var(--sp-inline);min-height:44px;border-radius:var(--rpill);font-size:var(--fs-eyebrow);font-weight:var(--w-head);box-shadow:0 2px 6px rgba(17,19,24,.1);cursor:pointer;transition:transform .15s var(--ease),background .15s var(--ease);}
.map-ph .mp-zoom svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}
/* "เพิ่ม interaction" (2026-08-28, per direction) — was a static pill with no press/hover feedback
   at all; same :active press-scale idiom .btn/.demo-fab/.go-top already use, plus a hover tint
   under the same @media(hover:hover) desktop-only gate the row-hover system above uses. */
.map-ph .mp-zoom:active{transform:scale(.96);}
@media(hover:hover) and (pointer:fine){.map-ph .mp-zoom:hover{background:var(--cloud);}}
/* map-lightbox — fixed so it clears the app's own scroll container; the real target is a phone
   viewport (.shell fills the screen edge-to-edge there per the ≥480px media query), so fixed
   positioning covers exactly the app, not just this card's scroll area. */
.map-lightbox{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:22px;}
.map-lightbox.show{display:flex;}
.map-lightbox .ml-scrim{position:absolute;inset:0;background:rgba(17,19,24,.6);}
.map-lightbox .ml-card{position:relative;width:100%;max-width:720px;background:var(--white);border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow-lg);}
.map-lightbox .ml-body{max-height:74vh;overflow:auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--paper),var(--cloud));}
.map-lightbox .ml-body .ml-img{width:100%;height:auto;display:block;}
.map-lightbox .ml-body .mp-in{display:flex;flex-direction:column;align-items:center;gap:var(--sp-list);color:var(--muted);}
/* 44px — same "hero-tier" spirit as .reveal-icon/.q-icon-bare (one dominant icon in this
   composition, picked per-context rather than forced onto the sm/md/lg UI scale). */
.map-lightbox .ml-body .mp-in svg{width:44px;height:44px;}
.map-lightbox .ml-cap{padding:var(--sp-inline) var(--sp-stack);font-size:var(--fs-bodysm);font-weight:var(--w-head);color:var(--ink);}
.map-lightbox .ml-close{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(17,19,24,.55);color:var(--white);border:none;cursor:pointer;}
.map-lightbox .ml-close svg{width:var(--ic-md);height:var(--ic-md);}
/* 44×44 invisible hit-area (2026-08-30, responsive audit fix) — same technique as .tb-ic::before:
   the visible 32px chip stays the same size/position, a ::before extends the real clickable region
   by 6px on every side (32+6+6=44) so a close tap over a full-screen map lightbox is easier to land. */
.map-lightbox .ml-close::before{content:'';position:absolute;inset:-6px;}
/* ══ QR SCAN MODAL ══ mocked scan flow (analyzed from the demo export — its own version is fully
   mocked too, no real camera API anywhere in that source; ends in one "simulate successful scan"
   button). Lives on <body> like .demo-panel does, so one instance overlays any screen. */
.scan-modal{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;padding:22px;}
.scan-modal.show{display:flex;}
.scan-scrim{position:absolute;inset:0;background:rgba(17,19,24,.6);}
.scan-card{position:relative;width:100%;max-width:340px;background:var(--white);border-radius:var(--r2);padding:var(--sp-card-pad-sm);box-shadow:var(--shadow-lg);}
.scan-x{position:absolute;right:12px;top:12px;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--ink);border:none;cursor:pointer;}
.scan-x svg{width:var(--ic-md);height:var(--ic-md);}
.scan-hd{padding-right:30px;margin-bottom:var(--sp-stack);}
.scan-t{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);line-height:1.3;}
.scan-s{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:2px;}
/* Scan-mode switcher is .bt-tabs.bt-tabs--primary (swapped per direction, the same tab component
   used everywhere else) — was its own bespoke .scan-tab pill-in-a-track, now one component
   system-wide. */
#scanTabs{margin-bottom:var(--sp-stack);}
.scan-cam{position:relative;border-radius:var(--r2);overflow:hidden;background:#111b25;height:168px;display:flex;align-items:center;justify-content:center;margin-bottom:var(--sp-inline);}
/* border-radius promoted 14px->var(--r2) (2026-08-31, per corner-radius audit) — see .cr2's comment;
   same repeated "media frame" magic number, folded onto the same token. */
.scan-cam-frame{position:absolute;inset:14%;border-radius:var(--r2);border:2px solid rgba(255,255,255,.28);}
.scan-cam-laser{position:absolute;left:14%;right:14%;top:14%;height:2px;background:#94d227;box-shadow:0 0 14px #94d227;animation:scanLaser 2.1s ease-in-out infinite;}
@keyframes scanLaser{0%{transform:translateY(0);}50%{transform:translateY(300%);}100%{transform:translateY(0);}}
.scan-cam-ic{width:38px;height:38px;color:rgba(255,255,255,.22);}
.scan-cam-cap{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:var(--fs-label);color:rgba(255,255,255,.75);}
/* Same height + margin as .scan-cam (168px/12px) — the two tabs' content used to be sized off
   their own content (the camera box vs. this QR+caption block), so switching tabs resized the
   whole modal and visibly shifted the title bar/confirm button. Fixed height + flex-centered
   content keeps every OTHER part of the modal in the same position regardless of which tab is on. */
/* Reverted --r1 -> --r2 (2026-08-15, per Design DNA review "scan-mine ทางเลือก B") — kept as a
   deliberate exception this time around: the "my QR" placeholder can read as more prominent than
   the app's other dashed panels on purpose. */
.scan-mine{box-sizing:border-box;height:168px;border-radius:var(--r2);border:1px dashed var(--line-strong);background:var(--paper);padding:var(--sp-stack);text-align:center;margin-bottom:var(--sp-inline);display:flex;flex-direction:column;align-items:center;justify-content:center;}
/* 12px (2026-08-31, per corner-radius audit) — was 10px, a lone off-token value; unified with
   .scan-note/.ns-ic/the demo panel's .demo-sel, the audit's other small-radius outliers, onto one
   shared 12px instead of each drifting to its own number. */
.scan-mine-qr{width:96px;height:96px;margin:0 auto;border-radius:var(--r2);background:var(--white);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;color:var(--ink);}
/* 64px — a large placeholder icon (no real QR to show yet), one-off, no repeated value elsewhere
   to consolidate into a token. */
.scan-mine-qr svg{width:64px;height:64px;}
.scan-mine-cap{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;margin-top:var(--sp-inline);}
/* 12px (2026-08-31, per corner-radius audit) — was 11px, its own arbitrary value even though this
   is the 3rd inline-note component in the file (.hero-note uses --r1/8px, .redeem-note uses
   --r2/16px); rather than force it onto one of those two, unified onto the same 12px the audit
   picked for .scan-mine-qr/.ns-ic/.demo-sel — the other small-radius outliers on this same screen. */
.scan-note{display:flex;gap:var(--sp-list);align-items:flex-start;padding:var(--sp-list) var(--sp-inline);border-radius:var(--r2);background:color-mix(in srgb,var(--cyan) 8%,transparent);border:1px solid color-mix(in srgb,var(--cyan) 25%,transparent);margin-bottom:var(--sp-stack);}
.scan-note svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--ink);flex:0 0 auto;margin-top:1px;}
.scan-note span{font-size:var(--fs-label);color:var(--ink);line-height:1.5;}
.scan-confirm{width:100%;}
.scan-demo-note{font-size:var(--fs-label);color:var(--muted);text-align:center;margin-top:var(--sp-list);}
/* ══ MINI-GAME PLAY MODAL ══ (2026-09-09) real question-and-answer flow for the 6 main games
   (เกมหลัก, Games tab) + 10 asset-booth games (เดินบูธ tab) — replaces the old instant-toggle mock.
   Same overlay family as .scan-modal/.howto-modal (scrim + centered card + inset close X), just
   taller/scrollable since a multi-question flow needs more room than a QR frame. Reuses .q-opts/
   .q-opt/.opt-key/.opt-text verbatim from the DNA quiz's own question screen (renderQuiz) so the
   choice-button look is identical everywhere in the app. See MINIGAME_Q/BOOTH_Q (data) + openPlay/
   renderPlayBody (logic), added right after renderGames() below. */
/* (.play-modal/.play-scrim/.play-card/.play-x — the old floating-modal chrome — removed 2026-09-10:
   mini-games are a real full page now, same .topbar/.q-scroll/.q-nav shell renderQuiz() uses; see
   renderPlay()/renderPlayBrief()/renderPlayBody()/renderPlaySummary() below the share-modal block.) */
/* Now holds only the timer/points badge row (no label text — that moved into the page's own
   .topbar .tb-sub — and no close-X to clear space for, so centered instead of space-between). */
.play-eyebrow{display:flex;align-items:center;justify-content:center;gap:var(--sp-inline);margin-bottom:var(--sp-stack);}
.play-timer{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-label);font-weight:var(--w-head);color:var(--white);background:var(--pink);padding:2px var(--sp-list);border-radius:var(--rpill);flex:0 0 auto;}
.play-timer svg{width:13px;height:13px;}
/* Booth points badge (2026-09-10, per direction "badge แต้มค้างอยู่ระหว่างตอบคำถาม") — sits in the
   same right-hand eyebrow slot .play-timer uses; mutually exclusive with it in practice (only M3's
   game-side ฉาก 1 has a timer, only booth questions have points), so sharing the slot never collides.
   Sized up (2026-09-11, per direction "dna ของการแสดงข้อมูลนี้...ใหญ่...เด่นกว่านี้ — คนแก่มองไม่ค่อย
   เห็น") from fs-label/13px-icon to fs-sub/20px-icon + thicker pill + bolder border, matching the
   same low-vision-accessibility pass applied to .bp-pts/.rc-title-pts/.play-sum-pts below — this was
   the smallest of the app's 4 "+N แต้ม" call sites, so gets the biggest jump. Bumped again to
   fs-h2/24px + 22px icon (2026-09-11, follow-up direction with exact target sizes for all 4 spots). */
.play-pts-badge{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--amber-text);background:var(--amber-bg);border:2px solid var(--amber-border);padding:6px 14px;border-radius:var(--rpill);flex:0 0 auto;}
.play-pts-badge svg{width:22px;height:22px;}
/* (.play-dots/.play-dot — the per-question step-dot row under the eyebrow — removed 2026-09-10 per
   direction; the "ข้อ N/M" text in .play-eyebrow already carries that progress info on its own.)
   (.play-intro — the old per-question q1 intro banner — removed 2026-09-10 along with its markup;
   the pre-game briefing screen (.play-brief, below the share-modal block) replaced it.) */
/* Question text (2026-09-10, per direction) — went --fs-sub/22px → --fs-h2/24px → a dedicated 32px
   (this latest bump, same hardcoded-pixel treatment `.play-brief-h` already uses to override
   .consent-h's 64px for this same modal — no existing token sits at 32px, so this is a deliberate
   one-off size for the modal's own question text, not a repurposed --fs-* token). Still short of the
   DNA quiz's own --fs-title/36px .q-title, staying a notch smaller since this lives in a modal, not
   a full screen. `b` matches .q-title b's own bold-tail treatment (emphasizeQ() wraps the trailing
   clause in <b> — see renderPlayBody). */
.play-q{font-size:32px;font-weight:var(--w-body);color:var(--ink);line-height:1.3;margin-bottom:2px;}
.play-q b{font-weight:var(--w-label);}
.play-sub{font-size:var(--fs-label);color:var(--muted);line-height:1.5;margin-bottom:var(--sp-stack);}
.play-opts .q-opts{margin-bottom:var(--sp-stack);}
/* .play-skip — SUPERSEDED 2026-09-10, per direction "(ภาพที่ 2) button dna ใช้แบบเดียวกับ ปุ่ม
   ดูกำหนดการทั้งวัน 11 รายการ (หน้าหลัก)" — the skip button (multi-select questions' "ยังไม่พร้อมเลือก
   ข้ามก่อน") now renders with the .ag-more class directly (see renderPlayBody's skipHTML) instead of
   this plain underlined-text-link look. Rule kept for history only, nothing renders it anymore. */
.play-skip{display:block;width:100%;text-align:center;background:none;border:none;font-family:var(--font);font-size:var(--fs-label);color:var(--muted);text-decoration:underline;cursor:pointer;padding:0 0 var(--sp-stack);}
/* Insight box (2026-09-10, per direction) — moved cyan→violet: per DESIGN-DNA.md §2.2's status-tone
   ladder, cyan means "done/unlocked" (already the meaning of this SAME screen's "เล่นแล้ว" badge
   elsewhere), while violet means "neutral info" — the correct semantic for a knowledge callout, and
   it stops competing with cyan's one real job. Starts hidden + delayed fade/slide-in (`.show` added
   via rAF in selectPlayAnswer/renderPlayBody), echoing `.radar-insight`'s own "insight worth a
   beat" reveal timing (transition-delay baked into the .show rule, not a JS setTimeout, so it stays
   declarative like the rest of this motion system) — makes the insight feel like a payoff for
   answering, not a UI element that was just always there. */
.play-insight{display:flex;gap:var(--sp-list);align-items:flex-start;padding:var(--sp-list) var(--sp-inline);border-radius:var(--r2);background:color-mix(in srgb,var(--violet) 8%,transparent);border:1px solid color-mix(in srgb,var(--violet) 25%,transparent);margin-bottom:var(--sp-stack);opacity:0;transform:translateY(4px);}
.play-insight.show{opacity:1;transform:none;transition:opacity .4s var(--ease) .15s,transform .4s var(--ease) .15s;}
/* margin-top 1px->4px (2026-09-10, per direction "ข้อมูลลักษณะนี้ทั้งหมด ในทุกคำถาม ให้ Alignment
   center กับบรรทัดแรก") — align-items:flex-start on the parent top-aligns the icon against the WHOLE
   (possibly 2-line) text block, which for this box's own 24px first-line height (fs-label/16px ×
   line-height 1.5) left the 16px icon sitting near the top of that line, not centered in it. Exact
   center math: (24px line - 16px icon) / 2 = 4px. */
.play-insight svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--ink);flex:0 0 auto;margin-top:4px;}
.play-insight span{font-size:var(--fs-label);color:var(--ink);line-height:1.5;}
@media(prefers-reduced-motion:reduce){.play-insight{opacity:1;transform:none;}.play-insight.show{transition:none;}}
.play-nav{display:flex;gap:var(--sp-inline);align-items:center;justify-content:space-between;}
/* Result card (2026-09-10, per direction) — the "สรุปว่าผู้เล่นเป็นคนประเภทไหน" payoff, split OUT of
   the plain insight list (.play-sum-list below) into its own higher-hierarchy card, since it's the
   whole game's conclusion, not one more bullet among the per-question insights. Spectrum border =
   the SAME "this is special" language `.q-opt.sel` already uses for a chosen answer — reused here
   to mark "this is YOUR result", not a new visual vocabulary. `.notype` (M5 only, MINIGAME_Q[4]
   .noType — the one game that explicitly never classifies the player) swaps to a dashed/muted
   treatment instead, borrowing `.pe-locked`'s "informational, not a verdict" dashed-border language
   so the ABSENCE of a type reads as a deliberate design choice, not a missing feature. */
.play-result-card{display:flex;gap:var(--sp-stack);align-items:flex-start;padding:var(--sp-stack);border-radius:var(--r2);margin-bottom:var(--sp-stack);border:2px solid transparent;background:linear-gradient(var(--white),var(--white)) padding-box,var(--spectrum) border-box;}
.play-result-card.notype{border:1px dashed var(--line-strong);background:var(--paper);}
.play-result-card .pr-ic{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent);color:var(--ink);}
.play-result-card .pr-ic svg{width:var(--ic-md);height:var(--ic-md);}
.play-result-card .pr-tx{min-width:0;}
.play-result-ey{font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);text-transform:uppercase;letter-spacing:0.04em;margin-bottom:2px;}
.play-result-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.5;}
.play-sum-list{display:flex;flex-direction:column;gap:var(--sp-list);margin-bottom:var(--sp-stack);}
.play-sum-item{display:flex;gap:var(--sp-list);align-items:flex-start;padding:var(--sp-list) var(--sp-inline);border-radius:var(--r1);background:var(--paper);}
.play-sum-item svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--cyan);flex:0 0 auto;margin-top:1px;}
.play-sum-item span{font-size:var(--fs-label);color:var(--ink);line-height:1.5;}
/* Points pop (2026-09-10, per direction "pulse animation ตอนตอบจบ") — a one-shot scale+ring-flash
   that autoplays the instant this card mounts on the summary screen (no JS trigger needed — CSS
   animations run on insertion), same expanding-ring technique as the booth map's own `bmkFlash`
   marker-tap acknowledgment, retimed/retoned here for a "you just earned this" reward beat. */
/* Bumped from --fs-sub/22px + --ink to --fs-heading/28px + --amber-text (2026-09-10, per direction
   "อยากให้เด่น หรือ bold มันขึ้นกว่านี้") — font-weight was already --w-label/700, the heaviest weight
   this type scale has, so "bolder" had nowhere left to go on that axis; size + the reward card's own
   amber tint (previously only on the background/border wash, not the payoff number itself) are what
   actually make it read as a bigger moment now. margin-top:var(--sp-block) added the same pass (was
   0 — .str-box carries no margin of its own, so this card used to sit flush against "สิ่งที่ได้เรียนรู้
   จากเกมนี้" above it with no breathing room at all); --sp-block is this file's own "one labeled
   sub-section to the next INSIDE the same card" token (see its :root definition near the top), which
   is exactly the relationship these two boxes have — both live inside the same .hero-in frame. */
/* .play-sum-pts/@keyframes ptsPop — the "เล่นจบแล้ว" screen's own "+N แต้ม" reward card — REMOVED
   (2026-09-11, per direction "เล่นจบแล้ว (ทุกเกมส์ ทุกด้าน ทุกบูธ)...กรณีมี — ให้เอาออกทั้งหมด") from
   renderPlaySummary's markup (see ptsHTML's own removal note there); this CSS is unused now, kept
   only for history same as .play-brief/etc. elsewhere in this file — nothing renders .play-sum-pts
   any more. (ptsCountUp() itself, added the same day this card got its number-counting motion, is
   NOT dead — .play-pts-badge during play still uses it.) */
.play-sum-pts{display:flex;align-items:center;gap:var(--sp-list);justify-content:center;font-size:var(--fs-title);font-weight:var(--w-label);color:var(--amber-text);background:color-mix(in srgb,var(--amber-text) 10%,transparent);border:2px solid color-mix(in srgb,var(--amber-text) 28%,transparent);border-radius:var(--r2);padding:var(--sp-stack);margin-top:var(--sp-block);margin-bottom:var(--sp-stack);animation:ptsPop .6s var(--ease) 1;}
.play-sum-pts svg{width:36px;height:36px;color:var(--amber-text);flex:0 0 auto;}
@keyframes ptsPop{0%{transform:scale(.92);box-shadow:0 0 0 2px color-mix(in srgb,var(--amber-text) 45%,transparent);}60%{transform:scale(1.04);}100%{transform:scale(1);box-shadow:0 0 0 14px color-mix(in srgb,var(--amber-text) 0%,transparent);}}
@media(prefers-reduced-motion:reduce){.play-sum-pts{animation:none;}}
/* Mini-game briefing / intro screen (2026-09-10, per direction) — a "here's the game + how to play"
   opener shown before a game's first question, for BOTH the 6 main games and the 10 booth games.
   Echoes the consent screen's (หน้าที่ 2) DNA: the two-tone .consent-h heading (REUSED verbatim via
   the .consent-h class, just re-sized for the modal), a muted lead paragraph, .round-cards, and a
   primary CTA. See renderPlayBrief(). */
.play-brief{text-align:center;padding-top:2px;}
.play-brief-badge{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-label);font-weight:var(--w-head);color:var(--ink);background:var(--accent);border-radius:var(--rpill);padding:5px var(--sp-list);margin-bottom:var(--sp-stack);line-height:1.3;}
.play-brief-badge .pb-emoji{font-size:16px;line-height:1;}
/* Back in use (2026-09-10, per direction "หน้าคั่น...text title size เล็กลงกว่านี้อีกหน่อย (ใช้ตามที่
   .md มี)") — overrides .consent-h's own hero-specific 64px (a size bumped up 2026-08-19 purely for
   the real consent screen's own spacious layout). First tried var(--fs-title)/36px (TYPOGRAPHY-DNA.md's
   documented base for both .consent-h and .q-title), then corrected same-day to a dedicated 48px per
   explicit follow-up direction ("var(--fs-title) 48px") — a deliberate one-off value for this cramped-
   page heading specifically, not a change to the shared --fs-title token itself (still 36px everywhere
   else — the real consent screen's own .q-title/.consent-h are untouched). The .consent-h .ch-1/.ch-2
   two-tone (muted+ink) still applies unchanged since the element keeps the .consent-h class (and no
   .reveal-h, so the shimmer sweep stays off, same as the real consent screen). */
.play-brief-h{font-size:48px;margin-bottom:var(--sp-stack);}
/* .play-brief-art — test wiring only, see renderPlayBrief's own comment + BOOTH_ART_PNG
   (2026-09-11). Illustration sits above .play-brief-h; drop-shadow matches the splash scatter art's
   own grounding shadow (.sp-el) rather than inventing a new elevation recipe. .consent-body already
   stretches + self-centers its children in the space above the sticky-pinned CTA (:root
   [data-view="mobile"] .consent-body{flex:1;justify-content:center}), so the extra art block re-
   centers the whole group — but that self-centering assumes the group's natural height fits the
   available space; it does not shrink content that doesn't. Two follow-up fixes (2026-09-11, per
   direction "เหลือที่ห่างกันเยอะ" on a big-screen phone + a report of the CTA overlapping the cards
   on a short/wide viewport):
   1) margin-bottom pulled from --sp-block(22px) to --sp-stack(16px), and the cap shrunk 200→156px→
      172px (2026-09-11, per direction; the 152→156px step was an earlier same-day tweak), so the
      title/cards sit closer under the art and the group is shorter overall.
   2) a max-height:24vh safety cap on the img was tried for short/landscape-ish viewports, then
      REMOVED the same day once .overflow-fix (see .consent.pb-consent below) proved it reliably
      catches genuine overflow on its own — a fixed max-width is simpler and the art no longer needs
      to defend against short screens itself.
   See .consent.pb-consent{overflow-y:auto} + .overflow-fix below for the short-viewport case this
   doesn't shrink its way out of. */
.play-brief-art{width:100%;text-align:center;margin:0 auto var(--sp-stack);}
.play-brief-art img{display:inline-block;width:auto;height:auto;max-width:172px;filter:drop-shadow(0 10px 22px rgba(17,19,24,.16));}
/* .play-result-art (2026-09-14) — same art, same treatment, on renderPlaySummary's "เล่นจบแล้ว"
   screen instead: positioned as .hero-in's first child, the same slot the Playbook identity tab's
   character card (compareBlock) occupies before its own detail content — see renderPlaySummary's
   own comment for why this is a second, deliberate placement rather than a duplicate of the brief. */
.play-result-art{width:100%;text-align:center;margin:0 auto var(--sp-stack);}
.play-result-art img{display:inline-block;width:auto;height:auto;max-width:172px;filter:drop-shadow(0 10px 22px rgba(17,19,24,.16));}
/* .bg-room2 — NO LONGER APPLIED (2026-09-14, per direction "หน้าคั่น ใช้ภาพพื้นหลังเดียวกับ ของหน้าคั่น
   เกมส์หลัก"): the booth briefs dropped their own room2-1.png backdrop and now share room1 with the
   main-game briefs, so nothing adds this class anymore (BG_IMG.room2 is likewise unread now). Kept for
   history — same precedent as the other retired brief CSS above. Original rationale below:
   .bg-room2 — room2-1.png (the booth-brief backdrop, see renderPlayBrief's bgImg comment) is a wide
   interior photo with a horizontal wall-molding line sitting ~35% down its OWN height. On a portrait
   screen the base .consent{background-size:cover} rule has to scale the photo up until its height
   exactly fills the viewport (a portrait box is far taller-relative-to-width than this photo), which
   leaves zero vertical slack — so that molding line always lands ~35% down THIS screen too, right
   behind the art image, reading as a stray cut/seam line under it (reported 2026-09-11, screenshots
   showing it under 5 different booths' art — same line, same relative position, every time, which is
   what gave away that it's the backdrop photo and not the art crops themselves).
   Fix: zoom in past plain cover far enough that only the band ABOVE the molding is ever visible, on
   any viewport. background-size's height percentage is the fraction of the CONTAINER the photo's own
   height is stretched to — the fraction of the PHOTO actually visible in one screen is the inverse
   (100/percentage), independent of the viewport's actual pixel size. 320% → 100/320≈31% of the
   photo's height visible, safely inside the ~35% ceiling/light-rays band above the molding, on every
   screen (width coverage is never in danger: even a 320%-tall zoom's auto-computed width covers any
   realistic viewport aspect ratio many times over). Longhand background-position-y (not the
   background-position shorthand) so the existing per-data-view X position two rules up
   (:root[data-view="tablet"/"pc"] .consent{background-position:...}) is left alone — only Y changes,
   and only for room2. */
.consent.bg-room2{background-size:auto 320%;background-position-y:top;}
/* room2's X position, per data-view — needed because the 320% zoom above changes what a given
   background-position-x percentage actually shows far more than it would at plain cover (a much
   narrower slice of the photo's width is visible now, so the same 48/30/16% used elsewhere reveal
   very different amounts of the left wall panel). Went through a few rounds 2026-09-11 (pc 16→34→32;
   tablet 30→12→64→48) before landing on the actual ask — pc and tablet showing the SAME PROPORTION
   of the left wall, not just "some". pc and tablet crop very different fractions of the photo's own
   width at this zoom (~30% of it on pc's wider/shorter box vs ~14% on tablet's narrower/taller one —
   fraction ∝ (container width/height), independent of the container's actual pixel size), so equal
   percentages never show equal amounts of wall — matching the PROPORTION means matching where the
   visible window's LEFT EDGE falls in the photo's own pixels, not the position-x number itself: pc's
   32% starts its window ~460px into the 2048px-wide photo (just past the wall panels, a thin sliver
   showing); solving the same "window starts ~460px in" for tablet's narrower window gave 26% (not
   48, which sat well past the wall entirely — none showing, which is what prompted this recheck — or
   64, further still) — then nudged to 30 same day ("เห็นกำแพงฝั่งซ้ายออกไปอีกหน่อย ตอนนี้เข้ามาเยอะไป
   นิด"): the math target a hair too generous next to pc's own sliver, not a re-derivation. Mobile
   keeps the base rule's 48% untouched — not part of this direction. Higher
   specificity than the shared :root[data-view="tablet"/"pc"] .consent{background-position:...}
   rules (one extra class), so these longhand X-only overrides win without touching those rules' Y or
   other screens' X. */
:root[data-view="tablet"] .consent.bg-room2{background-position-x:30%;}
:root[data-view="pc"] .consent.bg-room2{background-position-x:32%;}
/* .bg-boothart (2026-09-14, per direction "ต้องการใช้รูปเหล่านี้...เป็นภาพพื้นหลังของหน้าคั่น...
   คำนึงถึงการ responsive ด้วย") — the 10 booth-brief backdrops (BOOTH_BG_IMG). Unlike room1's ONE
   fixed photo (needing a hand-tuned per-device X position above because its door sits well off-
   center) or room2's zoom hack (fixing a specific seam line), all 10 of THESE images have their
   subject already roughly centered on both axes — measured per-panel while cropping (see
   BOOTH_BG_IMG's own comment) — so one shared position covers every device without a per-image or
   per-view split. 42% (not 50%) on the Y axis: most subjects' visual "center of interest" (a face,
   the handshake, a building's upper third, the road's vanishing point) sits slightly ABOVE true
   center in a 307:512 portrait crop, so pinning slightly high keeps that region on-screen even under
   pc's aggressive cover-crop (a 900px-wide image covering a ~1440×900 box only shows roughly the
   middle 37% of the image's height — see BOOTH_BG_IMG's comment for the math). Same specificity (2
   classes) as the tablet/pc rules above + later in source order, so this cleanly overrides their
   room1-tuned X position rather than needing `!important`. Verified live across mobile/tablet/pc for
   the most vertically-extended compositions (skyscraper/stairs/road) — subject stays in frame at all
   3 widths. */
.consent.bg-boothart{background-position:50% 42%;}
:root[data-view="tablet"] .consent.bg-boothart{background-position:50% 42%;}
:root[data-view="pc"] .consent.bg-boothart{background-position:50% 42%;}
/* Stronger white-wash for booth-art backdrops specifically (2026-09-14, per direction "ต้องการให้ภาพ
   พื้นหลังดูสว่าง หรือกลมกลืนกับสีภาพพื้นหลังกว่านี้...ภาพสีเข้ม ชัด ทำให้เนื้อหาที่วางทับอยู่ มองไม่
   เห็น") — the base `.consent::before` wash (64% white, tuned for room1's real PHOTO backdrop) reads
   too weak on these monochrome ILLUSTRATIONS, which carry much deeper true-black regions (a suit
   sleeve, a building's shadow side) than a lit photograph ever does, so the overlaid title/lead/cards
   stayed low-contrast against them. Bumped to 80% specifically for `.bg-boothart` (extra class over
   the base rule = higher specificity, wins outright, no source-order dependency needed), then to 87%
   same day (2nd follow-up, per direction "เพิ่มความสว่าง white-wash ขึ้นอีกหน่อย") — verified live both
   times against the two darkest compositions (booth 7 ประกัน's handshake sleeves, near-black) and the
   lightest (booth 2's door/sky) side by side: at 87% the art still reads as a soft pale-gray texture
   with title/cards clearly legible, and the already-light door art still doesn't wash out to invisible. */
.consent.bg-boothart::before{background:rgba(255,255,255,.87);}
/* mobile-only per-booth size/position overrides (2026-09-15; revised same day after a real-device
   follow-up round — the first pass below sized every booth off a shared `auto 65%` HEIGHT, which
   under-filled the box for the 7 images whose own alpha-trimmed crop sits at the narrower ~0.6
   width:height ratio (personcap/doorlight/womanprofile/roadhorizon/skyscraper/stairsclimb/womantablet
   only reached ~79% of the box's own width at that height, reading as small/washed-out floating in a
   sea of white-wash — "ต้องการให้มองโดยรวมแล้ว balance กว่านี้"), while the 3 wider-ratio images
   (globenetwork .74/handshake .762/plantsprout .785) landed at 97-103% width at that SAME height —
   plantsprout was actually cropped left/right and handshake sat right at the edge, its own already-
   edge-touching sleeve triangles (see BOOTH_BG_IMG's own bleed-detection comment) now reading as if
   torn off / bleeding from an adjacent panel ("ไม่ให้มีติดขอบหรือเกินไปเห็นส่วนของภาพอื่นติดมา").
   Switched the axis: every rule now sizes off WIDTH instead of height (`90% auto`), which — since the
   mobile `.consent` box (375×758, ratio ~0.494) is narrower than EVERY one of these 10 crops (0.6-0.785)
   — guarantees the same ~5% breathing margin on both left/right edges for all 10 alike (no per-image
   variance, actual "balance") while the auto height (562-563px for the .6-ratio images, up to 430px for
   plantsprout's .785) always clears the 758px box with real vertical slack to spare — verified against
   each image's own real aspect ratio (see the dimension table in BOOTH_BG_POS_CLS's own comment) that
   NONE crop at 90% width, unlike the old height-based scheme. This is also close to the mathematical
   ceiling for a fully uncropped image here (pure `contain` in this narrower-than-image box is exactly
   100% width — i.e. touching both edges — so 90% is "as large as possible while still visibly inset",
   not an arbitrary shrink). Position then only needed the Y adjusted for each image's own NEW vertical
   slack at this size (X unchanged at 50%, all 10 already centered per BOOTH_BG_IMG's own comment): 30%
   for the 4 "สูงขึ้น" reports (all .6-ratio, so identical slack → identical Y works), 65% for ดวลกองทุน's
   "ต่ำลง" (bumped further than the first pass's 55% now that its own slack at this size is larger, for a
   more clearly visible shift), and the base 42% (no position change, matching `.bg-boothart` itself) for
   the 5 that only asked for smaller/no-crop, not repositioned. Same 2-class-specificity mobile-only +
   explicit tablet/pc cover/42% reset pattern as before — the shared `.bg-boothart` rule never sets
   background-size, so a mobile-only size override needs its own tablet/pc reset or it would leak
   through at those widths too. */
.consent.bg-boothart-personcap{background-size:90% auto;background-position:50% 30%;}
:root[data-view="tablet"] .consent.bg-boothart-personcap{background-size:cover;background-position:50% 42%;}
:root[data-view="pc"] .consent.bg-boothart-personcap{background-size:cover;background-position:50% 42%;}
.consent.bg-boothart-doorlight{background-size:90% auto;background-position:50% 30%;}
:root[data-view="tablet"] .consent.bg-boothart-doorlight{background-size:cover;background-position:50% 42%;}
:root[data-view="pc"] .consent.bg-boothart-doorlight{background-size:cover;background-position:50% 42%;}
.consent.bg-boothart-globenetwork{background-size:90% auto;background-position:50% 65%;}
:root[data-view="tablet"] .consent.bg-boothart-globenetwork{background-size:cover;background-position:50% 42%;}
:root[data-view="pc"] .consent.bg-boothart-globenetwork{background-size:cover;background-position:50% 42%;}
/* .bg-boothart-womanprofile revised again same day (2nd real-device round, per "การวางตำแหน่งรูปยังสื่อสาร
   ไม่ชัดเจน...ให้เหมาะสม และ balance") — at the first pass's 30% Y (grouped with the other 3 "สูงขึ้น"
   booths on the assumption its slack behaved the same), this image's own subject sits much lower in its
   own alpha-trimmed crop than personcap/doorlight/roadhorizon (bust starts ~60% down the source), so
   raising Y that far pushed the woman's head/face up behind the จำนวนข้อ/รางวัล cards — leaving only the
   suit torso and the plain building panel visible below, unclear/no legible face. Bumped Y to 60% (well
   past this booth's own base-42% neighbors, since her face needs to clear the cards' bottom edge, not
   just sit off from true-center) so the head+shoulders land in the open gap between the cards and the
   CTA button, and nudged size up (90%→95%) per the same direction's "สามารถแสดงได้มากกว่านี้มั๊ย" — this
   aspect ratio (.6) still clears the box with real slack to spare even at 95% (see the block comment
   above for the math), so the extra size is free presence, not a cropping risk. */
.consent.bg-boothart-womanprofile{background-size:95% auto;background-position:50% 60%;}
:root[data-view="tablet"] .consent.bg-boothart-womanprofile{background-size:cover;background-position:50% 42%;}
:root[data-view="pc"] .consent.bg-boothart-womanprofile{background-size:cover;background-position:50% 42%;}
.consent.bg-boothart-plantsprout{background-size:90% auto;background-position:50% 42%;}
:root[data-view="tablet"] .consent.bg-boothart-plantsprout{background-size:cover;background-position:50% 42%;}
:root[data-view="pc"] .consent.bg-boothart-plantsprout{background-size:cover;background-position:50% 42%;}
.consent.bg-boothart-skyscraper{background-size:90% auto;background-position:50% 42%;}
:root[data-view="tablet"] .consent.bg-boothart-skyscraper{background-size:cover;background-position:50% 42%;}
:root[data-view="pc"] .consent.bg-boothart-skyscraper{background-size:cover;background-position:50% 42%;}
.consent.bg-boothart-handshake{background-size:90% auto;background-position:50% 42%;}
:root[data-view="tablet"] .consent.bg-boothart-handshake{background-size:cover;background-position:50% 42%;}
:root[data-view="pc"] .consent.bg-boothart-handshake{background-size:cover;background-position:50% 42%;}
.consent.bg-boothart-stairsclimb{background-size:90% auto;background-position:50% 42%;}
:root[data-view="tablet"] .consent.bg-boothart-stairsclimb{background-size:cover;background-position:50% 42%;}
:root[data-view="pc"] .consent.bg-boothart-stairsclimb{background-size:cover;background-position:50% 42%;}
.consent.bg-boothart-roadhorizon{background-size:90% auto;background-position:50% 30%;}
