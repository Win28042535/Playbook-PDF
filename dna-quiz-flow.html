.home-hero{position:relative;overflow:hidden;text-align:center;border:1px solid var(--line-soft);border-radius:var(--r2);background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--violet) 14%,transparent),color-mix(in srgb,var(--cyan) 8%,transparent) 46%,var(--white) 78%);padding:22px var(--sp-card-pad) 24px;}
/* Smaller hero logo, bigger emphasis on .hh-sub below — the eyebrow badge/logo were carrying more
   visual weight than the sentence that actually says what this screen is for. The eyebrow badge
   itself (.hh-badge, "Playbook ลงทุนของคุณ" + book icon) was cut from the poster 2026-09-16 per
   direction, so .hh-logo is now the card's first element — its old margin-top (spacing it away
   from the badge above) is dropped; the card's own padding-top already clears it. */
.hh-logo{display:block;width:min(56%,210px);height:auto;margin:0 auto;}
.hh-sub{font-size:var(--fs-sub);font-weight:var(--w-head);color:var(--ink);line-height:1.55;max-width:34ch;margin:var(--sp-inline) auto 0;}
/* 500 base / 700 emphasized trailing clause — same "text weight play" convention as .q-title/
   .q-title b (emphasizeQ()), hand-authored here since this is one static string, not a per-item
   render. Bolds "ดูย้อนหลังได้บน efin.finance" so the poster subtext isn't one flat weight. */
.hh-sub b{font-weight:var(--w-label);}
.hh-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--sp-list) 18px;margin-top:var(--sp-stack);}
.hh-meta span{display:inline-flex;align-items:center;gap:var(--sp-glue);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);}
.hh-meta svg{width:var(--ic-sm);height:var(--ic-sm);color:var(--violet);}
/* Poster v3 — the home-hero's only remaining look now (v1's light spectrum-wash and v2's night-sky
   photo background were removed 2026-08-29, per direction "ไม่ต้องมี preview...V1, V2 ลบออก เหลือ
   แค่ V3" — see the deleted POSTER_VER var's own comment for what those looked like). A looping
   video (sky-video-v3-loop.mp4, embedded as BG_VIDEO.sky) sits on its own real <video> element
   (.hh-video, z-index:-2) rather than a CSS background-image, since background-image can't paint a
   <video>; ::before here is just the scrim gradient, no image behind it, layered on top of the
   video (z-index:-1) so it paints behind the card's own in-flow content (badge/logo/sub/meta)
   without needing to touch every one of their z-index values, same trick as elsewhere in this
   file's ink cards (compare .next-step::after, which instead bumps its own children to z-index:1).
   Hover/tap zoom targets .hh-video directly (see the shared :hover rule up in the
   @media(hover:hover) block, and the :active rule below) — same "camera push-in" idiom as
   .prof-av's own hover/active zoom. */
.home-hero.v3{border-color:rgba(255,255,255,.16);}
.home-hero.v3::before{content:"";position:absolute;inset:0;z-index:-1;background-image:linear-gradient(180deg,rgba(8,12,20,.42) 0%,rgba(8,12,20,.6) 42%,rgba(8,12,20,.4) 68%,rgba(8,12,20,.54) 100%);}
.hh-video{position:absolute;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;object-position:center 25%;transition:transform .6s cubic-bezier(.16,1,.3,1);}
/* Tablet/pc anchor the video to the TOP (2026-08-24, per direction "ต้องการให้วีดีโอ...alignment
   top เสมอ เพื่อให้เห็นช่องแสง ท้องฟ้า และเมฆด้านบน") — the hero box is wider/shorter at these two
   sizes (.home-hero sits inside the shared 760px content column, see :root[data-view="tablet"/"pc"]
   main.scroll{max-width:760px}), so object-fit:cover's default center crop on the base rule above
   cuts into the sky/light-beam/clouds at the top of sky-video-v3-loop.mp4 that mobile's taller box still
   shows at 25%. Mobile keeps the base rule untouched — only tablet/pc get the top anchor. */
:root[data-view="tablet"] .hh-video,:root[data-view="pc"] .hh-video{object-position:center top;}
.home-hero.v3:active .hh-video{transform:scale(1.04);}
.home-hero.v3 .hh-sub{color:var(--cloud);}
.home-hero.v3 .hh-meta span{color:rgba(255,255,255,.8);}
.home-hero.v3 .hh-meta svg{color:var(--cyan);}
/* pass-card — the tier row reworked into a "your ticket" status card: eyebrow ("บัตรของคุณ") +
   prominent tier name, a benefit line, then a divided price row. */
/* font-weight:var(--w-body) (2026-09-21, per direction, typography audit F1) — .pass-card is a <button> on
   Home, and buttons don't inherit font-weight from body (UA default 400), so .pass-benefit/.pass-foot-lbl,
   which set no weight of their own, rendered at 400 — the one place the system's 500/700 rule leaked. */
.pass-card{display:block;width:100%;text-align:left;font-family:var(--font);font-weight:var(--w-body);background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-stack) var(--sp-stack);cursor:pointer;}
.pass-top{display:flex;align-items:center;gap:var(--sp-inline);}
.pass-hd{flex:1;min-width:0;}
/* "ความคืบหน้าของคู่มือ" dropped its .pass-ic badge entirely (2026-08-24, per direction "ไอคอนให้
   alignment แนวนอนกลางกับหัวข้อ") — the icon now sits inline inside .pass-ey (its heading) via
   .pass-ey-ic instead of its own flex item centered against the whole pass-hd block, so flex's
   align-items:center centers it against just that one eyebrow line. */
/* letter-spacing dropped (2026-08-29, per direction) — same fix as .s-ey above; "บัตรของคุณ" and
   "ความคืบหน้าของคู่มือ" are this class's only two call sites, both Thai. */
/* align-items:flex-start (2026-09-02, per direction "ให้ไอคอน alignment top กับคำว่า บัตรของคุณ") —
   was center: the tier icon (--ic-lg, 24px) is visibly taller than this eyebrow's own small text, so
   centering the two against each other let the icon overhang above AND below the label; top-aligning
   lines the icon's own top edge up with the text's cap-height instead, reading as deliberate rather
   than just "vertically centered because that's the flex default." */
.pass-ey{display:flex;align-items:flex-start;gap:var(--sp-inline);font-size:var(--fs-eyebrow);font-weight:var(--w-head);color:var(--muted);text-transform:uppercase;}
.pass-ey-ic{width:var(--ic-lg);height:auto;flex:0 0 auto;}
.pass-name{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--ink);line-height:1.15;margin-top:1px;}
/* "บัตรของคุณ"'s tier icon moved from its own .pass-ic badge column, to inline with .pass-name
   (icon+title), to finally here — inline with .pass-ey instead (2026-08-24, per direction "อยากให้
   icon มงกุฎ alignment กับคำว่า บัตรของคุณ") — same icon-in-the-eyebrow treatment "ความคืบหน้าของ
   คู่มือ" already uses, so both .pass-card usages now share one identical layout: icon+.pass-ey on
   one line, .pass-name (indented via .pn-indent below) on the next. */
/* Indent scoped to .pn-indent, not .pass-name itself, in case a future pass-card usage has no icon
   at all (and so needs no indent) — .pn-indent lands .pass-name under its own .pass-ey's text, not
   under the icon that now precedes it in every current usage. */
.pass-name.pn-indent{margin-left:calc(var(--ic-lg) + var(--sp-inline));}
.pass-cv{width:20px;height:20px;color:var(--muted);flex:0 0 auto;}
.pass-benefit{font-size:var(--fs-bodysm);color:var(--muted);margin-top:var(--sp-inline);line-height:1.4;}
.pass-foot{margin-top:var(--sp-inline);padding-top:var(--sp-inline);border-top:1px solid var(--line-soft);display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-list);}
.pass-foot-lbl{font-size:var(--fs-eyebrow);color:var(--muted);}
/* Multi-ticket pass-card (2026-09-02, per direction "จำลองเคส...ลูกค้าบัตร 2 แบบ", revised same day
   per follow-up direction "ใช้ข้อมูล/DNA เดียวกับบัตร 1 ใบ แต่เพิ่มข้อมูลบัตรใบที่ 2 เข้าไป") — no new
   classes needed at all: passCardMultiHTML() just repeats the exact .pass-ey/.pass-name.pn-indent/
   .pass-benefit/.pass-foot block above once per held ticket, inside the same one .pass-card. An
   earlier pass here invented a combined-privileges summary line + a badge/pill layout instead; scrapped
   same day once the direction clarified it should read as "your normal ticket card, just twice," not a
   new card shape. See §7.2's `.pass-card` bullet below for the exact markup this repeats. */
.pass-price{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);}
/* next-step — the ONE prominent home action, an ink card echoing the source's dark navy card */
/* align-items:flex-start (2026-08-15, per direction "align top... ตอนนี้ align center อยู่") — shared
   by Home's "ขั้นต่อไป" card and Games' "เล่นเกมนี้ต่อ" card (same .next-step component) — the 48px
   icon was centering against the full 3-line eyebrow/title/body text block instead of its first line. */
/* Grid-based layout (2026-08-26, per direction — "จัด button alignment center กับ text title" on
   pc/tablet, THEN a follow-up direction that mobile should keep its own older "button pinned to the
   bottom-right, below everything" shape instead of inheriting the pc/tablet centered-beside-title
   position). A flex version of this (icon+title+cta as one row, body below) got the pc/tablet half
   right but had no way to relocate just the CTA to the very bottom on mobile without it also
   dragging the visual order on pc/tablet — flex `order` doesn't reach across the icon+title row's
   own child (.ns-cta-slot) into a spot after a DIFFERENT sibling (.ns-body). Grid areas solve that:
   the same 3 items (icon/title/cta) just get reassigned to different named cells per breakpoint,
   with .ns-body always the one full-width row between them. */
/* align-items:start (2026-08-26, per direction — icon + CTA align-top with "ลุ้นรางวัลใหญ่", i.e.
   the eyebrow line, on EVERY device, not just pc/tablet as the first pass had it) — top-aligns the
   icon/title/cta row instead of centering it against the row's tallest item. */
.next-step{display:grid;grid-template-columns:48px 1fr auto;grid-template-areas:"ic tx cta" ". body body";align-items:start;column-gap:var(--sp-inline);row-gap:var(--sp-stack-tight);background:var(--ink);color:var(--cloud);border-radius:var(--r2);padding:var(--sp-card-pad-sm) var(--sp-card-pad);position:relative;overflow:hidden;}
:root[data-view="mobile"] .next-step{grid-template-columns:48px 1fr;grid-template-areas:"ic tx" ". body" "cta cta";}
/* Bug fix (2026-09-01, per direction — title "ถูกตัดลงมา แล้วเพี้ยน" i.e. wrapping one Thai word per
   line, on a very small screen like iPhone X) — same root cause as the tabbar fix above: on the base
   (tablet/pc-shaped) 3-column grid, the auto-width "cta" column (the "เล่นเกม"/"ร่วมลุ้นรางวัล" button)
   and the fixed 48px icon column together eat most of a genuinely narrow real screen, squeezing the
   1fr "tx" column down to less than one Thai word's width — the mobile-view rule above fixes this
   correctly WHEN data-view is actually "mobile", but a real ≤420px phone with data-view left on
   "tablet"/"pc" (demo panel not reset) still gets the cramped 3-column layout. Real-width fallback,
   independent of data-view, so the cta always wraps below on a genuinely narrow screen regardless of
   which device class is forced. */
@media(max-width:420px){.next-step{grid-template-columns:48px 1fr;grid-template-areas:"ic tx" ". body" "cta cta";}}
/* Extra breathing room above the CTA on mobile only (2026-08-26, per direction — the 4px row-gap
   that separates every row read fine between icon-row→body, but far too tight between body and the
   button once the button dropped to its own row below body on mobile). Scoped to the mobile CTA
   specifically rather than raising row-gap globally, since the icon-row→body gap wasn't flagged. */
:root[data-view="mobile"] .next-step .ns-cta-slot,:root[data-view="mobile"] .next-step .ds-joined{margin-top:var(--sp-block);}
.next-step::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(360px 180px at 100% 0%,color-mix(in srgb,var(--cyan) 22%,transparent),transparent 60%),radial-gradient(320px 170px at 0% 100%,color-mix(in srgb,var(--violet) 26%,transparent),transparent 62%);}
/* 12px confirmed, unchanged (2026-08-31, per corner-radius audit) — already the value .scan-note/
   .scan-mine-qr/.demo-sel were unified onto, so this one needed no edit. */
.ns-ic{grid-area:ic;position:relative;z-index:1;width:48px;height:48px;border-radius:var(--r2);background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:var(--cyan);}
.ns-ic svg{width:var(--ic-lg);height:var(--ic-lg);}
/* Home's "ขั้นต่อไป" games-step swaps in a PNG (joystick.png, 2026-08-26 per direction) instead of
   the lc-gamepad-2 SVG — sized to match the SVG it replaces so the badge doesn't jump. */
.ns-ic img{width:var(--ic-lg);height:var(--ic-lg);object-fit:contain;}
.ns-tx{grid-area:tx;position:relative;z-index:1;min-width:0;}
/* letter-spacing dropped (2026-08-29, per direction) — same fix as .s-ey above; covers "ขั้นต่อไป"
   (Home), "เล่นเกมนี้ต่อ" (Games), and "ลุ้นรางวัลใหญ่" (Booth) — this class's only 3 call sites. */
.ns-ey{font-size:var(--fs-eyebrow);font-weight:var(--w-head);text-transform:uppercase;color:rgba(255,255,255,.55);}
.ns-t{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--white);line-height:1.3;margin-top:2px;}
/* .ns-body wraps whatever trailing content a card has (just .ns-b for Home/Games; .ns-b plus the
   booth-only .ds-dl/.ds-chips for the prize-draw card) as ONE grid item, so the grid-area template
   above never has to know how many lines that content happens to be. */
.ns-body{grid-area:body;position:relative;z-index:1;align-self:start;}
.ns-b{font-size:var(--fs-bodysm);font-weight:var(--w-body);color:rgba(255,255,255,.72);line-height:1.5;}
/* .ns-cta-slot replaces the old plain .btn-primary — a Liquid Metal button auto-sizes itself off
   its own label, it doesn't stretch to fill a grid cell the way a <button width:100%> would, so
   justify-self:end (not a stretched width) is what actually right-aligns it in its own cell. */
.ns-cta-slot{grid-area:cta;position:relative;z-index:1;justify-self:end;}
/* "ร่วมลุ้นรางวัล" .btn-primary (2026-08-29) — same compact 38px sizing as .gr-hd .btn-primary
   ("เล่นเกมส์"'s own button, the explicit style reference). No color override needed: this button
   only ever renders inside .next-step.ds-ok (see the markup's own `eligible` guard) which is
   already a light green-tinted card, not the plain dark .next-step base — stock .btn-primary
   (ink bg/cloud text) has plenty of contrast there, same as .gr-play does on Games' white card. */
.next-step .ns-cta-slot.btn-primary{flex:0 0 auto;min-height:38px;padding:0 var(--sp-stack);font-size:var(--fs-label);}
.home-counters{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-inline);}
.hc-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-card-pad-sm);cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left;font-family:var(--font);}
.hc-card svg{width:var(--ic-md);height:var(--ic-md);}
.hc-val{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--ink);line-height:1.2;font-family:var(--font);}
.hc-label{font-size:var(--fs-eyebrow);font-weight:var(--w-body);color:var(--muted);line-height:1.35;}
.book-teaser{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-stack);grid-template-columns:1fr auto;}
/* Was flat neutral gray (var(--accent)/var(--ink)) like a plain UI-chrome icon — the book teaser
   is a real content shortcut (same "your guide/identity" idea as the Home pass-card and profile
   tier badge), so it gets the same violet tint those already use instead of reading as generic. */
/* No badge fill (2026-08-24, per direction) — .bt-ic is sole-use for "คู่มือลงทุนของคุณ", which now
   shows the full-color Book.png icon bare instead of a mono glyph on a tinted square. */
/* .bt-ic dropped (2026-08-24, per direction "ไอคอนให้ alignment แนวนอนกลางกับหัวข้อ") — as its own
   44px grid column, centering ran against the icon+subtitle's combined height, not the title line
   next to it. The icon now sits inline inside .bt-t itself (.bt-t-ic), so flex's align-items:center
   centers it against just that one line, matching the heading exactly. .book-teaser's grid dropped
   the now-unused 44px column to match (see below). */
.bt-t{display:flex;align-items:center;gap:var(--sp-inline);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);line-height:1.25;}
.bt-t-ic{width:24px;height:auto;flex:0 0 auto;}
.bt-s{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.45;margin-top:2px;margin-left:calc(var(--ic-lg) + var(--sp-inline));}
.bt-cv{width:20px;height:20px;color:var(--muted);flex-shrink:0;}
.home-card{background:var(--white);border:1px solid var(--line-soft);border-radius:var(--r2);padding:var(--sp-card-pad-sm) var(--sp-card-pad);}
.hcard-hd{margin-bottom:var(--sp-inline);}
.hcard-hd svg{width:var(--ic-md);height:var(--ic-md);flex-shrink:0;color:var(--violet);}
/* .hcard-t / .booth-hd .booth-t / .games-hd .games-t / .prof-t all computed to this exact rule —
   five names, one role (2026-08-15, per Card & Section review "08"). Consolidated onto the single
   canonical .s-h; .games-t and .prof-t had zero markup consumers left already and are gone
   entirely, .hcard-t/.booth-t markup sites now use .s-h directly instead of their own class. */
.hcard-s{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.5;margin-top:var(--sp-stack-tight);}
/* ══ BT-TABS ══ generic accessible tab component (bt- prefix, per direction, to avoid clashing
   with this file's own many single-purpose classes) — role=tablist/tab, full keyboard nav, whole-
   group + per-tab disable, optional icon, CSS-only tooltip, light/dark, responsive. Two variants:
   --primary (underline, for a page-level section switcher) and --secondary (pill/compact, matching
   what .ag-seg/.dd-tab already looked like before this pass — used for both real in-card tab groups
   in this app: the agenda day-selector below, and ddTabs()'s asset drilldown). Behavior lives in
   initBtTabs() near the bottom of the script; markup/ARIA state is plain HTML attributes, not a
   framework, so it works with this file's own render()-replaces-innerHTML pattern. */
.bt-tabs{display:flex;gap:var(--sp-list);}
.bt-tabs[aria-disabled="true"]{opacity:.5;pointer-events:none;}
.bt-tab{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-glue);font-family:var(--font);cursor:pointer;background:none;border:none;color:var(--muted);white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.bt-tab:disabled,.bt-tab[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
.bt-tab-icon{display:inline-flex;flex:0 0 auto;}
.bt-tab-icon svg{width:var(--ic-md);height:var(--ic-md);}
.bt-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r0);}
/* --primary: underline active state, for a page-level section switcher (not used by either of
   this app's two real instances yet, both of which matched the pill look — kept in the toolkit
   since the brief explicitly asked for both variants to exist). */
.bt-tabs--primary{border-bottom:1px solid var(--line-soft);gap:20px;}
/* Per direction, the horizontal line under THIS specific tab row (asset drilldown, "เจาะรายสินทรัพย์")
   reads as an unwanted extra divider right under the section header — scoped to just this consumer
   via its own .dd-tablist hook, not the shared .bt-tabs--primary base, since the other two consumers
   (profile before/after toggle, scan-mode switcher) still want the underline track. */
.dd-tablist{border-bottom:none;}
/* min-height:44px added (2026-09-17, responsive audit — was ~42px from padding+line-height alone). */
.bt-tabs--primary .bt-tab{min-height:44px;padding:var(--sp-list) 1px;font-size:var(--fs-bodysm);font-weight:var(--w-head);border-bottom:2px solid transparent;margin-bottom:-1px;}
.bt-tabs--primary .bt-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:var(--w-label);}
@media(max-width:420px){.bt-tabs--primary{overflow-x:auto;scrollbar-width:none;}.bt-tabs--primary::-webkit-scrollbar{display:none;}}
/* --secondary: compact/pill active state. flex-wrap:nowrap (was wrap) keeps every item on ONE row
   — wrap let items size to their own content, which visually read as "uneven, and the one that
   didn't fit fell to a second row" (TOC's original 4 buttons). The original fix forced flex:1 (equal
   width regardless of label length) with ellipsis as a safety net for whatever got squeezed — but
   Book v2's own content-nav (ตัวตน/วิเคราะห์/พอร์ต/เส้นทาง, a real --secondary consumer added later)
   showed this wasn't just a rare-squeeze fallback: "วิเคราะห์"/"เส้นทาง" clip to "วิเคร..."/"เส้นท..."
   on an ordinary 375px phone every time, since forcing 4 labels of different lengths into identical
   widths guarantees the longer ones overflow (2026-08-19 typography review, confirmed via
   scrollWidth>clientWidth on both). Fixed with 3 changes: (1) flex:0 1 auto — each pill sized to its
   OWN label instead of a forced equal share, only shrinking if the row's total content truly exceeds
   the container; (2) padding tightened 10px->6px horizontal, freeing enough width that NEITHER label
   set (this one, or v1's TOC — "Confidence" is the widest single word across both and was checked
   too) needs to shrink at all from ~375px up; (3) below 420px (this component's own icon+padding
   overhead no longer fits either set even un-shrunk) it switches to horizontal scroll instead of
   clipping, same overflow-x:auto pattern --primary already uses right above for the identical
   problem — confirmed zero clipping 375-420px, and a real usable scroll (not a clip) below that,
   down to 320px, for both label sets. Ellipsis rule kept below as a last-resort safety net for any
   future label wider than this can size for even while scrolling. */
.bt-tabs--secondary{flex-wrap:nowrap;justify-content:space-between;}
/* min-height 40->44px (2026-09-17, responsive audit). */
.bt-tabs--secondary .bt-tab{flex:0 1 auto;min-width:0;padding:var(--sp-list) var(--sp-glue);min-height:44px;font-size:var(--fs-bodysm);font-weight:var(--w-head);border:1px solid var(--line-soft);border-radius:var(--rpill);background:var(--white);transition:color .15s,border-color .15s,background .15s;}
/* Softened from solid --ink/--cloud (2026-08-19, per direction) — sitting right under the header's
   own black "ลงทะเบียน" CTA, a solid-black selected pill read as a second primary button stacked
   underneath it. Switched to the app's existing violet "active" wash (--active-fill/--violet/
   --active-border — same tokens already used for other in-progress/active states, e.g. .rt-badge.new,
   .ds-chip) so the selected tab reads as navigation, not another CTA. */
.bt-tabs--secondary .bt-tab[aria-selected="true"]{background:var(--active-fill);color:var(--violet);border-color:var(--active-border);}
/* Wrap instead of ellipsis-truncate (2026-08-24, bug fix) — on data-view="mobile" the 4 pills
   share the row equally (flex:1 1 0 above) and never scroll by design, but the longest label
   ("วิเคราะห์") still doesn't fit one line at real phone widths (375px and down), so the old
   overflow:hidden+ellipsis clipped it to "วิเครา…" — and at 320px all 4 labels clipped to
   unreadable single-character fragments. Letting the label wrap to 2 lines keeps every label
   fully legible without reintroducing horizontal scroll: .bt-tabs (the row) has no explicit
   align-items, so it defaults to stretch — when one pill grows taller for a 2-line label, its
   3 siblings stretch to match, so the row stays a uniform-height segmented control. */
.bt-tabs--secondary .bt-tab-label{white-space:normal;overflow-wrap:break-word;text-align:center;line-height:1.15;}
@media(max-width:420px){.bt-tabs--secondary{justify-content:flex-start;overflow-x:auto;scrollbar-width:none;}.bt-tabs--secondary::-webkit-scrollbar{display:none;}.bt-tabs--secondary .bt-tab{flex:0 0 auto;}}
/* Same narrow-frame fix as the @media rule above, keyed off data-view instead of raw viewport
   width (2026-08-19, per direction) — the app's own .shell caps at ~400px on data-view="mobile",
   but a real browser viewport can stay well over 420px while showing that narrow frame (desktop
   testing, the demo panel's forced "มือถือ" mode), so the @media query alone never fired there:
   justify-content:space-between kept spacing pill items apart while flex:0 1 auto let them
   shrink-squeeze their own 9px 6px padding to fit — exactly the "gap between items wide, padding
   inside each item squeezed" complaint. flex-start + no-shrink here fixes it regardless of which
   breakpoint actually triggered "mobile". */
/* Follow-up (2026-08-19, per direction) — the flex-start/no-shrink fix above stopped the padding
   squeeze, but left the 4 items packed to the left with dead space at the row's end on a mobile-
   width card. Equal flex-grow (flex-basis 0) instead makes all 4 stretch to fill the card's full
   width evenly, like a real segmented control, while each item's own padding stays untouched since
   nothing is shrinking anymore — only growing. overflow-x/scrollbar no longer needed once items
   fill exactly 100% of the row (nothing left to scroll). */
:root[data-view="mobile"] .bt-tabs--secondary{justify-content:flex-start;}
:root[data-view="mobile"] .bt-tabs--secondary .bt-tab{flex:1 1 0;}
/* Responsive audit follow-up (2026-08-27) — even with the 2026-08-24 wrap fix above, Book v2's own
   4-pill set (ตัวตน/วิเคราะห์/พอร์ต/เส้นทาง) still wrapped ONE label ("เส้นทาง") to 2 lines on an
   ordinary 375px phone while its 3 siblings stayed single-line (confirmed via real screenshot + a
   getBoundingClientRect measurement: labelH 41.4px vs the other three's 20.7px) — every pill stretches
   to match the tallest per the wrap-fix's own align-items:stretch, so heights stayed uniform, but the
   one pill's label sitting alone on 2 lines while its neighbors had dead vertical space around a
   single line still read as an unfinished/inconsistent segmented control, not a deliberate design.
   Root cause: at the 79.8px share each pill gets on a 375px row, the icon+gap+padding ate enough width
   that "เส้นทาง"'s ~40px label had ~2px less room than it needed — but only THAT label, since Thai's
   dictionary-based line-breaking found a valid word-boundary inside it (เส้น+ทาง, a real compound)
   while e.g. "วิเคราะห์" has no such boundary and so never wrapped even though it measures wider.
   Shrinking just this tab bar's icon from --ic-md (20px) to --ic-sm (16px) at mobile width frees the
   ~4px needed — confirmed via live measurement, all 4 labels render single-line 375px down to 390px+,
   and even at the 320px floor only the one genuinely-longest label ("เส้นทาง") still wraps (down from
   two labels wrapping there pre-fix) — a strict improvement, never a regression, at every width. Scoped
   to .bt-tabs--secondary so it doesn't touch the shared .bt-tab-icon svg rule's other consumers
   (v1 TOC, primary tabs, dd-tablist) which keep the full --ic-md icon. */
:root[data-view="mobile"] .bt-tabs--secondary .bt-tab-icon svg{width:var(--ic-sm);height:var(--ic-sm);}
/* Responsive audit regression fix (2026-09-03, real 320px phone) — the 2026-08-27 fix above assumed
   a smaller --fs-bodysm than the app now ships (that token grew to 18px under a later "app-scaled
   typography" pass, per DESIGN-DNA.md), so its "only 'เส้นทาง' wraps at the 320px floor" claim no
   longer held: live measurement now showed BOTH "ตัวตน" (28.6px natural) and "เส้นทาง" (35.7px
   natural) wrapping at 320px, each breaking at its own dictionary word-boundary (ตัว+ตน, เส้น+ทาง)
   the way the 2026-08-27 comment already describes for เส้นทาง alone. "วิเคราะห์" (40.0px natural,
   the actual WIDEST label) still never wraps — it has no such internal boundary — so it was already
   the real ceiling to design for, not a safe assumption to skip.
   Rather than re-derive a font-size-specific icon/padding trim that will just drift out of sync
   again the next time --fs-bodysm changes, this shrinks every space-cost on the pill at once (icon
   16px→14px, its own gap 6px→3px, the pill's internal h-padding 6px→3px, the row's own outer padding
   16px→10px and inter-pill gap 6px→5px) so there's real margin, not a knife-edge fit: verified live
   via getBoundingClientRect down to a real 320px viewport — "วิเคราะห์" (widest) renders at ~40px
   inside ~44-49px of available label room per pill, all 4 single-line, none clipped. 420px matches
   this same component's own existing narrow-phone breakpoint (the @media rules above/below). */
@media(max-width:420px){
  :root[data-view="mobile"] .toc.bt-tabs--secondary{padding-left:10px;padding-right:10px;gap:5px;}
  :root[data-view="mobile"] .bt-tabs--secondary .bt-tab{padding:8px 3px;gap:3px;}
  :root[data-view="mobile"] .bt-tabs--secondary .bt-tab-icon svg{width:14px;height:14px;}
}
/* Tablet/pc had no override at all here — they fell through to the base space-between +
   flex:0 1 auto above, which (unlike mobile's flex:1 1 0 fix) was only ever tuned to stop pills
   clipping on a NARROW frame, not to look deliberate on a much wider ~760px row (see .toc's own
   tablet/pc max-width): space-between anchors the first/last pill to the row's outer edges and
   dumps all the remaining width into the gaps between them, so more screen width only ever meant
   bigger, uneven gaps — never a bigger, better-proportioned control (2026-08-20, per direction
   "tabbar อยากให้ขนาด และ spacing (ระหว่าง item) มีความยืดหยุ่นตามความเหมาะสม สัมพันธ์กันทุก
   อุปกรณ์"). Centered instead, with a real capped `gap` and roomier per-pill padding — pills stay
   content-sized (flex:0 1 auto, same as the base) so no label re-clips, they're just clustered
   together proportionately instead of stretched edge-to-edge. */
:root[data-view="tablet"] .bt-tabs--secondary,:root[data-view="pc"] .bt-tabs--secondary{justify-content:center;gap:14px;}
:root[data-view="tablet"] .bt-tabs--secondary .bt-tab,:root[data-view="pc"] .bt-tabs--secondary .bt-tab{padding:10px 20px;}
/* Bug fix (2026-09-01, per direction — tabbar "เลื่อนมาฝั่งซ้ายสุดไม่ได้ [แต่ยังเลื่อนมาฝั่งขวาสุดได้]")
   — the classic justify-content:center + overflow-x:auto trap: when centered flex content is wider
   than its box, the browser centers it around the box's notional (unclipped) width, so the LEFT half
   of the overflow sits at a negative scroll offset that scrollLeft (whose floor is 0) can never
   reach, while the right half's overflow is a normal positive offset and scrolls fine — exactly the
   asymmetric "can't reach the very left, can reach the very right" symptom. This can only actually
   fire on a real ≤420px viewport (the width the plain @media rule above needs to turn on overflow-x:
   auto in the first place) — but data-view is demo-panel/state driven, not tied to real width (see the
   RESPONSIVE banner comment above), so a real narrow phone with data-view left on "tablet"/"pc" (e.g.
   mid-review, without resetting the demo panel back to "มือถือ") hits it. Forces the same
   justify-content:flex-start the mobile-view rule already proved safe, but ONLY under the real-width
   condition — pills stay centered/roomy at genuine tablet/pc widths, where nothing overflows so this
   never fires. */
@media(max-width:420px){:root[data-view="tablet"] .bt-tabs--secondary,:root[data-view="pc"] .bt-tabs--secondary{justify-content:flex-start;}}
/* Follow-up (2026-09-02, per direction "ไม่ว่าจะเหลือแสดงกี่ item ให้ภาพรวม fill width เต็มความกว้าง
   เสมอ") — flex-start above only stopped the unreachable-scroll bug; it left the row merely LEFT-
   aligned, not filled, so on Pre-Event's 2-tab set (identity+analysis only, see book2Tabs()) the two
   pills clustered together with a big dead gap after them instead of sharing the row — same "packed
   left, dead space at the end" symptom the mobile-view fix below already solved for its own 4-tab
   case. Same fix here: flex:1 1 0 makes every remaining pill grow to fill the row evenly regardless
   of count (2, 4, or any future number), so this narrow-real-width fallback now matches the mobile
   rule's behavior exactly instead of only half of it. */
@media(max-width:420px){:root[data-view="tablet"] .bt-tabs--secondary .bt-tab,:root[data-view="pc"] .bt-tabs--secondary .bt-tab{flex:1 1 0;}}
/* data-tooltip — CSS-only, no JS beyond what initBtTabs already wires for focus */
.bt-tab[data-tooltip]::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--cloud);font-size:var(--fs-label);font-weight:var(--w-body);padding:var(--sp-stack-tight) 9px;border-radius:var(--r0);white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .15s,transform .15s;pointer-events:none;z-index:20;}
.bt-tab[data-tooltip]:hover::after,.bt-tab[data-tooltip]:focus-visible::after{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
/* The one @media(prefers-color-scheme:dark) block in the file was deleted (2026-08-15, per Color
   DNA review "07") — it contradicted this file's own "light theme only" stance elsewhere, and only
   ever covered one component (this tab picker), so a system-dark-mode user got an inverted TOC pill
   and tab picker sitting inside otherwise all-white cards everywhere else. */
.ag-row{display:flex;gap:var(--sp-stack);padding:var(--sp-stack) 0;border-bottom:1px solid var(--line-soft);}
.ag-row:last-child{border-bottom:none;}
/* .ag-time bumped to match .ag-t's own size+weight (2026-08-28, per direction "เวลา...text size
   เท่ากับ กำหนดการ...และ text weight 700 / กำหนดการ...text weight 700") — was fs-eyebrow/w-head
   (14px/500) vs .ag-t's fs-bodysm/w-head (18px/500); both now fs-bodysm/w-label. The old fixed
   width:52px (sized for the smaller 14px label) started wrapping "09:00" onto 2 lines at the
   bigger/bolder size with flex-shrink:0 holding the box at that width regardless — dropped the
   fixed width and added white-space:nowrap instead, so the column just sizes to its own content;
   every AGENDA_D1/D2 time string is the same "HH:MM" length, so columns still line up. */
.ag-time{flex:0 0 auto;white-space:nowrap;font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--violet);line-height:1.45;font-family:var(--font);}
.ag-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.4;}
.ag-by{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.45;margin-top:2px;}
.ag-more{width:100%;margin-top:var(--sp-inline);display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-glue);border:1px solid var(--line-soft);background:var(--white);color:var(--ink);font-family:var(--font);font-weight:var(--w-head);font-size:var(--fs-bodysm);min-height:44px;border-radius:var(--r1);cursor:pointer;transition:transform .15s var(--ease),background .15s var(--ease);}
.ag-more svg{width:var(--ic-sm);height:var(--ic-sm);}
/* Chevron now actually flips (2026-08-28, per direction "กรณีย่อรายการ...ไอคอนต้องเป็น top...ตอนนี้ยัง
   เป็น bottom") — the markup below used to call ic('lc-chevron-down') in BOTH ternary branches (a
   dead conditional, same icon either way), so it always pointed down even in the "ย่อกำหนดการ"
   (collapse) state where an up-pointing chevron is the correct affordance. Same rotate-on-open
   trick as .gr-chev.open (togGame) rather than a second lc-chevron-up symbol. */
.ag-more-ic.open{transform:rotate(180deg);}
/* "เพิ่ม interaction" (2026-08-28, per direction) — same press-scale + desktop-hover-tint idiom as
   .mp-zoom above; this button had cursor:pointer already but no actual press/hover feedback. */
.ag-more:active{transform:scale(.98);}
@media(hover:hover) and (pointer:fine){.ag-more:hover{background:var(--cloud);}}
/* "เพิ่ม interaction" (2026-08-28, per direction) — was a static row with no affordance at all
   (no cursor, no hover/press feedback); same press-scale + desktop-hover-tint idiom as .mp-zoom/
   .ag-more above. No onclick added — there's nowhere for an announcement row to navigate to yet,
   this is purely the tactile "this responds to your tap" polish that was missing. */
.ann-row{display:flex;gap:var(--sp-inline);align-items:flex-start;padding:var(--sp-inline) var(--sp-inline);border-radius:var(--r1);background:var(--paper);cursor:pointer;transition:transform .15s var(--ease),background .15s var(--ease);}
.ann-row:active{transform:scale(.98);}
@media(hover:hover) and (pointer:fine){.ann-row:hover{background:var(--cloud);}}
.ann-row+.ann-row{margin-top:var(--sp-list);}
.ann-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.4;}
.ann-s{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.45;margin-top:1px;}
/* ══ POST-EVENT ("หลังจบงาน · ดูย้อนหลัง") ══ */
.pe-report{display:flex;gap:var(--sp-inline);align-items:flex-start;padding:var(--sp-inline) var(--sp-stack);border-radius:var(--r1);background:var(--paper);margin-top:2px;}
.pe-report.on{background:var(--done-wash);}
/* margin-top 1px->3px (2026-09-10, per direction "ให้ Alignment center กับบรรทัดแรก", pictured on
   .bp-pts which shares this exact rule) — .pe-report-t's first line is 25.2px tall (fs-bodysm/18px ×
   line-height 1.4); centering the 20px icon within it is (25.2-20)/2 ≈ 3px, not the old 1px. */
.pe-report svg{width:var(--ic-md);height:var(--ic-md);flex:0 0 auto;margin-top:3px;color:var(--muted);}
/* --cyan-ink (which this used to read via a fallback) was retired again 2026-08-15, per Design DNA
   review "--cyan-ink ทางเลือก B" — reverted to a flat --ink instead of wiring the token, since the
   chosen answer this time was to keep the icon's current (ink) look, not make it cyan. */
.pe-report.on svg{color:var(--ink);}
/* .pe-report-amber (2026-09-18, per direction) — a 3rd .pe-report colorway (paper default, done-wash
   .on, now this warning-toned one), reused by เกมหลัก's "เล่นไม่ครบมีผลมาก" card: same --amber-bg/
   --amber-border pair .next-step.ds-need's own background already uses, plus its icon/title tinted

.pe-report-amber{background:var(--amber-bg);border:1px solid var(--amber-border);}
.pe-report-amber svg{color:var(--amber-text);}
.pe-report-amber .pe-report-t{color:var(--amber-text);}
/* .pe-report-lg (2026-09-16, per direction "ให้ไอคอน size เท่ากับของ section อื่น ในหน้าเดียวกัน") —
   scoped to renderPlaySummary's saveNoteHTML call site only: that screen's other icon-led sections
   (.str-hd, .ast-lbl, .hero-note.skill-note) all use --ic-lg/24px, so the base .pe-report svg's
   --ic-md/20px (sized for Home's own "รายงานพัฒนาการหลังงาน" card, left untouched) read small next to
   them. margin-top recalculated for the bigger icon using the same centering math as the base rule's
   own comment: (25.2 - 24)/2 ≈ 1px, not the base rule's 3px (which was centering a 20px icon). */
.pe-report.pe-report-lg svg{width:var(--ic-lg);height:var(--ic-lg);margin-top:1px;}
.pe-report-t{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);line-height:1.4;}
.pe-report-s{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.45;margin-top:2px;}

.pe-vlbl{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--ink);margin:var(--sp-inline) 0 6px;}
.pe-vlist{display:flex;flex-direction:column;gap:var(--sp-list);}
.pe-vitem{display:flex;align-items:center;gap:var(--sp-inline);padding:var(--sp-card-pad-sm);border-radius:var(--r1);border:1px solid var(--line-soft);background:var(--white);}
.pe-vic{width:36px;height:36px;flex:0 0 auto;border-radius:var(--r1);background:var(--active-fill);color:var(--violet);display:flex;align-items:center;justify-content:center;}
.pe-vic svg{width:var(--ic-md);height:var(--ic-md);}
.pe-vtx{flex:1;min-width:0;}
.pe-vt{font-size:var(--fs-bodysm);font-weight:var(--w-head);color:var(--ink);}
.pe-vs{font-size:var(--fs-eyebrow);color:var(--muted);margin-top:1px;}
.pe-vplay{width:22px;height:22px;flex:0 0 auto;color:var(--violet);}
.pe-track{margin-top:var(--sp-stack);}
.pe-track-hd{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-list);margin-bottom:var(--sp-list);}
.pe-track-lbl{font-size:var(--fs-h2);font-weight:var(--w-label);color:var(--ink);}
.pe-track-badge{font-size:var(--fs-label);font-weight:var(--w-head);color:var(--ink);background:var(--accent);padding:var(--sp-stack-tight) var(--sp-list);border-radius:var(--rpill);white-space:nowrap;}

.pe-track-badge.full{color:var(--ink);background:var(--done-fill);}

.pe-locked svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;}

.pe-item-tx{flex:1;min-width:0;}
.pe-item-t{font-size:var(--fs-bodysm);font-weight:var(--w-head);color:var(--ink);line-height:1.35;}

.pe-dl{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);flex:0 0 auto;border:1px solid var(--ink);background:var(--ink);color:var(--cloud);font-family:var(--font);font-weight:var(--w-head);font-size:var(--fs-label);padding:var(--sp-glue) var(--sp-inline);border-radius:var(--rpill);cursor:pointer;white-space:nowrap;}
.pe-dl svg{width:var(--ic-sm);height:var(--ic-sm);}
.pe-lockbtn{display:inline-flex;align-items:center;gap:var(--sp-stack-tight);flex:0 0 auto;color:var(--muted);font-size:var(--fs-label);font-weight:var(--w-head);white-space:nowrap;}

/* Upgrade CTA row — right-aligned per direction (was a centered Liquid Metal slot). .btn-primary's
   own flex:1 is for full-width CTAs; here the button hugs its content and sits at the right edge. */
.pe-cta-row{margin-top:var(--sp-card-pad-sm);display:flex;justify-content:flex-end;}
.pe-upgrade{flex:0 0 auto;}
/* stub screen for not-yet-built tabs (passport/games/profile) */
.stub-wrap{flex:1;min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--sp-stack);padding:40px var(--sp-edge);}
.stub-ic{width:72px;height:72px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--muted);}
