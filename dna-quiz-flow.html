   width. pbBuild() (JS) packs the section blocks onto sheets; @media print renders the same sheets 1:1
   on @page A4 so print / "Save as PDF" matches the screen page-for-page. */
.pb-viewport{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;}
.pb-doc{--pbs:1;display:flex;flex-direction:column;align-items:center;gap:calc(var(--sp-inline)*var(--pbs));width:max-content;min-width:100%;}
.pb-zoom{display:inline-flex;align-items:center;gap:var(--sp-glue);}
.pb-zoom .ag-more{width:auto;min-width:44px;padding-left:var(--sp-inline);padding-right:var(--sp-inline);}
.pb-fit{width:calc(794px*var(--pbs));height:calc(794px*3508/2480*var(--pbs));flex:0 0 auto;position:relative;scroll-margin-top:calc(var(--pb-nav-h) + var(--sp-inline));}
.pb-page{position:absolute;left:0;top:0;width:794px;height:calc(794px*3508/2480);transform:scale(var(--pbs));transform-origin:0 0;box-sizing:border-box;background:var(--white);border:1px solid var(--line);box-shadow:var(--shadow-page);display:flex;flex-direction:column;padding:var(--pb-pad-top) var(--pb-pad-x) var(--pb-pad-bottom);overflow:hidden;}
.pb-cover{padding:0;border:0;background-color:var(--cover-paper);background-size:100% 100%;background-repeat:no-repeat;}
.pb-frame{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;}
.pb-frame-line{fill:none;stroke:var(--frame-line);stroke-width:1.1;}
.pb-frame-star{fill:var(--frame-star);}
.pb-frame-halo{fill:var(--paper);} /* punches the gap in the line behind each star */
.pb-page.pb-framed{background:var(--paper);} /* frame line is 30px in, so 62 = 32px between the frame and the content */
/* body content runs edge to edge inside the frame; only the header / footer text is inset, to stay clear of the rounded corners */
.pb-page.pb-framed .pb-hd,.pb-page.pb-framed .pb-ft{padding-left:var(--pb-folio-inset);padding-right:var(--pb-folio-inset);} /* #F7F8F7 = --paper, per the supplied swatch */
/* framed sheet: the ornament is the container, so the persona card sits straight on the page — no glow frame / card box of its own — and is shown larger */
.pb-page.pb-framed .hero-gw{padding:0;}
.pb-page.pb-framed .hero-glow-base,.pb-page.pb-framed .hero-glow-energy{display:none;}
.pb-page.pb-framed .hero-in{background:transparent;padding:0;border-radius:0;}
#b2ident-head:empty{display:none;}
.pb-page #b2ident-head{margin-top:var(--sp-stack);} /* breathing room under the single card (its caption is gone) */
/* the card JPGs carry their own rounded corner (~5% of the width, black outside it): clip the frame to that same
   curve (a touch larger) so the black corner pixels never show */
.pb-page .cr2{border-radius:5.8% / 4.15%;}
.pb-page.pb-framed .hero-in .cr2{max-width:400px;margin-top:var(--sp-list);}
.pb-page.pb-framed .hero-in .cr2-cap{max-width:420px;margin-top:var(--sp-stack);}
.pb-hd{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:var(--sp-stack);padding-bottom:var(--sp-inline);border-bottom:1px solid var(--line-soft);font-size:var(--fs-folio);color:var(--muted);}
.pb-hd b{font-weight:var(--w-label);color:var(--ink);}
.pb-body{flex:1 1 auto;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:var(--pb-gap);padding-top:var(--pb-gap);}
.pb-body>*{flex:0 0 auto;margin:0;}
.pb-ft{flex:0 0 auto;display:flex;justify-content:space-between;gap:var(--sp-stack);padding-top:var(--sp-inline);border-top:1px solid var(--line-soft);font-size:var(--fs-folio);color:var(--muted);}
/* accordions are always expanded on a page (a fixed sheet can't grow when a row opens; print needs it all) */
.pb-page .side-body{max-height:none;overflow:visible;}
.pb-page .side-row{cursor:default;}
.pb-page .side-row .s-cv{display:none;}
/* sheet 1: the SKILL note hugs its text instead of filling the width */
.pb-page .hero-note.skill-note{width:100%;max-width:400px;margin-left:auto;margin-right:auto;} /* same width as the character card above it (.cr2 max-width 400) */
/* sheet 2: strengths / watch-outs side by side (the pc layout) at any viewport width */
:root .pb-page .str-grid{flex-direction:row!important;}
/* every card on a sheet uses the strengths-box surface (#F7F8F7 + hairline) instead of white */
.pb-page .card{background:var(--paper);border:1px solid var(--line-soft);}
/* หน้า "เส้นทาง" (journey) is print-like: nothing on it reacts to hover / tap */
.pb-page[data-sect="journey"]{pointer-events:none;}
.pb-page[data-sect="journey"] *{cursor:default!important;}
/* เจาะรายสินทรัพย์: all four assets laid out one after another (no tabs) */
.dd-asset{padding:var(--sp-inline) 0;border-top:1px solid var(--line-soft);}
.dd-asset:first-child{border-top:none;padding-top:0;}
.dd-asset-hd{display:flex;align-items:center;gap:var(--sp-list);font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);margin-bottom:var(--sp-inline);}
.dd-asset-hd svg{width:var(--ic-md);height:var(--ic-md);color:var(--violet);flex:0 0 auto;}
/* sheet 2: sections are set apart by ornaments, not frames */
#b2ident-detail .ast-block,#b2ident-detail .str-box,#b2ident-detail .str-box.wn,#b2ident-detail .conf-box{background:none!important;border:none!important;border-radius:0;box-shadow:none;}
#b2ident-detail .conf-glow{display:none;}
#b2ident-detail .ast-block,#b2ident-detail .str-box,#b2ident-detail .conf-box{padding-left:0;padding-right:0;} /* unframed: text lines up with the ends of the dividers */
#b2ident-detail>*{margin-top:0!important;margin-bottom:0!important;}
#b2ident-detail .str-grid{gap:var(--sp-stack);margin:0;align-items:stretch;}
.orn-h{height:var(--sp-hairline);background:var(--rule);margin:var(--sp-stack) 0;}
.orn-v{display:flex;flex-direction:column;align-items:center;gap:var(--sp-inline);flex:0 0 auto;align-self:stretch;}
.orn-v i{flex:1;width:var(--sp-hairline);min-height:var(--ic-lg);}
.orn-v i:first-child{background:linear-gradient(to bottom,var(--rule-fade),var(--rule-deep));}
.orn-v i:last-child{background:linear-gradient(to bottom,var(--rule-deep),var(--rule-fade));}
.orn-star{width:16px;height:16px;flex:0 0 auto;fill:var(--ornament);}
/* ── chapters วิเคราะห์ / พอร์ต / เส้นทาง: unframed ── */
.pb-page.pb-unframed :is(.card,.risk-box,.conf-box,.ast-block,.radar-insight){background:none!important;border:none;border-radius:0;box-shadow:none;}
.pb-page.pb-unframed .conf-glow{display:none;}
.pb-page.pb-unframed :is(.s-pad,.sides-hd,.radar-sec,.trait-sec,.alloc-sec,.risk-box,.conf-box,.route-steps){padding-left:0;padding-right:0;}
.pb-page.pb-unframed .list-row.side-row{padding-left:0;padding-right:0;}
/* section dividers: the same 2px #c4c5c7 hairline as sheet 2 */
.pb-page.pb-unframed :is(.trait-sec,.alloc-sec,.dd-asset,.side-item){border-top:var(--sp-hairline) solid var(--rule);}
.pb-page.pb-unframed .risk-box+.conf-box{border-top:var(--sp-hairline) solid var(--rule);padding-top:var(--sp-stack);margin-top:var(--sp-stack);}
.pb-page.pb-unframed .pb-body>.card~.card{border-top:var(--sp-hairline) solid var(--rule);padding-top:var(--sp-stack);}
.pb-page.pb-unframed .dd-asset:first-child,.pb-page.pb-unframed .card>.side-item:first-child,.pb-page.pb-unframed .card>:is(.trait-sec,.alloc-sec):first-child{border-top:none;}
.pb-actions{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:var(--sp-list);margin:0 0 var(--sp-inline);}
.pb-actions .ag-more{width:auto;padding-left:var(--sp-stack);padding-right:var(--sp-stack);}
/* library / glossary blocks (static + fully expanded — a page has no accordions) */
.pb-plain{padding:0;}
.pb-cat-hd{display:flex;align-items:center;gap:var(--sp-inline);padding:var(--sp-list) 0;border-bottom:var(--sp-hairline) solid var(--rule);}
.pb-cat-hd svg{width:var(--ic-md);height:var(--ic-md);color:var(--ink);flex:0 0 auto;}
.pb-cat-t{flex:1;font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);}
.pb-cat-n{font-size:var(--fs-eyebrow);font-weight:var(--w-label);color:var(--violet);background:var(--active-fill);padding:var(--sp-hairline) var(--sp-inline);border-radius:var(--rpill);}
.pb-art{padding:0 0 var(--sp-stack);border-bottom:1px solid var(--line-soft);}
.pb-art-t{font-size:var(--fs-sub);font-weight:var(--w-label);color:var(--ink);}
.pb-art-s{font-size:var(--fs-eyebrow);color:var(--muted);line-height:1.5;margin-top:var(--sp-hairline);}
.pb-art-p{font-size:var(--fs-bodysm);color:var(--ink);line-height:1.5;margin:var(--sp-inline) 0 0;}
.pb-note{margin-top:var(--sp-inline);display:flex;align-items:flex-start;gap:var(--sp-list);padding:var(--sp-list) var(--sp-inline);border-radius:var(--r1);font-size:var(--fs-eyebrow);line-height:1.5;}
.pb-note svg{width:var(--ic-sm);height:var(--ic-sm);flex:0 0 auto;margin-top:2px;}
.pb-note-ex{background:var(--accent);color:var(--muted);}
.pb-note-pit{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber-text);}
.pb-note-pit b{color:var(--amber-text);font-weight:var(--w-label);}
/* Glossary (ศัพท์ในเล่มนี้) — term/definition rows grouped by kind */
.gl-grp{margin-top:var(--sp-stack);}
.gl-gt{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);padding-bottom:var(--sp-list);}
.gl-gn{font-weight:var(--w-body);color:var(--muted);font-size:var(--fs-eyebrow);}
.gl-row{display:grid;grid-template-columns:minmax(96px,34%) 1fr;gap:var(--sp-inline);padding:var(--sp-list) 0;border-top:1px solid var(--line-soft);}
.gl-term{font-size:var(--fs-bodysm);font-weight:var(--w-label);color:var(--ink);}
.gl-def{font-size:var(--fs-bodysm);color:var(--muted);line-height:1.5;}
@page{size:A4;margin:0;}
@media print{
  html,body{background:#fff!important;display:block!important;min-height:0!important;height:auto!important;}
  .shell,#root{display:block!important;max-width:none!important;width:auto!important;height:auto!important;min-height:0!important;overflow:visible!important;background:#fff!important;}
  .toc,
.book-tabbar,
.pb-actions,
.reg-cta,
.go-top{display:none!important;}
  main.scroll{display:block!important;padding:0!important;max-width:none!important;width:auto!important;}
  .pb-viewport{overflow:visible!important;}
  .pb-doc{--pbs:1!important;display:block!important;width:auto!important;min-width:0!important;}
  .pb-fit{width:210mm!important;height:297mm!important;break-after:page;page-break-after:always;overflow:hidden;margin:0!important;}
  .pb-page{transform:none!important;width:100%!important;height:100%!important;border:0!important;box-shadow:none!important;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}
.rk-lab{fill:var(--muted);}
.sides-hd{padding:var(--sp-block) var(--sp-card-pad) var(--sp-stack-tight);}
.side-item{border-top:1px solid var(--line-soft);}
/* align-items:flex-start (2026-08-29, per direction "status...และไอคอน ลูกศรขึ้น-ลง ให้ alignment
   top กับ text title") — same "row wraps to 2 lines, so .list-row's shared align-items:center was
   centering the trailing status chip/chevron against the WHOLE .side-cx block instead of just
   .side-t's own line" fix as .klib-row got in 2026-08-15; also top-aligns .side-num (the leading
   number/check circle) as a side effect, same as that klib-row precedent did for its own leading
   icon. */
.side-row{grid-template-columns:34px 1fr auto;padding:var(--sp-stack) 20px;user-select:none;align-items:flex-start;}
.side-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-meta);font-weight:var(--w-head);flex-shrink:0;font-family:var(--font);}
.side-num.done{background:var(--ink);color:var(--cloud);}
.side-num.act{border:2px solid transparent;background:linear-gradient(var(--white),var(--white)) padding-box,var(--spectrum) border-box;color:var(--ink);}

/* ══ BT-TABS ══ generic accessible tab component (bt- prefix, per direction, to avoid clashing
   with this file's own many single-purpose classes) — role=tablist/tab, full keyboard nav, whole-
   group + per-tab disable, optional icon, CSS-only tooltip, light/dark, responsive. Two variants:
   --primary (underline, for a page-level section switcher) and --secondary (pill/compact, matching
   what .ag-seg/.dd-tab already looked like before this pass — used for both real in-card tab groups
   in this app: the agenda day-selector below, and ddTabs()'s asset drilldown). Behavior lives in
   initBtTabs() near the bottom of the script; markup/ARIA state is plain HTML attributes, not a
   framework, so it works with this file's own render()-replaces-innerHTML pattern. */
.bt-tabs{display:flex;gap:var(--sp-list);}
.bt-tabs[aria-disabled="true"]{opacity:.5;pointer-events:none;}
.bt-tab{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-glue);font-family:var(--font);cursor:pointer;background:none;border:none;color:var(--muted);white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.bt-tab:disabled,.bt-tab[aria-disabled="true"]{opacity:.45;cursor:not-allowed;}
.bt-tab-icon{display:inline-flex;flex:0 0 auto;}
.bt-tab-icon svg{width:var(--ic-md);height:var(--ic-md);}
.bt-tab:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:var(--r0);}
/* --secondary: compact/pill active state. flex-wrap:nowrap (was wrap) keeps every item on ONE row
   — wrap let items size to their own content, which visually read as "uneven, and the one that
   didn't fit fell to a second row" (TOC's original 4 buttons). The original fix forced flex:1 (equal
   width regardless of label length) with ellipsis as a safety net for whatever got squeezed — but
   Book v2's own content-nav (ตัวตน/วิเคราะห์/พอร์ต/เส้นทาง, a real --secondary consumer added later)
   showed this wasn't just a rare-squeeze fallback: "วิเคราะห์"/"เส้นทาง" clip to "วิเคร..."/"เส้นท..."
   on an ordinary 375px phone every time, since forcing 4 labels of different lengths into identical
   widths guarantees the longer ones overflow (2026-08-19 typography review, confirmed via
   scrollWidth>clientWidth on both). Fixed with 3 changes: (1) flex:0 1 auto — each pill sized to its
   OWN label instead of a forced equal share, only shrinking if the row's total content truly exceeds
   the container; (2) padding tightened 10px->6px horizontal, freeing enough width that NEITHER label
   set (this one, or v1's TOC — "Confidence" is the widest single word across both and was checked
   too) needs to shrink at all from ~375px up; (3) below 420px (this component's own icon+padding
   overhead no longer fits either set even un-shrunk) it switches to horizontal scroll instead of
   clipping, same overflow-x:auto pattern --primary already uses right above for the identical
   problem — confirmed zero clipping 375-420px, and a real usable scroll (not a clip) below that,
   down to 320px, for both label sets. Ellipsis rule kept below as a last-resort safety net for any
   future label wider than this can size for even while scrolling. */
.bt-tabs--secondary{flex-wrap:nowrap;justify-content:space-between;}
/* min-height 40->44px (2026-09-17, responsive audit). */
.bt-tabs--secondary .bt-tab{flex:0 1 auto;min-width:0;padding:var(--sp-list) var(--sp-glue);min-height:44px;font-size:var(--fs-bodysm);font-weight:var(--w-head);border:1px solid var(--line-soft);border-radius:var(--rpill);background:var(--white);transition:color .15s,border-color .15s,background .15s;}
/* Softened from solid --ink/--cloud (2026-08-19, per direction) — sitting right under the header's
   own black "ลงทะเบียน" CTA, a solid-black selected pill read as a second primary button stacked
   underneath it. Switched to the app's existing violet "active" wash (--active-fill/--violet/
   --active-border — same tokens already used for other in-progress/active states, e.g. .rt-badge.new,
   .ds-chip) so the selected tab reads as navigation, not another CTA. */
.bt-tabs--secondary .bt-tab[aria-selected="true"]{background:var(--active-fill);color:var(--violet);border-color:var(--active-border);}
/* Wrap instead of ellipsis-truncate (2026-08-24, bug fix) — on data-view="mobile" the 4 pills
   share the row equally (flex:1 1 0 above) and never scroll by design, but the longest label
   ("วิเคราะห์") still doesn't fit one line at real phone widths (375px and down), so the old
   overflow:hidden+ellipsis clipped it to "วิเครา…" — and at 320px all 4 labels clipped to
   unreadable single-character fragments. Letting the label wrap to 2 lines keeps every label
   fully legible without reintroducing horizontal scroll: .bt-tabs (the row) has no explicit
   align-items, so it defaults to stretch — when one pill grows taller for a 2-line label, its
   3 siblings stretch to match, so the row stays a uniform-height segmented control. */
.bt-tabs--secondary .bt-tab-label{white-space:normal;overflow-wrap:break-word;text-align:center;line-height:1.15;}
@media(max-width:420px){.bt-tabs--secondary{justify-content:flex-start;overflow-x:auto;scrollbar-width:none;}.bt-tabs--secondary::-webkit-scrollbar{display:none;}.bt-tabs--secondary .bt-tab{flex:0 0 auto;}}
/* Same narrow-frame fix as the @media rule above, keyed off data-view instead of raw viewport
   width (2026-08-19, per direction) — the app's own .shell caps at ~400px on data-view="mobile",
   but a real browser viewport can stay well over 420px while showing that narrow frame (desktop
   testing, the demo panel's forced "มือถือ" mode), so the @media query alone never fired there:
   justify-content:space-between kept spacing pill items apart while flex:0 1 auto let them
   shrink-squeeze their own 9px 6px padding to fit — exactly the "gap between items wide, padding
   inside each item squeezed" complaint. flex-start + no-shrink here fixes it regardless of which
   breakpoint actually triggered "mobile". */
/* Follow-up (2026-08-19, per direction) — the flex-start/no-shrink fix above stopped the padding
   squeeze, but left the 4 items packed to the left with dead space at the row's end on a mobile-
   width card. Equal flex-grow (flex-basis 0) instead makes all 4 stretch to fill the card's full
   width evenly, like a real segmented control, while each item's own padding stays untouched since
   nothing is shrinking anymore — only growing. overflow-x/scrollbar no longer needed once items
   fill exactly 100% of the row (nothing left to scroll). */
:root[data-view="mobile"] .bt-tabs--secondary{justify-content:flex-start;}
:root[data-view="mobile"] .bt-tabs--secondary .bt-tab{flex:1 1 0;}
/* Responsive audit follow-up (2026-08-27) — even with the 2026-08-24 wrap fix above, Book v2's own
   4-pill set (ตัวตน/วิเคราะห์/พอร์ต/เส้นทาง) still wrapped ONE label ("เส้นทาง") to 2 lines on an
   ordinary 375px phone while its 3 siblings stayed single-line (confirmed via real screenshot + a
   getBoundingClientRect measurement: labelH 41.4px vs the other three's 20.7px) — every pill stretches
   to match the tallest per the wrap-fix's own align-items:stretch, so heights stayed uniform, but the
   one pill's label sitting alone on 2 lines while its neighbors had dead vertical space around a
   single line still read as an unfinished/inconsistent segmented control, not a deliberate design.
   Root cause: at the 79.8px share each pill gets on a 375px row, the icon+gap+padding ate enough width
   that "เส้นทาง"'s ~40px label had ~2px less room than it needed — but only THAT label, since Thai's
   dictionary-based line-breaking found a valid word-boundary inside it (เส้น+ทาง, a real compound)
   while e.g. "วิเคราะห์" has no such boundary and so never wrapped even though it measures wider.
   Shrinking just this tab bar's icon from --ic-md (20px) to --ic-sm (16px) at mobile width frees the
   ~4px needed — confirmed via live measurement, all 4 labels render single-line 375px down to 390px+,
   and even at the 320px floor only the one genuinely-longest label ("เส้นทาง") still wraps (down from
   two labels wrapping there pre-fix) — a strict improvement, never a regression, at every width. Scoped
   to .bt-tabs--secondary so it doesn't touch the shared .bt-tab-icon svg rule's other consumers
   (v1 TOC, primary tabs, dd-tablist) which keep the full --ic-md icon. */
:root[data-view="mobile"] .bt-tabs--secondary .bt-tab-icon svg{width:var(--ic-sm);height:var(--ic-sm);}
/* Responsive audit regression fix (2026-09-03, real 320px phone) — the 2026-08-27 fix above assumed
   a smaller --fs-bodysm than the app now ships (that token grew to 18px under a later "app-scaled
   typography" pass, per DESIGN-DNA.md), so its "only 'เส้นทาง' wraps at the 320px floor" claim no
   longer held: live measurement now showed BOTH "ตัวตน" (28.6px natural) and "เส้นทาง" (35.7px
   natural) wrapping at 320px, each breaking at its own dictionary word-boundary (ตัว+ตน, เส้น+ทาง)
   the way the 2026-08-27 comment already describes for เส้นทาง alone. "วิเคราะห์" (40.0px natural,
   the actual WIDEST label) still never wraps — it has no such internal boundary — so it was already
   the real ceiling to design for, not a safe assumption to skip.
   Rather than re-derive a font-size-specific icon/padding trim that will just drift out of sync
   again the next time --fs-bodysm changes, this shrinks every space-cost on the pill at once (icon
   16px→14px, its own gap 6px→3px, the pill's internal h-padding 6px→3px, the row's own outer padding
   16px→10px and inter-pill gap 6px→5px) so there's real margin, not a knife-edge fit: verified live
   via getBoundingClientRect down to a real 320px viewport — "วิเคราะห์" (widest) renders at ~40px
   inside ~44-49px of available label room per pill, all 4 single-line, none clipped. 420px matches
   this same component's own existing narrow-phone breakpoint (the @media rules above/below). */
@media(max-width:420px){
  :root[data-view="mobile"] .toc.bt-tabs--secondary{padding-left:10px;padding-right:10px;gap:5px;}
  :root[data-view="mobile"] .bt-tabs--secondary .bt-tab{padding:8px 3px;gap:3px;}
  :root[data-view="mobile"] .bt-tabs--secondary .bt-tab-icon svg{width:14px;height:14px;}
}
/* Tablet/pc had no override at all here — they fell through to the base space-between +
   flex:0 1 auto above, which (unlike mobile's flex:1 1 0 fix) was only ever tuned to stop pills
   clipping on a NARROW frame, not to look deliberate on a much wider ~760px row (see .toc's own
   tablet/pc max-width): space-between anchors the first/last pill to the row's outer edges and
   dumps all the remaining width into the gaps between them, so more screen width only ever meant
   bigger, uneven gaps — never a bigger, better-proportioned control (2026-08-20, per direction
   "tabbar อยากให้ขนาด และ spacing (ระหว่าง item) มีความยืดหยุ่นตามความเหมาะสม สัมพันธ์กันทุก
   อุปกรณ์"). Centered instead, with a real capped `gap` and roomier per-pill padding — pills stay
   content-sized (flex:0 1 auto, same as the base) so no label re-clips, they're just clustered
   together proportionately instead of stretched edge-to-edge. */
:root[data-view="tablet"] .bt-tabs--secondary,:root[data-view="pc"] .bt-tabs--secondary{justify-content:center;gap:14px;}
:root[data-view="tablet"] .bt-tabs--secondary .bt-tab,:root[data-view="pc"] .bt-tabs--secondary .bt-tab{padding:10px 20px;}
/* Bug fix (2026-09-01, per direction — tabbar "เลื่อนมาฝั่งซ้ายสุดไม่ได้ [แต่ยังเลื่อนมาฝั่งขวาสุดได้]")
   — the classic justify-content:center + overflow-x:auto trap: when centered flex content is wider
   than its box, the browser centers it around the box's notional (unclipped) width, so the LEFT half
   of the overflow sits at a negative scroll offset that scrollLeft (whose floor is 0) can never
   reach, while the right half's overflow is a normal positive offset and scrolls fine — exactly the
   asymmetric "can't reach the very left, can reach the very right" symptom. This can only actually
   fire on a real ≤420px viewport (the width the plain @media rule above needs to turn on overflow-x:
   auto in the first place) — but data-view is demo-panel/state driven, not tied to real width (see the
   RESPONSIVE banner comment above), so a real narrow phone with data-view left on "tablet"/"pc" (e.g.
   mid-review, without resetting the demo panel back to "มือถือ") hits it. Forces the same
   justify-content:flex-start the mobile-view rule already proved safe, but ONLY under the real-width
   condition — pills stay centered/roomy at genuine tablet/pc widths, where nothing overflows so this
   never fires. */
@media(max-width:420px){:root[data-view="tablet"] .bt-tabs--secondary,:root[data-view="pc"] .bt-tabs--secondary{justify-content:flex-start;}}
/* Follow-up (2026-09-02, per direction "ไม่ว่าจะเหลือแสดงกี่ item ให้ภาพรวม fill width เต็มความกว้าง
   เสมอ") — flex-start above only stopped the unreachable-scroll bug; it left the row merely LEFT-
   aligned, not filled, so on Pre-Event's 2-tab set (identity+analysis only, see book2Tabs()) the two
   pills clustered together with a big dead gap after them instead of sharing the row — same "packed
   left, dead space at the end" symptom the mobile-view fix below already solved for its own 4-tab
   case. Same fix here: flex:1 1 0 makes every remaining pill grow to fill the row evenly regardless
   of count (2, 4, or any future number), so this narrow-real-width fallback now matches the mobile
   rule's behavior exactly instead of only half of it. */
@media(max-width:420px){:root[data-view="tablet"] .bt-tabs--secondary .bt-tab,:root[data-view="pc"] .bt-tabs--secondary .bt-tab{flex:1 1 0;}}
/* data-tooltip — CSS-only, no JS beyond what initBtTabs already wires for focus */
.bt-tab[data-tooltip]::after{content:attr(data-tooltip);position:absolute;bottom:calc(100% + 7px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--ink);color:var(--cloud);font-size:var(--fs-label);font-weight:var(--w-body);padding:var(--sp-stack-tight) 9px;border-radius:var(--r0);white-space:nowrap;opacity:0;visibility:hidden;transition:opacity .15s,transform .15s;pointer-events:none;z-index:20;}
.bt-tab[data-tooltip]:hover::after,.bt-tab[data-tooltip]:focus-visible::after{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0);}
.ag-more{width:100%;margin-top:var(--sp-inline);display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-glue);border:1px solid var(--line-soft);background:var(--white);color:var(--ink);font-family:var(--font);font-weight:var(--w-head);font-size:var(--fs-bodysm);min-height:44px;border-radius:var(--r1);cursor:pointer;transition:transform .15s var(--ease),background .15s var(--ease);}
.ag-more svg{width:var(--ic-sm);height:var(--ic-sm);}
/* "เพิ่ม interaction" (2026-08-28, per direction) — same press-scale + desktop-hover-tint idiom as
   .mp-zoom above; this button had cursor:pointer already but no actual press/hover feedback. */
.ag-more:active{transform:scale(.98);}
@media(hover:hover) and (pointer:fine){.ag-more:hover{background:var(--cloud);}}
@media(hover:hover) and (pointer:fine){.bp-btn:not(.done):not(.chk):hover{background:var(--cloud);}}
/* ══ SPLASH / ATTRACT ══ two-tone headline · drifting brand assets · card carousel */
/* overflow-x only (never -y): the CTA must NEVER be unreachable. overflow:hidden on both axes
   used to CLIP (not scroll-hide) anything past the fold whenever content ran taller than the
   viewport — on short/awkward viewports that silently ate the caption and, worse, could eat the
   CTA itself. -x keeps the corner-bleed asset scatter from causing a horizontal scrollbar; -y left
   open means if content is ever taller than the screen the page just scrolls, never traps content. */
/* overflow-x:hidden -> clip (2026-08-15, real bug found while fixing .sp-cta's mobile sticky rule)
   — per spec, setting only ONE axis to 'hidden' silently promotes the OTHER axis from 'visible' to
   'auto' (both become scroll containers), which was interfering with .sp-cta's align-self:stretch
   + negative-margin bleed calculation and clipping it ~15px short of full width. 'clip' doesn't
   carry that same-axis promotion rule, so it contains the fan-card carousel / scatter assets the
   same way without the side effect. Confirmed via direct measurement: .sp-cta went from 413px to
   the correct 428px width with this one change, no other visual difference. */
.splash{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;padding:24px var(--sp-edge) var(--sp-card-pad-sm);overflow-x:clip;min-height:100vh;min-height:100dvh;}
/* Each asset's --w is a fixed px size tuned for a wide canvas — on a narrow phone width the exact
   same px size eats a much bigger share of the screen, so the corners read as crowded instead of
   ambient. Scale every plane down together on narrow viewports; percentage top/left/right/bottom
   positions already scale with the container, only the fixed --w px size needed a mobile rule. */
/* First pass (0.62/0.85) still read as crowded — the FAR plane (gold/heart) adds the least
   (already the smallest/blurriest/faintest of the 3 depth planes) while sitting close enough to
   the headline to still register as clutter, so it's dropped entirely on mobile instead of just
   shrunk; MID/NEAR shrink further too. */
/* Second pass: shrinking alone still wasn't enough — measured the actual rendered boxes at 375px
   and two of the four remaining assets genuinely OVERLAP real content, not just each other:
   "card" sits 32px into the CTA button's own footprint (the CTA is nearly full-width on mobile,
   so almost no side margin exists at that height for anything to float beside it), and "bitcoin"
   nearly touches the NWNP hero logo (which is also close to full-width). Percentage positions
   tuned against a wide desktop canvas just don't leave the same margins once the layout narrows —
   no amount of shrinking fixes a position that's already inside the content's own box. Dropping
   "efin"/"card" on mobile (same precedent as the far plane above) and re-anchoring "candle" +
   "bitcoin" to the ONE band that actually has wide, genuine side margins on a narrow phone: level
   with .sp-sub, which measures ~73px of clear space on each side (vs. single-digit margins
   everywhere else content stacks near-full-width). */
@keyframes spDrift{from{transform:translate3d(0,0,0) rotate(var(--r0,0deg)) scale(var(--sc,1));}to{transform:translate3d(var(--dx,10px),var(--dy,-16px),0) rotate(var(--r1,6deg)) scale(var(--sc,1));}}
#cta-slot{min-height:56px;}

/* ══ COLLECTIBLE PERSONA CARD ══ full-bleed dark art · overlays · flip back
   Ink-on-card scale (2026-08-12) — deliberately literal, not CSS vars: this is the card's own
   illustrated palette (same exception as its font sizes above), tuned per-role rather than reused
   across the app. Kept here as one documented list instead of scattered bare rgba() so it reads as
   an intentional 14-value scale, not drift: 0.05 dot-texture · 0.09/0.15 face shadow · 0.12 stat
   track fill · 0.13 inner frame hairline · 0.2 divider-chip border · 0.22 divider line / back frame ·
   0.28 rank-badge shadow · 0.30 glyph drop-shadow · 0.34 outer frame border · 0.40 secondary ink
   (spark icon, tag separator) · 0.5 borders/dividers (corner tick, medal spark, divider-chip text,
   bullet glyph) · 0.6 body ink (divider-chip label, back eyebrow/title/stat-label/legend) · 0.72
   back bullet-list body text. */
.pc3d{perspective:900px;width:100%;}
.pc-tilt{position:relative;width:100%;aspect-ratio:5/7;transform-style:preserve-3d;transition:transform .5s var(--ease);will-change:transform;}
/* fix bug (2026-09-04): a stretched/skewed frame briefly escaping the rounded card frame during a
   flip — reported on v2's tease-open flip and on v3's rev-edge/rev-turn cards, both of which flip
   while an ANCESTOR is also actively animating (v2: the dominant card's own ambient float; v3: the
   lane's continuous drift). `.pc-tilt` (this rotation's sibling) already carried its own
   will-change:transform; `.pc-flip` — the element whose `transform` is what's actually being
   animated by every flip in the app — never did. Without it, the browser has to promote this element
   onto its own GPU compositing layer AT THE INSTANT the flip's transform animation starts, and if an
   ancestor is simultaneously mid-transform, that promotion can land a frame late — the exact "content
   briefly escapes its clip" symptom, since backface-visibility + overflow:hidden clipping is only
   reliable once the element is properly layered. Promoting it ahead of time (same treatment as
   .pc-tilt) removes the race entirely. v1's own flip never showed this because its flipping card is
   always the fan's CENTERED slot, whose own ancestor transform is idle (paintFan settles it at
   dead-center, xn/yn/rot all 0) while flipped — no concurrent ancestor animation to race against. */
.pc-flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s var(--ease);will-change:transform;}
.pc3d.flipped .pc-flip{transform:rotateY(180deg);}
/* border-radius promoted 14px->var(--r2) (2026-08-31, per corner-radius audit) — see .cr2's comment;
   same repeated "media frame" magic number, folded onto the same token. */
/* translateZ(0) (2026-09-04, same fix bug as .pc-flip's own comment above) — each FACE gets its own
   GPU layer too, so the overflow:hidden + border-radius clip that keeps art inside the rounded frame
   is enforced on an already-composited layer instead of being recomputed jointly with the ancestor's
   live transform every frame. `.pc-face.back` folds its own rotateY(180deg) into the same
   `transform` declaration since a layer-promotion hint can't be layered on via a second property. */
.pc-face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r2);overflow:hidden;box-shadow:var(--shadow-card);transform:translateZ(0);}
.pc-face.back{transform:rotateY(180deg) translateZ(0);}
/* ══ EDITORIAL CARD (front) ══ cream paper · ornate frame · roman numeral · iridescent hero · blue wedge. Always light (it's art — does not theme-switch). */
/* Editorial CSS poster (the 9 personas without approved final art) — restyled to match the
   approved real-card format now in use for Diamond Hand/Wave Rider (plain paper, no ornate
   frame/corner-brackets/roman-numeral badge/blue wedge): serif title top-center, art in the
   middle, Thai name+description bottom-left, asset tags as a bottom-right 2×2 grid, small
   edition-style numbering bottom-left. No real illustration exists for these 9 yet, so the
   middle art keeps the halo+glyph placeholder — everything AROUND it now matches the real cards. */
/* Rebuilt from absolute-positioned regions (name pinned top, art pinned by top%/height%, bottom
   info pinned by bottom px) to a real flex column, per direction ("cleaner, text shouldn't
   overlap the icon — currently cramped/tight"). The absolute version anchored the bottom-info
   block from the BOTTOM with no height limit, so a longer persona description grew UPWARD and
   could eat into the fixed 26%–72% art band above it — a real overlap risk that got worse the
   longer h.sig was. Flex column removes the possibility structurally: name/bottom-info each take
   exactly the height their own content needs (flex:0 0 auto), and the art region (flex:1 1 auto,
   min-height:0) simply absorbs whatever space is left — it shrinks instead of getting overlapped. */
.pcE{position:absolute;inset:0;background:#f4f1e9;color:#15171d;overflow:hidden;container-type:inline-size;display:flex;flex-direction:column;padding:20px var(--sp-stack) var(--sp-stack);}
.pcE-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:#f4f1e9;}
.pcE::before{content:"";position:absolute;inset:0;opacity:.55;background-image:radial-gradient(rgba(17,19,24,0.05) 0.5px,transparent 0.6px);background-size:3px 3px;pointer-events:none;}
.pcE-name{flex:0 0 auto;text-align:center;position:relative;z-index:3;margin-bottom:var(--sp-glue);}
.pcE-en{font-family:var(--serif);font-weight:var(--w-label);font-size:var(--pc-fs-1);line-height:1.05;color:#15171d;letter-spacing:0;}
@supports(width:1cqw){.pcE-en{font-size:clamp(20px,10cqw,30px);}}
.pcE-art{flex:1 1 auto;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;z-index:1;}
/* Halo (a big conic-gradient CIRCLE FILL behind the icon) removed, and the glyph's solid-black
   color dropped to a quiet ink-tint stroke — per direction, this was the spectrum gradient being
   used as a background FILL, exactly what the DNA's own accent rule warns against ("spectrum
   reserved for rare accent moments, never a fill") and it was visually louder than the icon it
   sat behind. The spectrum now lives ONLY on the divider + sparkles below — a genuinely small
   accent instead of a big colorful block competing with the character glyph. Icon is now a plain
   quiet monochrome line drawing (the DNA's own "mid layer"), matching the app's default "light
   weight" body logic instead of standing out as a bold black shape. */
.pcE-glyph{position:relative;z-index:2;transition:transform .3s var(--ease);}
.pcE-glyph svg{width:64px;height:64px;color:rgba(17,19,24,0.45);stroke-width:1.2;}
/* ✦ sparkles carry the spectrum accent via the same background-clip:text technique used for
   .spec-label elsewhere in the file, instead of a flat muted color. */
.pcE-spk{position:absolute;z-index:2;font-size:var(--pc-fs-3);background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;}
/* Bottom info rebuilt as ONE centered column (name → description → asset tags → edition #) —
   was a left/right split (text vs. a 2×2 tag grid) per direction "ให้กลุ่ม text ทั้งหมด align
   กลาง". The hairline divider is now a short spectrum-gradient bar instead of a flat rgba line —
   the card's one deliberate accent moment, echoing the sparkles above it. */
.pcE-bot{flex:0 0 auto;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--sp-glue);padding-top:var(--sp-inline);}
/* border-radius bumped 2px->4px (2026-08-31, per corner-radius audit) — see .alloc-dot's comment;
   no visual change (a 2px-tall bar renders as a full pill at either radius), just consistency. */
.pcE-divider{width:52px;height:2px;border-radius:4px;background:var(--spectrum);}
.pcE-th2{font-family:var(--font);font-weight:var(--w-label);font-size:var(--pc-fs-2);color:#15171d;}
.pcE-def{font-family:var(--font);font-weight:var(--w-body);font-size:var(--pc-fs-3);line-height:1.5;color:rgba(17,19,24,0.6);max-width:34ch;}
.pcE-ed{font-family:var(--font);font-size:var(--pc-fs-5);color:rgba(17,19,24,0.4);}
.pcE-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 10px;}
.pcE-tag{display:flex;align-items:center;gap:4px;font-family:var(--font);font-size:var(--pc-fs-5);color:rgba(17,19,24,0.75);white-space:nowrap;}
.pcE-tag i{font-style:normal;font-size:var(--pc-fs-5);background:var(--spectrum);-webkit-background-clip:text;background-clip:text;color:transparent;}
/* .pcv-wrap/.pcv-hint/.pcv-ctas/.pcv-btn (the old drag-to-rotate viewer's hint pill + flip button)
   and .hero-cardwrap (its wrapping frame) removed 2026-08-30 along with คู่มือ 1 — see the removal
   note near BOOK2_TAB. */
.hero-sig-c{font-size:var(--fs-sub);font-weight:var(--w-body);color:var(--muted);line-height:1.5;text-align:center;max-width:32ch;margin:0 auto 20px;}
/* 32ch is tuned to wrap cleanly on a real phone's narrow card; on tablet/pc the same card is ~670px+
   wide (see .toc/main.scroll's 760px reading column) so that cap forced most sig lines to wrap to 2
   lines with plenty of spare width sitting unused beside them (2026-09-01, per direction — "ชอบสร้าง
   สิ่งที่ค่อยๆ เติบโต..." specifically). Widened to 46ch, just enough for the longest-affected sig
   (measured ~426px natural width at --fs-sub/22px) to clear in one line with room to spare — still a
   real cap, not max-width:none, so an even longer sig can still wrap gracefully instead of stretching
   edge-to-edge. */
:root[data-view="tablet"] .hero-sig-c,:root[data-view="pc"] .hero-sig-c{max-width:46ch;}
@media(prefers-reduced-motion:reduce){.pc-tilt{transition:none!important;}}

/* ══ RESPONSIVE ══ data-view on <html>: mobile | tablet | pc (set by JS from window, or forced by demo panel) */
.shell{transition:max-width .3s var(--ease);}
/* ── SINGLE FLUID APP COLUMN ── the whole app is now ONE centered portrait column on the cloud
   backdrop. Earlier a wide pc shell (1200) held a narrower inner content column (--col 760) centered
   inside it, leaving big empty side-gutters — that double layer is exactly what read as "squeezed /
   framed" on desktop. Now content AND headers both simply fill this one column (no --col capping, no
   gutters); it grows modestly per view but never sprawls to a desktop-wide canvas this mobile-first
   flow was never designed for. Widths are a comfortable portrait measure, not pinned to any one device. */
:root[data-view="tablet"] .shell{max-width:820px;}
/* pc .shell used to cap at min(94vw,1120px) — that's exactly the "wide shell holding a narrower
   inner column" pattern the comment above says was removed (task-5): on a real 1440px+ monitor it
   left ~160px+ of dead paper-colored space on each side because nothing downstream needed the shell
   itself to be narrow — .q-scroll/.toc/main.scroll/.topbar/.book-tabbar below already hold
   their own 760px reading measure centered independently of shell width. Uncapped (2026-08-20, per
   direction "ให้ full-bleed เต็มจอจริงๆ") so pc is a genuinely seamless full-width page, matching the
   "SEAMLESS FULL PAGE" comment just below rather than contradicting it. */
:root[data-view="pc"] .shell{max-width:none;}
/* Bug fix (2026-09-03, responsive audit from 428px up, per direction "เนื้อหาบีบๆแคบๆ...ให้เต็ม
   หน้าจอ") — this 400px cap used to apply unconditionally on data-view="mobile", but the matching
   "phone frame" look (border/shadow/rounded corners, @media(min-width:480px) below) only turns on
   at ≥480px. Below that, a REAL phone in the extremely common 400-479px CSS-px range (412/414/420/
   428/430 — Pixel/Galaxy/iPhone Plus/Pro Max widths) got squeezed into a plain, unstyled 400px
   column with 12-30px of dead space down one side for no visual reason (confirmed live: shell
   clientWidth 400 at innerWidth 428). 320-399px phones were never affected (100% already loses to
   400px there) — only this specific mid-width band was. Un-capped here so .shell is edge-to-edge on
   any real width below 480px; the 400px card width is reinstated ONLY alongside the frame styling
   at ≥480px (see that rule), where a real phone this wide doesn't exist and it's actually a desktop
   previewing data-view=mobile. */
:root[data-view="mobile"] .shell{max-width:none;}
/* Section-to-section gap: mobile keeps the tighter 20px; tablet/pc get a touch more room (24px) —
   a wider canvas reads better with slightly more separation than the narrow phone frame needs. */
:root[data-view="tablet"],:root[data-view="pc"]{--sp-section:24px;}
/* Phone-frame preview on desktop (data-view=mobile at ≥480px): the frame is stretched to the
   viewport height by body's flex align-stretch, so it MUST scroll its own content internally like a
   real phone. Using overflow:hidden here clipped every screen taller than one viewport (the whole
   Book below the identity card, the quiz's ถัดไป button) into an unreachable void. overflow-y:auto
   makes the frame the scroll container; scrollbar hidden to preserve the device look. */
@media(min-width:480px){:root[data-view="mobile"] .shell{max-width:400px;border-radius:30px;border:1px solid var(--line);box-shadow:var(--shadow-frame);overflow-y:auto;overflow-x:hidden;scrollbar-width:none;}
:root[data-view="mobile"] .shell::-webkit-scrollbar{display:none;}
}
/* Desktop (pc/tablet) is a SEAMLESS FULL PAGE, not a framed card: full-width topbar + backgrounds,
   with reading content held to a comfortable centered measure inside. The cloud backdrop + shell
   side-borders below (line ~588) are scoped to the mobile-frame preview only — on real desktop they
   read as a narrow fixed frame with dead side-gutters, which is what task-5 asked us to remove. */
:root[data-view="pc"] .toc,
:root[data-view="tablet"] .toc,
:root[data-view="pc"] main.scroll,
:root[data-view="tablet"] main.scroll{max-width:760px;margin-left:auto;margin-right:auto;width:100%;}
/* Bug fix (2026-09-11, ipad/tablet breakpoint audit, per direction "navigation bottom ของ ipad,
   tablet size...เหลือ spacing ซ้าย-ขวา ห่างจากของจอเยอะ") — the "gap either side is minor" comment
   this replaced was only ever true right at the bottom of the tablet range (~768-820px, where .shell's
   own 820px cap already ties the real viewport down close to 760). data-view="tablet" actually covers
   EVERY width up to 1440px though (see applyView()), and .book-tabbar is position:fixed — centered via
   left:50%/translateX(-50%) against the TRUE viewport, not against .shell's 820px-capped box (.shell
   has no transform, so it doesn't become the containing block for a fixed descendant). So on any real
   tablet wider than ~820 — a landscape iPad (1024px+), most Android tablets in landscape, anything
   toward the top of the tablet band — the bar's own max-width:760px hard-capped its white/blur
   background too, leaving it floating mid-screen with a (viewport-760)/2 gap of empty page background
   on each side (132px+ at 1024px wide) instead of reaching the real screen edges. Exactly the same bug
   pc already had and already fixed below (see that comment) — ported the identical fix to tablet:
   drop the max-width cap so the background spans the full real viewport edge-to-edge, and hold the tab
   items inside the same 760px reading column with the (100% - 760px)/2 padding formula instead. */
:root[data-view="tablet"] .book-tabbar{max-width:none;padding-left:max(var(--sp-stack),calc((100% - 760px)/2));padding-right:max(var(--sp-stack),calc((100% - 760px)/2));}
/* pc's tabbar background used to inherit this same max-width:760px cap, but pc's .shell is uncapped
   (full-bleed, see above) — a fixed-width 760px bar centered via left:50%/translateX(-50%) inside a
   much wider viewport left the page's own background showing on both sides of the white/blur band,
   with the "settings" demo-fab floating disconnected past its right edge (2026-08-20, per direction
   "pc size navigation bottom (พื้นหลังแถบสีขาว) ยังไม่ full width เต็มจอ ต้องการให้แก้ไขเหมือน
   header"). Same fix as .topbar just above: drop the max-width cap so the bar itself spans the full
   viewport (background edge-to-edge), then use the SAME (100% - 760px)/2 padding formula to hold the
   5 tab items inside the identical 760px column — so "เหมือน header" for the background, "fix
   position เดิม เหมือน tablet" for the icons: only the backdrop changes, not where the items sit. */
:root[data-view="pc"] .book-tabbar{max-width:none;padding-left:max(var(--sp-stack),calc((100% - 760px)/2));padding-right:max(var(--sp-stack),calc((100% - 760px)/2));}
:root[data-view="tablet"] .splash,:root[data-view="pc"] .splash{padding-left:40px;padding-right:40px;}
/* Bottom clearance fix (2026-09-01, per direction — splash CTA sat flush against the true bottom
   edge on tablet/pc, unlike the quiz nav's "ถัดไป" button which clears it via .q-scroll's own 34px
   bottom padding). .splash's base bottom padding is only --sp-card-pad-sm (16px) — fine on mobile
   where .sp-cta gets its own sticky-bottom safe-area padding (see the mobile-only rule above), but
   tablet/pc never got an equivalent, so .sp-cta's margin-top:auto just parks the button against that
   thin 16px gap. Matched to .q-scroll's own literal 34px so the CTA lands the same distance from the
   screen edge as the quiz page's button, same "measured within 1px" bar the mobile rules already use. */
:root[data-view="tablet"] .splash,:root[data-view="pc"] .splash{padding-bottom:34px;}
/* Go-to-top — appended to <body>, JS-positioned against the shell's right edge (works in every
   view mode: on real mobile the window scrolls, on the desktop phone-frame the .shell scrolls, so
   the scroll listener watches both). Hidden until scrolled past ~one screen. */
.go-top{position:fixed;z-index:89;width:44px;height:44px;border-radius:50%;border:1px solid var(--line-soft);background:var(--white);color:var(--ink);box-shadow:var(--shadow-md);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateY(8px);transition:opacity .2s var(--ease),transform .2s var(--ease),visibility .2s;}
.go-top.show{opacity:1;visibility:visible;transform:translateY(0);}
.go-top:active{transform:scale(.92);}
.go-top svg{width:var(--ic-lg);height:var(--ic-lg);}

.fade{animation:fade .32s var(--ease);}
@keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
/* desktop chrome — the app FILLS the full viewport height (target 1440×1024) instead of shrinking to a short floating card that left dead space below on light pages; base body already stretches the shell to 100vh, so here we only paint the surround + a subtle side-border frame to set the app column off against the cloud backdrop */
/* Cloud backdrop + shell side-borders (the "device floating on a desk" frame) apply ONLY to the
   mobile-frame preview. Real desktop (pc/tablet) is a seamless full-bleed page — no gray gutters,
   no side frame (task 5). */
@media(min-width:480px){:root[data-view="mobile"] body{background:var(--cloud);}:root[data-view="mobile"] .shell{border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft);}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;}}
/* ══ CONTAINER SCROLL ANIMATION DNA ══ .scroll-reveal sections tip back in 3D perspective while
   still below the fold and settle flat as scroll brings them into place — scroll paces the reveal,
   it doesn't gate it (see revealTick() near the bottom of the script). Reduced-motion collapses
   straight to flat, content is never hidden, only its entrance timing changes.
   2026-08-19 system-wide motion audit — extended from the original 5 tabbar screens to every
   remaining screen, closing the exact gap flagged ("หน้าคู่มือ (Playbook) ยังไม่ครบ"): Book v2's
   3 non-identity tabs (analysis/portfolio/journey — efin-banner, AI Insight, radar/trait/alloc
   card, dd-tabs card, 6-ด้าน sides card, route-steps card, library-teaser card) had ZERO scroll
   motion and its <main> was even missing the base .fade page-enter every other tabbar screen gets
   — both fixed. Also added to Home's postEventHTML() card (missed in the original pass) and to
   Library's single card. Quiz/Consent/Reveal (previously deliberately skipped as "scoped to the 5
   tabbar screens only") now carry .scroll-reveal too (.q-head, .consent-body, the reveal-scene
   wrapper) so the same engine governs every screen — on these short single-viewport screens it
   mostly renders pre-settled (nothing to tip from), but it keeps the system honest if their content
   ever grows past one viewport, and it's zero-risk since it's purely additive to an existing,
   already-proven mechanism. Splash intentionally untouched — its ambient asset-scatter + auto-fan
   carousel is its own deliberate attract-motion, not a gap. */
.scroll-reveal{will-change:transform;transform-origin:50% 100%;}
@media(prefers-reduced-motion:reduce){.scroll-reveal{transform:none!important;}}
@keyframes crFloat{0%{transform:translateY(0);}100%{transform:translateY(-12px);}}
</style>

     scripts always execute after the document finishes parsing, i.e. AFTER the classic <script>
     below has already run its first synchronous render(). So this can't just self-mount on load
     like the kit's original standalone version did; instead it exposes mountLiquidMetalCta (the
     splash hero button) and mountLiquidMetalButtonInto (every other Liquid Metal button — header
     QR pill, in-content secondary CTAs; takes an explicit slot selector + 'hero'|'compact' preset)
     on window, and the app calls whichever one applies from inside each screen's render function,
     every time that screen puts a fresh slot on screen. The second inline module is the bridge —
     it's what makes those exports reachable from the classic (non-module) script below, since
     module scope and classic-script scope don't share globals. -->
<script type="module" src="js/liquid-metal-cta.js"></script>
<script type="module">
  import { mountLiquidMetalCta, mountLiquidMetalButtonInto } from './js/liquid-metal-cta.js';
  window.mountLiquidMetalCta = mountLiquidMetalCta;
  window.mountLiquidMetalButtonInto = mountLiquidMetalButtonInto;

</script>

  var gws=root.querySelectorAll('.hero-gw');

  gws.forEach(function(gw){
    var layers=gw.querySelectorAll('.hero-glow-base,.hero-glow-energy');
    var w=gw.clientWidth,h=gw.clientHeight;
    if(w&&h&&layers.length){

      for(var i=0;i<layers.length;i++){layers[i].style.width=d+'px';layers[i].style.height=d+'px';}
    }

     up the current .hero-gw/layers fresh each fire rather than closing over these, since every
     render() rebuilds .hero-gw's DOM from scratch. */

     enters the viewport, not on page load. One-shot per element; disconnect the prior observer since
     render() gives us a brand-new (detached-from-the-old-observer) .hero-gw each time. */
  var pending=[].slice.call(gws).filter(function(gw){return !gw.classList.contains('glow-on');});

  if(!window.IntersectionObserver){pending.forEach(function(gw){gw.classList.add('glow-on');});return;}

    // scrolling before catching up. Clearing the transform before reading gets the TRUE untransformed
    // position every tick (costs one extra reflow per .scroll-reveal element, negligible at this
    // count). Also scale the perspective distance with the element's own height (floor 1000px, same
    // as before, for anything at/under that height) so a very tall card foreshortens by roughly the
    // same visual amount as a short one under the same 12deg tilt, instead of collapsing harder the
    // taller it is.
    if(el.style.transform)el.style.transform='';
    var rect=el.getBoundingClientRect();
    if(rect.width===0&&rect.height===0)return; // display:none (e.g. an inactive book2 tab panel)
    var start=vh*0.92,end=vh*0.42; // enters the reveal ~92% down the viewport, settles flat by ~42%
    var p=atBottom?1:Math.max(0,Math.min(1,(start-rect.top)/(start-end)));
    // Bug fix (2026-09-11 responsive audit): a fully-settled element (p>=1) used to still get an
    // explicit 'perspective(Npx) rotateX(0deg) translateY(0px) scale(1.000)' string — numerically a
    // no-op (0deg/0px/1.000 render identically to no transform at all), but NOT the same as actually
    // having no transform: the browser still resolves it to a matrix3d(...) with a live perspective
    // (m34) term and keeps the element in its own 3D/will-change compositing layer. Reproduced this
    // rendering an ENTIRE settled .scroll-reveal section (the home stat-tile row; separately the
    // เดินบูธ route/map card) fully invisible — content present in the DOM with opacity:1 and a
    // "no-op" matrix3d, painting nothing, confirmed fixed instantly by clearing the transform. Since
    // "content is never hidden" is this system's own explicit contract (see the CONTAINER SCROLL
    // ANIMATION DNA comment above), a settled element now drops the transform entirely instead of
    // carrying a numerically-equivalent 3D matrix — same flat result, no lingering perspective
    // context once there's nothing left to animate.
    if(p>=1){el.style.transform='';return;}
    var persp=Math.max(1000,rect.height*2.2);
    el.style.transform='perspective('+Math.round(persp)+'px) rotateX('+((1-p)*12).toFixed(2)+'deg) translateY('+((1-p)*26).toFixed(1)+'px) scale('+(0.95+p*0.05).toFixed(3)+')';
  });
}

function radarSVG(vals,hue){

  for(var k=0;k<6;k++){var a=(-90+60*k)*Math.PI/180;var r=R*vals[k]/100;pts.push([Math.cos(a)*r,Math.sin(a)*r]);}
  function ring(s){var o='';for(var k=0;k<6;k++){var a=(-90+60*k)*Math.PI/180;o+=(k?' ':'')+(Math.cos(a)*R*s).toFixed(1)+','+(Math.sin(a)*R*s).toFixed(1);}return o;}
  function axis(k){var a=(-90+60*k)*Math.PI/180;return '<line class="rk-axis" pathLength="1" x1="0" y1="0" x2="'+(Math.cos(a)*R).toFixed(1)+'" y2="'+(Math.sin(a)*R).toFixed(1)+'"/>';}
  var poly=pts.map(function(p){return p[0].toFixed(1)+','+p[1].toFixed(1);}).join(' ');

  var dots='';pts.forEach(function(p,k){dots+='<circle class="rk-dot" data-i="'+k+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"><title>'+RADAR_AXES[k]+' '+vals[k]+'</title></circle>';});
  var lab=[[0,-104,'middle'],[104,-52,'start'],[104,60,'start'],[0,116,'middle'],[-104,60,'end'],[-104,-52,'end']];
  /* font-size bumped 10.5->14 (2026-08-29, per direction "text size เท่ากับ" .int-bar-note's own
     --fs-eyebrow/14px) — was noticeably smaller than every other piece of copy on the page. */
  var labels='';for(var k=0;k<6;k++){labels+='<text class="rk-lab" data-i="'+k+'" x="'+lab[k][0]+'" y="'+lab[k][1]+'" text-anchor="'+lab[k][2]+'" font-family="'+SVGFONT+'" font-size="14" font-weight="500">'+RADAR_AXES[k]+' '+vals[k]+'</text>';}
  return '<svg width="340" height="244" viewBox="0 0 340 244" style="max-width:100%" role="img" aria-label="พอร์ตลงทุน '+RESULT.hero.th+'"><title>พอร์ตลงทุน '+RESULT.hero.th+'</title><g transform="translate('+cx+','+cy+')">'+
    '<polygon class="rk-grid" points="'+ring(1)+'"/><polygon class="rk-grid" points="'+ring(.75)+'"/><polygon class="rk-grid" points="'+ring(.5)+'"/><polygon class="rk-grid" points="'+ring(.25)+'"/>'+
    axis(0)+axis(1)+axis(2)+axis(3)+axis(4)+axis(5)+
    '<polygon class="rk-poly" points="'+poly+'" fill="rgba('+hue+',0.14)" stroke-linejoin="round"/>'+dots+labels+'</g></svg>';

/* ── Dashboard chart-reveal (Motion DNA: Section → Card Reveal → Data Reveal → Chart Animation →
   Final State) — observes each chart's containing card and adds .viz-in the first time it enters the
   viewport; the CSS above ("CHART MOTION + INTERACTION") does the actual animating per chart type.
   Called once per render from renderBook() right after its HTML lands in the DOM, and naturally
   re-fires for Book's tab-hidden (display:none) chart panels once the user switches to them, since
   the observer keeps watching regardless of the .b2-panel/.show toggle. One-time per
   element (unobserve after firing) — re-scrolling past an already-revealed chart never re-plays it,
   matching the reference's "not a decorative loop" rule. */
function initCharts(scope){
  var boxes=(scope||root).querySelectorAll('.conf-box,.risk-box,.trait-sec,.alloc-sec,.radar-sec');
  if(!boxes.length)return;
  if(!window.IntersectionObserver){boxes.forEach(function(b){b.classList.add('viz-in');});return;}
  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(e){if(e.isIntersecting){e.target.classList.add('viz-in');io.unobserve(e.target);}});
  },{threshold:.3});
  boxes.forEach(function(b){io.observe(b);});
}

/* confidenceScore (2026-09-21, per direction "สูตร Confidence — ใช้สูตรใหม่") — replaces the quiz-only
   identity/behavior/riskAlign/discipline formula (compute()'s r.conf/r.subs/r.confLevel, now unused by
   the UI) with the BT2026 Dry-run's 4-part evidence formula, weights 35/25/25/15 = 100:
   ความรู้ (เก็บความรู้) · รู้จักตัวเอง · ลงมือ · ความกว้าง. The Dry-run computes this server-side, so the
   per-part rules below are OUR design estimate from signals this app really has (like riskLevel/radar
   elsewhere) — only the 4 parts + weights come from the source. It measures "how much evidence the
   system has to read you", never investing skill or returns (see the glossary entry), so it is LOW
   for a quiz-only visitor and rises as games/booths get played. Computed live (not frozen in RESULT)
   because it moves with every game/booth. */
var CONF_INSIGHT_TOTAL=null;
function confInsightTotal(){
  if(CONF_INSIGHT_TOTAL===null){var seen={},n=0;
    function add(kind,idx){playSet(kind,idx).questions.forEach(function(q){if(q.insight&&!seen[q.insight]){seen[q.insight]=true;n++;}});}
    for(var gi=0;gi<MINIGAME_Q.length;gi++)add('game',gi);
    for(var bi=0;bi<BOOTH_Q.length;bi++)add('booth',bi);
    CONF_INSIGHT_TOTAL=n||1;}
  return CONF_INSIGHT_TOTAL;
}
function confidenceScore(r){
  var knowledge=Math.round(35*Math.min(1,learnedInsights().length/confInsightTotal()));
  // รู้จักตัวเอง: quiz done 10 + confirmed interests (up to 3 × 2) + declared-vs-revealed measured in game 1 (5) + that gap actually small (4)
  var g0=!!GAME_ANSWERS[0];
  var self=10+Math.min(3,(r.interests||[]).length)*2+(g0?5:0)+(g0&&Math.abs(r.gap)<=1.5?4:0);
  // ลงมือ: games played (of 6) → 15, booth activities (of ACTIVITY_NEED) → 10
  var action=Math.round(15*gamesPlayedCount()/SIDES.length)+Math.round(10*Math.min(1,boothActivityCount()/ACTIVITY_NEED));
  // ความกว้าง: distinct booths touched (check-in or activity) of all booths → 15
  var touched=0;for(var i=0;i<BOOTHS.length;i++){if((BOOTH_CHK[i]&&BOOTH_CHK[i].size>0)||BOOTH_ACT[i])touched++;}
  var breadth=Math.round(15*touched/BOOTHS.length);
  var conf=Math.min(100,knowledge+self+action+breadth);
  var level=conf>=85?'สูงมาก - หลักฐานมากพอจะอ่านคุณ':(conf>=70?'สูง - หลักฐานค่อนข้างครบ':(conf>=55?'ปานกลาง - พอเห็นทิศทาง':'กำลังก่อตัว - ยังรู้จักคุณน้อย'));
  return {conf:conf,level:level,subs:{knowledge:knowledge,self:self,action:action,breadth:breadth}};
}

/* Largest-remainder rounding — turns an array of float shares (summing to ~100) into integer %
   that still sum to EXACTLY 100, so "รวมทุกแท่ง = 100%" in the caption below is always literally true. */
function roundPct(arr){
  var floors=arr.map(Math.floor);

  var order=arr.map(function(v,i){return i;}).sort(function(a,b){return (arr[b]-floors[b])-(arr[a]-floors[a]);});
  for(var k=0;k<left;k++)floors[order[k]]++;

}

     opts:['ใช่ ซื้อทองทั้งหมด ปลอดภัยที่สุด','ไม่ แบ่งไว้ส่วนหนึ่งพอ ที่เหลือไปอย่างอื่น','ไม่ซื้อเลย ชอบของที่งอกเงยกว่า'],
     insight:'ทองไม่สร้างรายได้ระหว่างถือ จึงมักใช้เป็นส่วนหนึ่งของภาพรวม ไม่ใช่ทั้งหมด'}
  ]}
];
var GAME_PLAYED={0:true,1:true},GAME_OPEN=null;
var GAME_ANSWERS={};
function gamesPlayedCount(){return SIDES.reduce(function(n,_,i){return n+(GAME_PLAYED[i]?1:0);},0);}
function playSet(kind,idx){return kind==='game'?MINIGAME_Q[idx]:BOOTH_Q[idx];}
function playLabel(kind,idx){return kind==='game'?SIDES[idx].title:BOOTHS[idx].game;}
/* learnedInsights — every distinct question insight the player has picked up so far this session,
   derived from GAME_PLAYED/BOOTH_ACT (the real committed-completion flags) rather than a separate
   mutable log, same "derive from real state" convention sideResult()/boothPointsTotal() already use.
   `inProgress` ({kind,idx}) lets a game/booth still on its OWN result screen count immediately —
   completePlay() (which flips GAME_PLAYED/BOOTH_ACT true) only runs once the player taps the CTA to
   leave that screen, but the running total should already reflect what they just saw, not lag one
   screen behind. Text-deduped (a repeated insight across games only counts once), matching how the
   knowledge ledger below also only lists each concept the first time it's learned. */
function learnedInsights(inProgress){
  var seen={},out=[];
  function add(kind,idx){
    playSet(kind,idx).questions.forEach(function(q){
      if(q.insight&&!seen[q.insight]){seen[q.insight]=true;out.push({text:q.insight,kind:kind,idx:idx});}
    });
  }
  for(var gi=0;gi<MINIGAME_Q.length;gi++)if(GAME_PLAYED[gi])add('game',gi);
  for(var bi=0;bi<BOOTH_Q.length;bi++)if(BOOTH_ACT[bi])add('booth',bi);
  if(inProgress&&!(inProgress.kind==='game'?GAME_PLAYED[inProgress.idx]:BOOTH_ACT[inProgress.idx]))add(inProgress.kind,inProgress.idx);
  return out;
}
/* learnedLedgerHTML — "เรื่องที่คุณเข้าใจแล้ว" card for the Playbook's เส้นทาง (journey) tab: a
   personal, dynamic recap of every distinct insight learnedInsights() has captured from mini-games
   actually played, tagged by source game — NOT the same thing as คลังความรู้ (renderLibrary), which
   is a static 41-article/8-category reference shelf (this card sits directly above that shelf in
   renderBook, specific-before-general). Reuses ticketHistoryHTML's exact .card/.sides-hd/.s-ey/.s-h/
   .s-sub header + .side-item/.list-row.side-row/.side-num/.side-cx/.side-t/.side-s row shape (2026-09-10)
   rather than inventing a new list recipe — .side-num carries the source game/booth's own icon (done-
   filled, same "this is settled" language .side-num.done already means everywhere else) instead of a
   step number, .side-t is the insight text itself, .side-s names which game it came from. Empty state
   (nothing played yet) mirrors ticketHistoryHTML's own row-less-section absence — this whole card is
   simply omitted by its one call site (renderBook's journey panel) rather than rendering a hollow
   card, so a visitor who hasn't reached the games yet sees no half-empty ledger. */
function learnedLedgerHTML(){
  var items=learnedInsights();
  if(!items.length)return '';
  var rows=items.map(function(l,i){
    var icon=l.kind==='game'?ic(SIDES[l.idx].icon):ic(BOOTHS[l.idx].icon);
    return '<article class="side-item"'+(i===items.length-1?' style="border-bottom:none"':'')+'>'+
      '<div class="list-row side-row" style="cursor:default"><div class="side-num done">'+icon+'</div>'+
      '<div class="side-cx"><div class="side-t">'+l.text+'</div><div class="side-s">จากเกม '+playLabel(l.kind,l.idx)+'</div></div></div></article>';
  }).join('');
  return '<section class="card scroll-reveal"><div class="sides-hd"><div class="s-ey">สะสมจากการเล่นเกมวันนี้</div><h2 class="s-h">เรื่องที่คุณเข้าใจแล้ว</h2>'+
    '<p class="s-sub" style="margin-bottom:2px">'+items.length+' เรื่อง · อัปเดตอัตโนมัติทุกครั้งที่เล่นเกมจบ</p></div>'+rows+'</section>';
}

/* ── RESPONSIVE VIEW (mobile | tablet | pc) ── driven by window, overridable via demo panel ── */
/* Both 'view' and 'draw' default to 'auto' (2026-08-26, per direction — "อัตโนมัติ default ไว้ที่
   mobile size" / "...ไว้ที่ครบเงื่อนไขแล้ว") so the demo panel shows the neutral "อัตโนมัติ" option
   selected, not a manually-forced one — but 'auto' itself is now hard-biased to resolve to mobile
   (see applyView) and to eligible (see renderBooth) rather than reacting to real width/chk/act
   counts. PC/แท็บเล็ต and ยังขาด remain available as explicit overrides. */
/* eventPhase (2026-08-28, per direction "แยกเป็น ช่วง Pre-Event, ช่วง On-Event") — 'pre': the QR-scan
   header pill is hidden (register takes its slot instead, see appHeader/mountHeaderQR) since there's
   nothing at the (unopened) venue to scan yet. 'on': QR pill shows. Switching TO 'on' also resets BOOTH_CHK/BOOTH_ACT/GAME_PLAYED/DRAW_JOINED to empty (see
   buildDemo's segPhase handler) — simulates a just-arrived attendee with zero real progress, so the
   sections that are supposed to start locked at On-Event (home counters/next-step, booth zone
   activities, game "ด้านอื่นในคู่มือ") actually render locked instead of this demo's old pre-seeded
   "already done" mock defaults. Switching to 'pre' does NOT touch RESULT/quizDone — a pre-event
   visitor may already have taken the quiz online, so identity content stays independently gated on
   RESULT alone (see renderBook's empty state, buildRoute's personalized flag). */
/* Defaults flipped 2026-09-10, per direction — On-Event is now the default preview (eventPhase),
   with an identity already on file (quizDone, seeded at bootstrap via seedPersonaResult — see the
   bottom of this file), the Booth Journey v2 map (boothVer), and the draw-status card genuinely
   computed from that seeded state's real chk/act counts (which start below CHECKIN_NEED/
   ACTIVITY_NEED, so it reads "ยังขาด" out of the box — see the 'auto' branch in renderBooth this
   direction restored). Switching the ช่วงงาน segment to Pre-Event is the one way back to the
   splash/quiz flow (RESULT/quizDone/boothVer aren't touched by that switch, same as before). */
var DEMO={view:'auto',quizDone:true,draw:'auto',eventPhase:'on',multiTicket:false,boothVer:'v2',registered:true}; // draw: 'auto' (default, real boothCheckinCount()/boothActivityCount() math) | 'ok' (force eligible) | 'need' (force not-eligible) — see renderBooth. registered (2026-09-04, per direction "จำลองเคส...ลูกค้าที่เข้ามาเล่น quiz dna โดยที่ยังไม่ได้ลงทะเบียน"): true (default, the real/active state) = the normal full Book; false previews a quiz-taker who never went through the registration site — renderBook locks to just the ตัวตน tab, truncates it at จุดแข็ง/จุดที่ต้องระวัง, and drops the bottom app-tabbar (see renderBook's `unreg` branches + book2Tabs()). boothVer (2026-09-03, per direction "อยากเพิ่ม หน้าเดินบูธ อีกเวอร์ชัน แยก preview ในเดโม"): 'v1' = the shipped booth page (static map image + separate route list, unchanged); 'v2' = a UX-enhancement preview per the Booth Journey spec — the SAME sections/layout/content, but the map gets numbered semantic markers synced 1:1 with the route steps, plus two-way Step↔Map focus. Everything v2 adds is gated on this flag so v1 stays byte-identical. (splashVer removed 2026-09-18, per direction "preview card เอา v1 ออก" — the splash fan carousel's "การ์ดมีชีวิต" build (added 2026-09-09, promoted to shipped default 2026-09-11) is now the only splash preview; v1 the plain static carousel, v3/v5 the "3D Character Card Flow" field and its living-card variant, were all removed the same day/session — see renderSplash's own comment for that full history.) eventPhase default flipped 'on'->'pre' (2026-08-28, per follow-up direction "จำลองเคส...อยากให้ preview default ที่ Pre-Event ก่อน") — see the comment above. multiTicket: false by default (2026-09-02) — the single-ticket case stays the active/real state; see MULTI_TICKET_DEMO. (sumTitleVer — a brief demo-panel toggle comparing 2 title treatments for renderPlaySummary's game-name — removed 2026-09-11, per direction "เลือกแบบ v2 และเอาแบบ v1 ออกได้เลย": v2, the DNA quiz's .q-icon-bare + .q-title header, is now just how renderPlaySummary always renders — see its own comment there.)
/* 'auto' resolves from real window.innerWidth again (2026-09-10 responsive audit — the 2026-08-26
   "always resolve to mobile" change meant a real event-tablet visitor (768–1024px wide) never got
   data-view="tablet": the .shell/topbar/book-tabbar all clamped to the 400px phone-frame width,
   leaving the header/content/bottom-nav stranded in a narrow centered column with huge side margins
   on an actual iPad — see DESIGN-DNA.md §"Device reality first: attendees use whatever phone/
   event-tablet is in hand". Restored w<768→mobile/w<1440→tablet/else pc so real devices get their
   matching layout; PC/แท็บเล็ต/มือถือ stay available as explicit demo-panel overrides for previewing
   other sizes regardless of the actual window. */
function applyView(){
  var m=DEMO.view,v;
  if(m==='pc')v='pc';else if(m==='tablet')v='tablet';else if(m==='mobile')v='mobile';
  else v=window.innerWidth<768?'mobile':(window.innerWidth<1440?'tablet':'pc');
  document.documentElement.setAttribute('data-view',v);
}
window.addEventListener('resize',function(){if(DEMO.view==='auto')applyView();});

/* synthesize a plausible RESULT for a forced persona and jump to the Book (demo shortcut).
   gap:0 here used to mean the demo persona picker could NEVER show a real post-event difference —
   evoCompute() only shifts family when |gap|>=2, so an always-aligned demo always rendered
   'confirmed'/'gathering' (same card both tabs), which read as "the preview doesn't actually
   change between before/after." Now simulates a real divergence (±4) in whichever direction moves
   AWAY from the picked persona's own family, plus enough activity for evoCompute's evidence gate
   (sig>=3) — so picking ANY of the 12 demo personas reliably lands on a genuine 'evolved' state,
   and thanks to EVO_REP above, the post-event card is always real photographed art (diamondhand/
   waverider), never the CSS mockup, on that side. */
/* Build a plausible RESULT (+ demo activity) for a forced persona WITHOUT navigating — shared by the
   demo persona picker (which then jumps to Book) and the demo Character-Animation Play button (which
   jumps to the cardreveal instead). Splitting the seed from the navigation lets both entry points
   reuse the exact same synthesized result. */
function seedPersonaResult(key){
  var h=HEROES[key];
  var simGap=h.fam==='V'?-4:4;
  RESULT={hero:h,heroKey:key,declared:h.riskLevel,revealed:Math.max(1,Math.min(10,h.riskLevel+simGap)),gap:simGap,
    conf:74,confLevel:'สูง - สอดคล้องดี',
    subs:{identity:16,behavior:16,riskAlign:18,discipline:15},knowledge:'intermediate',horizon:'mid',votes:{},interests:[0,2,4]};
  GAME_PLAYED={0:true,1:true,2:true,3:true};GAME_ANSWERS={};BOOTH_CHK={0:new Set([0])};BOOTH_ACT={0:true};BOOTH_ANSWERS={};EFIN_CHECKED_IN=true;
}

/* Go-to-top FAB (system-wide, all view modes incl. desktop/tablet). The page itself is what
   scrolls (the tabbar is position:fixed to the real viewport, not to #root/.shell), so the FAB is
   anchored the same way: `bottom` is a fixed viewport offset (cleared above the tabbar), not
   computed from the shell's own bounding rect — that used to drift far off-screen on tall pages
   once scrolled deep, since the shell's rect.bottom moves with scroll while its rect.height does
   NOT track total content height. Only the horizontal position (left) needs the shell's rect, to
   hug the phone-frame's right edge instead of the full browser width on tablet/pc. */
function buildGoTop(){
  var btn=document.createElement('button');
  btn.className='go-top';btn.id='goTop';btn.setAttribute('aria-label','กลับขึ้นบนสุด');
  btn.innerHTML=ic('lc-arrow-up');
  document.body.appendChild(btn);
  var root=document.getElementById('root');
  var scrollTopNow=function(){return Math.max(window.scrollY||0,document.documentElement.scrollTop||0,root.scrollTop||0);};
  var reposition=function(){
    var r=root.getBoundingClientRect();
    btn.style.left=Math.round(r.right-16-btn.offsetWidth)+'px';
    var tabbar=document.querySelector('.book-tabbar');
    var clear=tabbar?tabbar.getBoundingClientRect().height:64;
    btn.style.bottom=Math.round(clear+16)+'px';
  };
  /* Threshold made relative to each screen's OWN scrollable range, not a flat 70%-of-viewport
     (2026-08-15, per direction "ปุ่ม go to top เพิ่มในหน้า เกมส์หลัก และ โปรไฟล์ด้วย") — Games and
     Profile are short enough that (scrollHeight - clientHeight) never reaches 70% of the viewport
     height, so the button was mathematically unreachable there, not just rare — no amount of
     scrolling could ever satisfy the old fixed threshold. Long pages (Book) are unaffected since
     min() just keeps the original 70%-of-viewport figure whenever a screen's own range comfortably
     exceeds it. */
  var onScroll=function(){
    var maxRoot=Math.max(0,root.scrollHeight-root.clientHeight);
    var maxDoc=Math.max(0,document.documentElement.scrollHeight-window.innerHeight);
    var max=Math.max(maxRoot,maxDoc);
    var thresh=Math.min(window.innerHeight*0.7,max*0.5);
    btn.classList.toggle('show',max>0&&scrollTopNow()>thresh&&scrollTopNow()>150);
    reposition();
  };
  window.addEventListener('scroll',onScroll,{passive:true});
  root.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('resize',reposition,{passive:true});
  reposition();
  btn.onclick=function(){window.scrollTo({top:0,behavior:'smooth'});root.scrollTo({top:0,behavior:'smooth'});};
}

/* Default demo state (2026-09-10, per direction): "ทำแบบทดสอบตัวตนแล้ว" out of the box — seed a
   RESULT before the very first render/buildDemo so DEMO.eventPhase:'on''s render() gate (which
   redirects splash/quiz/etc. to 'book' once RESULT exists, else 'home') lands on the Book page
   immediately instead of the empty "no identity yet" state. Booth check-in/activity start at
   seedPersonaResult's own baseline (booth 0 only) — below CHECKIN_NEED/ACTIVITY_NEED — so the
   Booth tab's draw-status card genuinely (not forced) reads "ยังขาด" by default too. */
seedPersonaResult('sage');
RESULT.revealed=RESULT.declared;RESULT.gap=0; // the PDF sample reads "สอดคล้อง (Aligned)": what they said = what they did
applyView();buildGoTop();
render();
</script>
